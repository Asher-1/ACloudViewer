name: cloudViewer
channels:
  - conda-forge
dependencies:
  - cmake=3.31.8
  - python=3.10
  - pip
  - ninja
  - pkg-config
  - eigen=3.4.*
  - boost=1.84.* # pcl and reconstruction
  - flann=1.9.*
  - qhull=2020.2
  - xerces-c=3.2.* # reconstruction or PLUGIN_IO_QE57
  - qt=5.15.*
  - cgal=5.*
  - ffmpeg=6.1.*
  - zlib # PLUGIN_IO_QPHOTOSCAN
  - laszip # PLUGIN_IO_QLAS
  - openssl # For curl build on Windows
  - libcurl=8.14.* # For curl support
  - vulkan-headers
  - vulkan-loader
  - shaderc # glslc, used only while embedding ggml Vulkan shaders
  - spirv-headers
  - pip: # for python plugins
    - numpy==1.26.4
    - pybind11>=2.6.0
    - laspy>=2.0
    - pywin32
    - typing_extensions
