<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fdFace" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="fdGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="10" fill="url(#fdBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="9" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.55"/>

  <!-- Photo frame -->
  <rect x="10" y="12" width="44" height="36" rx="3" fill="#312e81" stroke="#6366f1" stroke-width="0.8" opacity="0.9"/>

  <!-- Face oval -->
  <ellipse cx="32" cy="30" rx="11" ry="13" fill="url(#fdFace)" opacity="0.85"/>

  <!-- Eyes -->
  <ellipse cx="27" cy="27" rx="2.2" ry="1.6" fill="#1e1b4b" opacity="0.75"/>
  <ellipse cx="37" cy="27" rx="2.2" ry="1.6" fill="#1e1b4b" opacity="0.75"/>

  <!-- Nose + mouth hint -->
  <path d="M32 29 L32 32" stroke="#1e1b4b" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
  <path d="M28 35 Q32 37 36 35" fill="none" stroke="#1e1b4b" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>

  <!-- Detection bounding box (cyan) -->
  <rect x="18" y="16" width="28" height="30" rx="1.5" fill="none" stroke="#22d3ee" stroke-width="1.6" filter="url(#fdGlow)"/>

  <!-- 5 SCRFD landmarks (gold) -->
  <g fill="#fde047" filter="url(#fdGlow)">
    <circle cx="27" cy="27" r="1.5"/>
    <circle cx="37" cy="27" r="1.5"/>
    <circle cx="32" cy="31" r="1.5"/>
    <circle cx="29" cy="35" r="1.3"/>
    <circle cx="35" cy="35" r="1.3"/>
  </g>

  <!-- Arc / identity hint -->
  <path d="M48 18 Q54 24 48 30" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <text x="32" y="56" text-anchor="middle" fill="#e9d5ff" font-family="sans-serif" font-size="5.2" font-weight="bold" letter-spacing="0.1">Face Detect</text>
</svg>
