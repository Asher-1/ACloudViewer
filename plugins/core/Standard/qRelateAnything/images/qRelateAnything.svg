<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">RelateAnything scene relationship graph</title>
  <desc id="desc">A person rides a horse; directed scene relations connect them to a video frame.</desc>
  <defs>
    <linearGradient id="background" x1="18" y1="12" x2="238" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111d45"/>
      <stop offset="1" stop-color="#24134d"/>
    </linearGradient>
    <linearGradient id="cyanNode" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#66e9ff"/>
      <stop offset="1" stop-color="#2ca6e8"/>
    </linearGradient>
    <linearGradient id="violetNode" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c18bff"/>
      <stop offset="1" stop-color="#7655ed"/>
    </linearGradient>
    <linearGradient id="orangeNode" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd37b"/>
      <stop offset="1" stop-color="#f08a48"/>
    </linearGradient>
    <linearGradient id="relation" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55e5be"/>
      <stop offset="1" stop-color="#22a88d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#05091c" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="42" fill="url(#background)"/>
  <path d="M22 42C68 13 188 13 234 42" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="226" cy="31" r="4" fill="#55e5be"/>
  <circle cx="211" cy="31" r="4" fill="#ffd37b"/>

  <!-- A compact scene graph: detected objects connected by directed relations. -->
  <g fill="none" stroke="#7debd2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 79 105 87m-10-8 10 8-12 1"/>
    <path d="M179 106h20v-6m-5 6 5-6 5 6"/>
    <path d="M160 121 129 144m4-11-4 11 12-1"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="27" y="52" width="61" height="47" rx="13" fill="url(#cyanNode)"/>
    <rect x="169" y="52" width="61" height="47" rx="13" fill="url(#violetNode)"/>
    <rect x="91" y="145" width="61" height="47" rx="13" fill="url(#orangeNode)"/>
  </g>

  <!-- Simple object glyphs make the purpose legible even at small sizes. -->
  <circle cx="57" cy="64" r="5" fill="#0c1b3b"/>
  <g fill="none" stroke="#0c1b3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M57 72v10m-10-5 10-5 10 5m-10 5-8 9m8-9 9 9"/>
    <path d="M182 74h20l5-10 8 3-2 9h-9m-21-2-5-6m8 9-1 12m7-12 2 12m10-12 1 12m5-13 3 13"/>
    <path d="M102 156h39v26h-39z"/>
  </g>
  <path d="m118 161 12 8-12 8z" fill="#0c1b3b"/>
  <circle cx="211" cy="69" r="1.3" fill="#0c1b3b"/>

  <g filter="url(#shadow)">
    <rect x="105" y="91" width="72" height="30" rx="15" fill="url(#relation)"/>
  </g>
  <text x="141" y="111" text-anchor="middle" fill="#071d2a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">RIDES</text>

  <g fill="#ffffff" font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="128" y="215" font-size="22" font-weight="700" letter-spacing=".1">RelateAnything</text>
    <text x="128" y="234" fill="#aab9e8" font-size="10" letter-spacing="1.8">SCENE RELATIONS</text>
  </g>
</svg>
