<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- qGKD icon: keypoint skeleton over an image frame, plugin name below -->
  <rect x="4" y="2" width="56" height="46" rx="5" fill="#263238" stroke="#00897b" stroke-width="3"/>
  <!-- skeleton edges -->
  <g stroke="#4dd0e1" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="15" x2="24" y2="13"/>
    <line x1="32" y1="15" x2="40" y2="13"/>
    <line x1="24" y1="13" x2="22" y2="21"/>
    <line x1="40" y1="13" x2="42" y2="21"/>
    <line x1="32" y1="15" x2="32" y2="27"/>
    <line x1="32" y1="27" x2="24" y2="37"/>
    <line x1="32" y1="27" x2="40" y2="37"/>
  </g>
  <!-- keypoints -->
  <g fill="#ffb300" stroke="#ffffff" stroke-width="1">
    <circle cx="32" cy="15" r="3.4"/>
    <circle cx="24" cy="13" r="3.0"/>
    <circle cx="40" cy="13" r="3.0"/>
    <circle cx="22" cy="21" r="3.0"/>
    <circle cx="42" cy="21" r="3.0"/>
    <circle cx="32" cy="27" r="3.0"/>
    <circle cx="24" cy="37" r="3.0"/>
    <circle cx="40" cy="37" r="3.0"/>
  </g>
  <!-- plugin name -->
  <text x="32" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="13"
        font-weight="bold" fill="#00897b" text-anchor="middle">qGKD</text>
</svg>
