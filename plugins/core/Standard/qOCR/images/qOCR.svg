<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- document sheet -->
  <rect x="6" y="4" width="36" height="40" rx="4" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2.5"/>
  <!-- scan frame corners -->
  <path d="M6 14 L6 4 L16 4" fill="none" stroke="#e07b39" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 4 L42 4 L42 14" fill="none" stroke="#e07b39" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 34 L42 44 L32 44" fill="none" stroke="#e07b39" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 44 L6 44 L6 34" fill="none" stroke="#e07b39" stroke-width="3" stroke-linecap="round"/>
  <!-- recognized text lines -->
  <rect x="12" y="11" width="13" height="3.4" rx="1" fill="#2c5aa0"/>
  <rect x="12" y="17" width="20" height="3.4" rx="1" fill="#5a8fd0"/>
  <rect x="12" y="23" width="9" height="3.4" rx="1" fill="#5a8fd0"/>
  <!-- detection box over a word -->
  <rect x="23" y="21.6" width="14" height="6.6" fill="none" stroke="#27a745" stroke-width="1.8" stroke-dasharray="2.6 1.6"/>
  <!-- OCR lettering -->
  <text x="24" y="38.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#2c5aa0" text-anchor="middle" letter-spacing="1">OCR</text>
</svg>
