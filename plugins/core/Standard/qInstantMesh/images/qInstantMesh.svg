<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Point samples transition to a triangle mesh; retain full InstantMesh branding and the plugin's purple palette. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e57c2"/>
      <stop offset="1" stop-color="#311b92"/>
    </linearGradient>
  </defs>

  <!-- rounded tile background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <g fill="#ede7f6">
    <circle cx="12" cy="16" r="1.7"/>
    <circle cx="19" cy="20" r="1.5"/>
    <circle cx="8" cy="24" r="1.5"/>
    <circle cx="15" cy="28" r="1.7"/>
    <circle cx="21" cy="33" r="1.4"/>
    <circle cx="9" cy="36" r="1.6"/>
    <circle cx="15" cy="40" r="1.4"/>
  </g>
  <path d="M24 26 H29 V22 L35 28 L29 34 V30 H24 Z" fill="#d1c4e9"/>
  <g stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round">
    <path d="M38 18 L49 13 L58 25 L52 40 L38 36 Z" fill="#9575cd"/>
    <path d="M38 18 L48 27 L49 13 M48 27 L58 25 M48 27 L52 40 M48 27 L38 36 Z" fill="none"/>
  </g>

  <!-- brand text -->
  <text x="32" y="54.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">InstantMesh</text>
</svg>
