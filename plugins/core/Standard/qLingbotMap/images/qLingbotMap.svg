<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- qLingbotMap icon: a camera streaming RGB-D frames that build a 3D
       point-cloud map, plugin name below -->
  <!-- image frame + streamed RGB frames -->
  <rect x="4" y="3" width="56" height="46" rx="5" fill="#263238" stroke="#5c6bc0" stroke-width="3"/>
  <!-- depth planes receding behind the frame -->
  <rect x="14" y="9" width="34" height="22" rx="2" fill="none" stroke="#8c9eff" stroke-width="1.6" opacity="0.55"/>
  <rect x="19" y="12" width="24" height="15" rx="2" fill="none" stroke="#8c9eff" stroke-width="1.6" opacity="0.8"/>
  <!-- camera shooting the frames -->
  <g>
    <rect x="22" y="15" width="13" height="9" rx="1.6" fill="#ff7043" stroke="#ffffff" stroke-width="1.2"/>
    <path d="M25 15 L27 11.6 L30 11.6 L32 15 Z" fill="#ff7043" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="28.5" cy="19.5" r="2.4" fill="#263238" stroke="#ffffff" stroke-width="1.2"/>
  </g>
  <!-- streamed frame stack (right of camera) -->
  <g fill="none" stroke="#4dd0e1" stroke-width="1.6">
    <rect x="41" y="13" width="9" height="7" rx="1"/>
    <rect x="43" y="15.5" width="9" height="7" rx="1"/>
    <rect x="45" y="18" width="9" height="7" rx="1"/>
  </g>
  <!-- reconstructed 3D point cloud (colored dots rising from the plane) -->
  <g>
    <circle cx="13" cy="36" r="1.7" fill="#66bb6a"/>
    <circle cx="19" cy="40" r="1.7" fill="#42a5f5"/>
    <circle cx="25" cy="35" r="1.7" fill="#ef5350"/>
    <circle cx="31" cy="41" r="1.7" fill="#ffa726"/>
    <circle cx="37" cy="36" r="1.7" fill="#66bb6a"/>
    <circle cx="43" cy="41" r="1.7" fill="#42a5f5"/>
    <circle cx="49" cy="35" r="1.7" fill="#ef5350"/>
    <circle cx="22" cy="45" r="1.7" fill="#ffa726"/>
    <circle cx="34" cy="46" r="1.7" fill="#66bb6a"/>
    <circle cx="46" cy="45" r="1.7" fill="#42a5f5"/>
    <circle cx="28" cy="31" r="1.7" fill="#42a5f5"/>
    <circle cx="41" cy="30" r="1.7" fill="#ffa726"/>
  </g>
  <!-- streaming motion arrows into the cloud -->
  <g stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M46 21 C 42 26, 38 28, 34 30"/>
    <path d="M50 24 C 47 29, 44 31, 41 32"/>
  </g>
  <!-- plugin name (font sized so "qLingbotMap" fits the 64px viewBox;
       larger sizes clip the trailing 'p' during Qt SVG rendering) -->
  <text x="32" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="7.5"
        font-weight="bold" fill="#5c6bc0" text-anchor="middle">qLingbotMap</text>
</svg>
