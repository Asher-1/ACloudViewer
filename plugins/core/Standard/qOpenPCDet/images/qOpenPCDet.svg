<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#1e3a5f"/>
  <!-- perspective ground point grid (LiDAR returns) -->
  <g fill="#4fc3f7">
    <circle cx="14" cy="44" r="1.4"/>
    <circle cx="20" cy="48" r="1.4"/>
    <circle cx="12" cy="51" r="1.2"/>
    <circle cx="18" cy="55" r="1.2"/>
    <circle cx="26" cy="52" r="1.4"/>
    <circle cx="33" cy="56" r="1.2"/>
    <circle cx="40" cy="52" r="1.4"/>
    <circle cx="47" cy="56" r="1.2"/>
    <circle cx="53" cy="51" r="1.2"/>
    <circle cx="50" cy="45" r="1.4"/>
    <circle cx="55" cy="41" r="1.0"/>
    <circle cx="9" cy="42" r="1.0"/>
  </g>
  <g fill="#e8f4ff">
    <circle cx="24" cy="45" r="1.0"/>
    <circle cx="44" cy="42" r="1.0"/>
    <circle cx="30" cy="57" r="1.0"/>
