    <line x1="38" y1="34" x2="46" y2="28"/>
    <line x1="38" y1="50" x2="46" y2="44"/>
    <line x1="22" y1="50" x2="30" y2="44"/>
  </g>
  <!-- label tag -->
  <rect x="5" y="9" width="54" height="12" rx="2" fill="#ffcc00"/>
  <text x="32" y="18" font-family="sans-serif" font-size="7" font-weight="bold" fill="#1e3a5f" text-anchor="middle">OpenPCDet</text>
</svg>
