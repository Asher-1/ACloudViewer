<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dlPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="dlScene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#64748b" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="dlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.55" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon tile -->
  <rect width="64" height="64" rx="10" fill="url(#dlBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="9" fill="none" stroke="#475569" stroke-width="1" opacity="0.6"/>

  <!-- Input image frame -->
  <rect x="9" y="10" width="46" height="38" rx="3" fill="url(#dlPanel)" stroke="#64748b" stroke-width="0.8"/>
  <rect x="11" y="24" width="42" height="22" rx="1.5" fill="url(#dlScene)"/>

  <!-- Faint scene silhouette (building / outdoor) -->
  <path d="M11 46 L24 32 L38 38 L53 26 L53 46 Z" fill="#cbd5e1" opacity="0.28"/>
  <rect x="28" y="30" width="8" height="16" rx="0.5" fill="#e2e8f0" opacity="0.35"/>
  <polygon points="26,30 32,22 38,30" fill="#e2e8f0" opacity="0.32"/>

  <!-- DeepLSD wireframe line segments (amber — distinct from LightGlue green) -->
  <g stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round" fill="none" filter="url(#dlGlow)">
    <!-- horizontals -->
    <line x1="13" y1="34" x2="51" y2="34"/>
    <line x1="13" y1="42" x2="51" y2="42"/>
    <!-- verticals -->
    <line x1="20" y1="28" x2="20" y2="44"/>
    <line x1="32" y1="24" x2="32" y2="44"/>
    <line x1="44" y1="30" x2="44" y2="44"/>
    <!-- roof / perspective edges -->
    <line x1="26" y1="30" x2="38" y2="24"/>
    <line x1="38" y1="24" x2="44" y2="30"/>
    <line x1="13" y1="34" x2="20" y2="28"/>
    <line x1="44" y1="30" x2="51" y2="34"/>
  </g>

  <!-- Line endpoints / junctions -->
  <g fill="#fde68a" filter="url(#dlGlow)">
    <circle cx="20" cy="28" r="1.6"/>
    <circle cx="32" cy="24" r="1.6"/>
    <circle cx="38" cy="24" r="1.4"/>
    <circle cx="44" cy="30" r="1.4"/>
    <circle cx="13" cy="34" r="1.5"/>
    <circle cx="51" cy="34" r="1.5"/>
    <circle cx="32" cy="44" r="1.5"/>
  </g>

  <!-- Scan hint: single-image inference (not stereo match) -->
  <path d="M9 10 L9 6 L55 6 L55 10" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>

  <!-- Label -->
  <text x="32" y="58" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="5.5" font-weight="bold" letter-spacing="0.15">Deep LSD</text>
</svg>
