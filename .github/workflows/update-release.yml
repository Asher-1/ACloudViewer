name: Clean release
permissions: {}
on:
  # Which asset-uploading workflow finishes last drifts over time (Windows
  # used to be the long pole; Ubuntu CUDA and MacOS now often are). Trigger on
  # every uploader's completion: the cleanup below is idempotent, so early
  # runs are no-ops and the last finisher always yields a final pass after all
  # assets of the commit are uploaded.
  #
  # `branches` filters on the TRIGGERING run's head branch: only main-branch
  # completions proceed. PR builds never upload to main-devel, so firing on
  # them was pure runner waste (a full PR matrix used to cost 5 extra runs of
  # this workflow plus 5 more in npm publish per push).
  workflow_run:
    workflows: [Windows, MacOS, Ubuntu, Ubuntu CUDA, Ubuntu Wheel]
    types: [completed]
    branches: [main]

# Serialize cleanups: near-simultaneous completions would otherwise race on
# the same release assets (double delete-asset).
concurrency:
  group: clean-release
  cancel-in-progress: false

jobs:
 clean-release:
    permissions:
      actions: read     # list the other uploaders' runs for this commit
      contents: write   # Release upload
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    steps:
      # ── Gate: only the LAST uploader's completion should clean up ───────
      #
      # `workflow_run.workflows` fires once per listed workflow that
      # completes (OR semantics, not AND). Measured on commit 1cf1fa06: 20
      # runs of this workflow for one commit. The cleanup below is idempotent,
      # so this was never a correctness bug -- but 19 runs each paid for a
      # runner to redo work that could not have changed yet.
      #
      # `github.event.workflow_run.head_sha` is the triggering commit;
      # `GITHUB_SHA` here is the default-branch head and would be wrong.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: All uploaders finished for this commit?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          python3 util/check_uploaders_complete.py \
            --sha "${{ github.event.workflow_run.head_sha }}" || rc=$?
          case "$rc" in
            0) ;;                                   # all done: continue
            2) echo "Another uploader is still running; stopping early."
               echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::uploader status query failed (exit $rc)"
               exit "$rc" ;;
          esac

      - name: Clean old release assets
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/release-cleanup.XXXXXX")
          [[ "$work" = /*/release-cleanup.* ]] || exit 1
          trap 'rm -f -- "$work/assets.json" "$work/shas.txt" "$work/published.json" "$work/delete.txt"; rmdir -- "$work"' EXIT
          # Validate the inventory, retention history and published catalogue before deleting.
          gh release view main-devel --json assets > "$work/assets.json"
          git log --format=%H -n 3 > "$work/shas.txt"
          # The release catalogue may already describe a future deployment.
          # Protect what users can download from the currently published site.
          curl --fail --show-error --silent --location --retry 2 --max-time 30 \
            https://asher-1.github.io/ACloudViewer/downloads_data.json > "$work/published.json"
          python3 - "$work/assets.json" "$work/shas.txt" "$work/published.json" > "$work/delete.txt" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote, urlsplit

          assets = json.loads(Path(sys.argv[1]).read_text())['assets']
          commits = Path(sys.argv[2]).read_text().splitlines()
          if len(commits) != 3 or any(not re.fullmatch(r'[0-9a-f]{40}', sha) for sha in commits):
              raise SystemExit('Expected three full commit SHAs; refusing incomplete-history cleanup')
          if not isinstance(assets, list) or any(not isinstance(a, dict) or not isinstance(a.get('name'), str) for a in assets):
              raise SystemExit('Invalid release asset inventory')
          names = [a['name'] for a in assets]
          if len(set(names)) != len(names):
              raise SystemExit('Duplicate release asset names')
          published = json.loads(Path(sys.argv[3]).read_text())
          metadata = published.get('version_metadata') if isinstance(published, dict) else None
          downloads = published.get('download_data') if isinstance(published, dict) else None
          if (not isinstance(metadata, list) or not metadata or not isinstance(downloads, dict)
                  or any(not isinstance(row, dict) or not isinstance(row.get('value'), str)
                         or not row['value'] for row in metadata)):
              raise SystemExit('Invalid published download catalogue')
          versions = [row['value'] for row in metadata]
          if len(set(versions)) != len(versions) or set(versions) != set(downloads):
              raise SystemExit('Incomplete published download catalogue')
          protected = set()
          def collect(node, version):
              if not isinstance(node, dict):
                  raise SystemExit('Invalid published download entry')
              if not node:
                  return
              if 'url' in node:
                  if not isinstance(node['url'], str):
                      raise SystemExit('Invalid published asset URL')
                  url = urlsplit(node['url'])
                  parts = url.path.split('/')
                  if (url.scheme != 'https' or url.netloc.lower() != 'github.com'
                          or url.query or url.fragment or len(parts) != 7
                          or parts[1:5] != ['Asher-1', 'ACloudViewer', 'releases', 'download']):
                      raise SystemExit('Unexpected published asset URL; refusing cleanup')
                  tag, asset = unquote(parts[5]), unquote(parts[6])
                  if tag != version or not asset or '/' in asset or '\\' in asset:
                      raise SystemExit('Mismatched published asset URL')
                  if tag == 'main-devel':
                      protected.add(asset)
              else:
                  for child in node.values():
                      collect(child, version)
          for version, entry in downloads.items():
              collect(entry, version)
          if not protected:
              raise SystemExit('Published catalogue has no main-devel URLs; refusing cleanup')
          # This owner prunes only stamped platform installers and Python wheels.
          # Docs have their own verified uploader/pruner; metadata and unknown
          # assets are deliberately outside this owner's deletion boundary.
          installer = re.compile(
              r'ACloudViewer-\d+\.\d+\.\d+\+(?P<sha>[0-9a-f]{8,40})-'
              r'(?:win-(?:cpu|cuda)-amd64\.exe|mac-cpu-(?:ARM64|amd64)\.dmg|'
              r'ubuntu\d+\.\d+-(?:cpu|cuda)-amd64\.run)')
          wheel = re.compile(
              r'cloudviewer(?:_cpu)?-\d+\.\d+\.\d+\+(?P<sha>[0-9a-f]{8,40})-'
              r'(?P<python>cp\d+)-(?P=python)-'
              r'(?:win_amd64|macosx_\d+_\d+_(?:arm64|x86_64|universal2)|'
              r'manylinux_\d+_\d+_x86_64)\.whl')
          for name in names:
              match = installer.fullmatch(name) or wheel.fullmatch(name)
              if match and name not in protected and not any(sha.startswith(match['sha']) for sha in commits):
                  print(name)
          PY
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            echo "Removing old platform build: $asset"
            gh release delete-asset main-devel "$asset" --yes
          done < "$work/delete.txt"
          gh release view main-devel
