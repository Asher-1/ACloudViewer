# Throwaway measurement (branch ci/probe-nvcc-sccache only, never merged).
# Round 2: close the evidence still missing before the Windows nvcc launcher
# goes to production (round 1, run 40292871767: 33 objects, vanilla 2177.6 s
# vs warm 195 s; warm==recache 33/33, recache==vanilla 0/33).
#   1. WHY two real compiles differ: vanilla nvcc twice (A/B) vs the
#      sccache-compiled build objects (S1), section-level + fatbin bytes,
#      SASS/PTX only where the fatbin differs              -> seed-app
#   2. cross-runner replay: a fresh runner restores the seed cell's
#      production-trimmed pool; CUDA misses must be 0 and every replayed
#      object byte-identical to what the seed runner compiled -> cross-*
#   3. the wheel job (Windows critical path, 131 min build in run
#      40266789621): build wall with nvcc cold (seed) and warm (cross)
#   4. pool size kept by the production trim vs the 10G / 20G ceilings
# Each cell runs the production job's own steps with the candidate change
# (see probe-nvcc-sccache-cell.yml).
# 第三轮只补独立编译全量等价性；复用第二轮热池，不重跑已通过的跨 runner 四格。
name: Probe nvcc sccache
permissions: {}

on:
  push:
    branches:
      - ci/probe-nvcc-sccache

jobs:
  strict-app:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/probe-nvcc-sccache-cell.yml
    with:
      lane: app
      stage: strict
  strict-wheel:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/probe-nvcc-sccache-cell.yml
    with:
      lane: wheel
      stage: strict
