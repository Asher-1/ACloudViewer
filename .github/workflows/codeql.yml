name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      cpp-optimization:
        description: 'C++ code generation: O1 for scanning, O3 for same-revision baseline'
        type: choice
        default: O1
        options: [O1, O3]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.cpp-optimization || 'O1' }}
  cancel-in-progress: true

jobs:
  # Python analysis - lightweight, no compilation needed
  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Required for all workflows
      security-events: write
      # Required to fetch internal or private CodeQL packs
      packages: read
      # Only required for workflows in private repositories
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt || true; fi
          if [ -f plugins/core/Standard/qPythonRuntime/requirements-dev.txt ]; then pip install -r plugins/core/Standard/qPythonRuntime/requirements-dev.txt || true; fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          output: sarif-results
          upload: failure-only

      - name: Filter third-party alerts
        uses: advanced-security/filter-sarif@v1.1
        with:
          patterns: |
            -3rdparty/**
            -3rdparty_downloads/**
            -libs/Reconstruction/lib/**
            -**/extern/**
            -**/external/**
            -**/3rdparty/**
            -**/3rdparty_downloads/**
            -**/third_party/**
            -**/thirdparty/**
            -build/**
            -build_app/**
            -plugins/core/Standard/qSIBR/SIBR/**
          input: sarif-results/python.sarif
          output: sarif-results/python.sarif

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/python.sarif
          category: "/language:python"

  # C++ analysis - uses project's dependency installation script
  analyze-cpp:
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # GitHub Actions max limit is 6 hours (360 minutes)
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    env:
      # Qt paths
      QT_BASE_DIR: /usr/lib/x86_64-linux-gnu/qt5
      QT_DIR: /usr/lib/x86_64-linux-gnu/qt5
      QT_ROOT: /usr/lib/x86_64-linux-gnu/qt5
      QTDIR: /usr/lib/x86_64-linux-gnu/qt5
      PARALLEL_JOBS: 4
      CPP_OPTIMIZATION: ${{ inputs.cpp-optimization || 'O1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Maximize build space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # The observed image already had 85 GiB free; deleting its tool cache
          # cost 214 seconds. Keep an 80 GiB budget for build/database growth.
          free_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if (( free_kib < 80 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                        /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
            sudo apt-get clean
            df -h /
          else
            echo "Skipping unnecessary cleanup: at least 80 GiB is free"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo SUDO=sudo ./util/install_deps_ubuntu.sh assume-yes

      - name: Set up fixed CMake
        uses: ./.github/actions/setup-cmake

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            ninja-build pkg-config \
            libeigen3-dev libboost-all-dev libflann-dev libglew-dev \
            libqhull-dev libjsoncpp-dev libusb-1.0-0-dev \
            libopenni-dev libopenni2-dev libssl-dev \
            zlib1g-dev libbz2-dev libzstd-dev \
            freeglut3-dev libpcap-dev nasm \
            libquazip5-dev liblaszip-dev libxerces-c-dev \
            libtbb-dev libopenblas-dev liblapack-dev liblapacke-dev

      - name: Install Qt5
        run: |
          sudo apt-get install -y \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            libqt5svg5-dev libqt5opengl5-dev libqt5websockets5-dev \
            libqt5xmlpatterns5-dev libqt5x11extras5-dev libqt5networkauth5-dev \
            qt5-image-formats-plugins qttranslations5-l10n \
            qtdeclarative5-dev qtdeclarative5-dev-tools \
            libqt5quickcontrols2-5 \
            libxcb-xkb1 libxcb-shape0 libxcb-randr0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-xinerama0 libxkbcommon-x11-0 libxcb-render-util0

      - name: Install VTK and PCL from system packages
        run: |
          sudo apt-get install -y libpcl-dev libvtk9-qt-dev
          echo "=== VTK ==="
          dpkg -l | grep libvtk | head -5 || true
          echo "=== PCL ==="
          dpkg -l | grep libpcl | head -5 || true
          echo "=== TBB ==="
          dpkg -l | grep libtbb | head -3 || true

      # CRITICAL: Configure CMake BEFORE CodeQL init.
      # CodeQL sets LD_PRELOAD to trace all processes, which causes cmake configure
      # to hang on try_compile checks and FetchContent downloads. The configure step
      # does not compile any project code, so CodeQL tracing is not needed here.
      # O1 preserves __OPTIMIZE__ and NDEBUG while avoiding O3 code-generation
      # work that scanning does not consume. Do not change the enabled targets.
      # 扫描策略也转发到子构建，并在目标创建后追加选项，防止上游重置为 O3。
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          case "$CPP_OPTIMIZATION" in
            O1|O3) ;;
            *) echo "Unsupported C++ optimization: $CPP_OPTIMIZATION" >&2; exit 1 ;;
          esac
          mkdir -p build codeql-evidence
          cd build
          cmake \
            -DBUILD_SHARED_LIBS=OFF \
            -DUSE_QT6=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_FLAGS_RELEASE=-${CPP_OPTIMIZATION} -DNDEBUG" \
            "-DCMAKE_CXX_FLAGS_RELEASE=-${CPP_OPTIMIZATION} -DNDEBUG" \
            "-DCLOUDVIEWER_CODEQL_OPTIMIZATION=${CPP_OPTIMIZATION}" \
            "-DCMAKE_PROJECT_INCLUDE=${GITHUB_WORKSPACE}/.github/codeql/compiler-policy.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUSE_SYSTEM_TBB=ON \
            -DBUILD_JUPYTER_EXTENSION=OFF \
            -DBUILD_LIBREALSENSE=OFF \
            -DBUILD_AZURE_KINECT=OFF \
            -DBUILD_PYTORCH_OPS=OFF \
            -DBUILD_TENSORFLOW_OPS=OFF \
            -DBUNDLE_CLOUDVIEWER_ML=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_UNIT_TESTS=OFF \
            -DBUILD_WEBRTC=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_CUDA_MODULE=OFF \
            -DBUILD_OPENCV=OFF \
            -DBUILD_RECONSTRUCTION=OFF \
            -DBUILD_PYTHON_MODULE=OFF \
            -DPLUGIN_PYTHON=OFF \
            -DWITH_OPENMP=ON \
            -DWITH_IPP=OFF \
            -DWITH_SIMD=OFF \
            -DUSE_SIMD=OFF \
            -DUSE_VTK_BACKEND=ON \
            -DCVCORELIB_USE_CGAL=OFF \
            -DCVCORELIB_SHARED=ON \
            -DCVCORELIB_USE_QT_CONCURRENT=ON \
            -DOPTION_USE_GDAL=OFF \
            -DOPTION_USE_DXF_LIB=ON \
            -DPLUGIN_IO_QLAS=ON \
            -DPLUGIN_IO_QCORE=ON \
            -DPLUGIN_IO_QMESH=ON \
            -DPLUGIN_IO_QADDITIONAL=OFF \
            -DPLUGIN_IO_QCSV_MATRIX=OFF \
            -DPLUGIN_IO_QDRACO=OFF \
            -DPLUGIN_IO_QE57=OFF \
            -DPLUGIN_IO_QPDAL=OFF \
            -DPLUGIN_IO_QPHOTOSCAN=OFF \
            -DPLUGIN_IO_QFBX=OFF \
            -DPLUGIN_IO_QSTEP=OFF \
            -DPLUGIN_STANDARD_QCSF=ON \
            -DPLUGIN_STANDARD_QM3C2=ON \
            -DPLUGIN_STANDARD_QPCL=ON \
            -DPLUGIN_STANDARD_QPCV=ON \
            -DPLUGIN_STANDARD_QPOISSON_RECON=ON \
            -DPLUGIN_STANDARD_QRANSAC_SD=ON \
            -DPLUGIN_STANDARD_QHOUGH_NORMALS=ON \
            -DPLUGIN_STANDARD_QCORK=OFF \
            -DPLUGIN_STANDARD_QJSONRPC=OFF \
            -DPLUGIN_STANDARD_QCLOUDLAYERS=OFF \
            -DPLUGIN_STANDARD_MASONRY_QAUTO_SEG=OFF \
            -DPLUGIN_STANDARD_MASONRY_QMANUAL_SEG=OFF \
            -DPLUGIN_STANDARD_QANIMATION=OFF \
            -DPLUGIN_STANDARD_QBROOM=OFF \
            -DPLUGIN_STANDARD_QCANUPO=OFF \
            -DPLUGIN_STANDARD_QCOLORIMETRIC_SEGMENTER=OFF \
            -DPLUGIN_STANDARD_QCOMPASS=OFF \
            -DPLUGIN_STANDARD_QFACETS=OFF \
            -DPLUGIN_STANDARD_QMPLANE=OFF \
            -DPLUGIN_STANDARD_QSRA=OFF \
            -DPLUGIN_STANDARD_3DMASC=OFF \
            -DPLUGIN_STANDARD_QVOXFALL=OFF \
            -DPLUGIN_STANDARD_G3POINT=OFF \
            -DPLUGIN_STANDARD_QSIBR=OFF \
            -DAICore_ENABLED=OFF \
            -DPLUGIN_STANDARD_QDA3=OFF \
            -DPLUGIN_STANDARD_QDEEPLSD=OFF \
            -DPLUGIN_STANDARD_QFACEDETECT=OFF \
            -DPLUGIN_STANDARD_QFREESPLATTER=OFF \
            -DPLUGIN_STANDARD_QLIGHTGLUE=OFF \
            -DPLUGIN_STANDARD_QRFDETR=OFF \
            -DPLUGIN_STANDARD_QRMBG=OFF \
            -DPLUGIN_STANDARD_QYOLO=OFF \
            -DPLUGIN_STANDARD_QSAM3=OFF \
            -DPLUGIN_STANDARD_QTRELLIS=OFF \
            -DPLUGIN_STANDARD_QGKD=OFF \
            -DPLUGIN_STANDARD_QOCR=OFF \
            -DPLUGIN_STANDARD_QLINGBOTMAP=OFF \
            -DPLUGIN_STANDARD_QSAM3D=OFF \
            -DPLUGIN_STANDARD_QANYLABELING=OFF \
            -DPLUGIN_STANDARD_QMAPANYTHING=OFF \
            .. 2>&1 | tee ../codeql-evidence/configure.log
          cp compile_commands.json ../codeql-evidence/
          {
            git rev-parse HEAD
            printf 'Optimization: %s\nBuild jobs: %s\n' "$CPP_OPTIMIZATION" "$PARALLEL_JOBS"
            nproc
            free -m
            cmake --version
            c++ --version
          } > ../codeql-evidence/environment.txt

      # Initialize CodeQL AFTER configure, so only the build (actual compilation) is traced.
      - name: Initialize CodeQL
        id: init-cpp
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # A failed build must stop analysis: partial extraction is not a baseline.
          # Compile every enabled target; do not replay cached first-party objects.
          /usr/bin/time -v -o codeql-evidence/build-time.txt \
            cmake --build build --parallel "$PARALLEL_JOBS" \
            2>&1 | tee codeql-evidence/build.log
          # 核查实际生成命令，不用顶层 cache 中的 O1 代替子构建证据。
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          expected = '-' + os.environ['CPP_OPTIMIZATION']
          counts = {}
          for inventory in Path('build').rglob('compile_commands.json'):
              count = 0
              for row in json.loads(inventory.read_text()):
                  if Path(row['file']).suffix.lower() not in ('.c', '.cc', '.cpp', '.cxx', '.c++'):
                      continue
                  tokens = row.get('arguments') or shlex.split(row['command'])
                  levels = [token for token in tokens if re.fullmatch(r'-O[0-3sg]|-Ofast', token)]
                  if not levels or levels[-1] != expected:
                      raise SystemExit(f'Unexpected optimization in {inventory}: {row}')
                  count += 1
              counts[str(inventory)] = count
          if not sum(counts.values()):
              raise SystemExit('Missing C/C++ compilation inventory')
          Path('codeql-evidence/compiler-policy.json').write_text(
              json.dumps({'optimization': expected, 'configured_commands': counts}, indent=2))
          print('Verified compiler policy:', counts)
          PY
          echo "Complete configured C++ build succeeded" >> "$GITHUB_STEP_SUMMARY"

      - name: Sample C++ analysis resources
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codeql-evidence
          # 主机累计计数器，不是单查询 CPU 或峰值 RSS；按 UTC 与 evaluator 对齐。
          # 每 30 秒流式保存，六小时约数 MiB；不扫描进程参数或环境变量。
          (
            for sample in {1..720}; do
              [[ ! -f codeql-evidence/analysis-resources.stop ]] || break
              date -u '+UTC %Y-%m-%dT%H:%M:%SZ'
              head -n 1 /proc/stat
              cat /proc/uptime
              grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree|Dirty|Writeback):' /proc/meminfo
              grep -E '^(pgmajfault|pswpin|pswpout|pgpgin|pgpgout|pgscan_.*|pgsteal_.*|oom_kill) ' /proc/vmstat
              for resource in cpu memory io; do
                if [[ -r /proc/pressure/$resource ]]; then
                  printf 'Pressure %s\n' "$resource"
                  cat "/proc/pressure/$resource"
                fi
              done
              df -Pk .
              sleep 30
            done
          ) > codeql-evidence/analysis-resources.log 2>&1 < /dev/null &

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        env:
          # 仅记录评估过程，不改变查询集、线程数、内存预算或磁盘缓存策略。
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"run-queries":["--evaluator-log=${{ github.workspace }}/codeql-evidence/evaluator.jsonl","--evaluator-log-minify"]}}
        with:
          category: "/language:c-cpp"
          output: sarif-results
          upload: failure-only

      - name: Summarize C++ evaluator performance
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CODEQL_BIN: ${{ steps.init-cpp.outputs.codeql-path }}
        run: |
          set -euo pipefail
          # 成功或失败都停止采样；最后一个完整快照已直接写入日志。
          mkdir -p codeql-evidence
          touch codeql-evidence/analysis-resources.stop
          # 保留原始日志；用 CLI 自带汇总器解析，避免依赖不稳定的事件格式。
          if [[ -s codeql-evidence/evaluator.jsonl && -x "$CODEQL_BIN" ]]; then
            for format in overall predicates text; do
              "$CODEQL_BIN" generate log-summary --format="$format" --utc \
                codeql-evidence/evaluator.jsonl "codeql-evidence/evaluator-$format.log"
            done
          fi

      # Keep failure logs and the compilation inventory for coverage/timing A/B.
      # Successful builds are necessary, but this inventory alone is not proof
      # of extraction parity; also compare CodeQL diagnostics and query results.
      - name: Upload C++ build evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: codeql-cpp-evidence-${{ env.CPP_OPTIMIZATION }}-${{ github.run_id }}
          path: |
            codeql-evidence/
            build/**/compile_commands.json
            ${{ runner.temp }}/codeql_databases/cpp/log/
            sarif-results/cpp.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Filter third-party alerts
        uses: advanced-security/filter-sarif@v1.1
        with:
          patterns: |
            -3rdparty/**
            -3rdparty_downloads/**
            -libs/Reconstruction/lib/**
            -**/extern/**
            -**/external/**
            -**/3rdparty/**
            -**/3rdparty_downloads/**
            -**/third_party/**
            -**/thirdparty/**
            -build/**
            -build_app/**
            -plugins/core/Standard/qSIBR/SIBR/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/cpp.sarif
          category: "/language:c-cpp"
