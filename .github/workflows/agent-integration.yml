name: Agent Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent-integration/**'
      - 'core/AICore/**'
      - 'libs/CVPluginAPI/include/ecvAICoreBatchCommand.h'
      - 'plugins/core/Standard/**'
      - '.agents/mcp.json'
      - '.agents/skills/acloudviewer-aicore-plugin/**'
      - '.github/workflows/agent-integration.yml'
      - '.github/actions/checkout-agent-harness/**'
      - '.github/actions/setup-cmake/**'
      - '.github/workflows/macos.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'agent-integration/**'
      - 'core/AICore/**'
      - 'libs/CVPluginAPI/include/ecvAICoreBatchCommand.h'
      - 'plugins/core/Standard/**'
      - '.agents/mcp.json'
      - '.agents/skills/acloudviewer-aicore-plugin/**'
      - '.github/workflows/agent-integration.yml'
      - '.github/actions/checkout-agent-harness/**'
      - '.github/actions/setup-cmake/**'
      - '.github/workflows/macos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACV_VERSION: "3.9.5"

jobs:
  test-basic:
    name: Level 1+2+5 (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Path separators, line endings, default text encoding and subprocess
    # quoting differ per OS; the Python axis is OS-independent, so macOS and
    # Windows run only the newest supported interpreter.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ACloudViewer
        uses: actions/checkout@v4

      - name: Checkout CLI-Anything (agent harness)
        uses: ./.github/actions/checkout-agent-harness

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install agent harness
        run: |
          # Pin MCP SDK <2.0 — v2.0 removed Server.list_tools() used by mcp_server.py
          pip install "mcp>=1.0,<2.0"
          pip install -e "_cli-anything/acloudviewer/agent-harness[dev]"

      - name: Verify CLI entry point
        run: |
          cli-anything-acloudviewer --help
          cli-anything-acloudviewer-mcp --help

      - name: Level 1 — C++ plugin source verification
        run: |
          python -m pytest agent-integration/tests/test_integration.py -v -k "level1 and not builds"

      - name: Level 1 — AICore plugin ownership boundary
        run: |
          python core/AICore/tests/check_plugin_aicore_boundaries.py --root . --strict

      - name: Level 2 — CLI harness tests
        run: |
          python -m pytest agent-integration/tests/test_integration.py -v -k "level2"

      - name: Level 5 — MCP server tests
        run: |
          python -m pytest agent-integration/tests/test_integration.py -v -k "level5"

      - name: Run harness internal tests
        working-directory: _cli-anything/acloudviewer/agent-harness
        run: |
          python -m pytest cli_anything/acloudviewer/tests/ -v

  # Level 3 (headless processing) tests are now embedded in each build CI:
  #   - ubuntu.yml          (CPU .run installer)
  #   - ubuntu-cuda.yml     (CUDA .run installer)
  #   - windows.yml         (.exe installer)
  #   - macos.yml           (.dmg installer)
  # This avoids cross-workflow artifact download limitations and ensures
  # tests run immediately after each platform's build completes.
