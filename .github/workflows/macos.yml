name: MacOS
permissions: {}

on:
  workflow_dispatch:
    inputs:
      developer_build:
        description: 'Set to OFF for Release builds.'
        required: false
        default: 'ON'

  push:
    branches:
      - main

  release:
    types: [released]

  pull_request:
    types: [opened, reopened, synchronize]  # Rebuild on new pushes to PR

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NPROC: 4
  DEVELOPER_BUILD: ${{ github.event.inputs.developer_build || 'ON' }}
  BUILD_CUDA_MODULE: OFF
jobs:
  MacOS:
    permissions:
      contents: write  # upload
      actions: write   # release
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python_version: ['3.12']
    env:
      BUILD_SHARED_LIBS: OFF
      BUILD_TENSORFLOW_OPS: OFF
      BUILD_PYTORCH_OPS: OFF
      LOW_MEM_USAGE: ON
      CONDA_DEP_FILE_CLOUDVIEWER: ".ci/conda_macos_cloudViewer.yml"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Setup DEVELOPER_BUILD
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "DEVELOPER_BUILD=OFF" >> $GITHUB_ENV
          else
            echo "DEVELOPER_BUILD=${{ github.event.inputs.developer_build || 'ON' }}" >> $GITHUB_ENV
          fi
      - name: Set up Install path environment
        run: |
          echo "INSTALL_DIR=${HOME}/cloudViewer_install" >> $GITHUB_ENV
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Restore compiler cache (stash)
        # AppleClang 15 -> 17 invalidated the old seed. The full 1.5 GB pool also
        # churned: run 40901140533 added 12,732 calls, 526 hits and 526 cleanups.
        # Retain the new toolchain's working set in the artifact-backed backend.
        id: ccache-restore
        continue-on-error: true
        uses: apache/infrastructure-actions/stash/restore@e3e0a2261a9c6d5bdd882802b303f34b1511b6df
        with:
          key: ccache-macos-${{ runner.arch }}-app
          path: ${{ env.CCACHE_DIR }}
      - name: Seed compiler cache from legacy release asset
        if: steps.ccache-restore.outputs.stash-hit != 'true'
        continue-on-error: true
        run: |
          ASSET="ccache-macos-app.tar.gz"
          mkdir -p "$CCACHE_DIR"
          curl -fsSL --retry 3 -o /tmp/ccache-restore.tar.gz \
            "https://github.com/Asher-1/cloudViewer_downloads/releases/download/ci-ccache/${ASSET}" \
            && tar -xzf /tmp/ccache-restore.tar.gz -C "$CCACHE_DIR" \
            || echo "[cache] no legacy pool; using a cold build"
          rm -f /tmp/ccache-restore.tar.gz

      - name: Set up Python version
        run: |
          sed -i "" "s/3.10/${{ matrix.python_version }}/g" ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}

      # DGM: without caching, using conda on Windows takes a long time...
      - name: Set up Python environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cloudViewer
          auto-activate-base: false
          environment-file: ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}
      - name: Set up fixed CMake
        uses: ./.github/actions/setup-cmake
      
      - name: Install dependencies
        run: |
          brew install ccache pkg-config

          if [[ ${{ runner.arch }} == "ARM64" ]]; then
            brew install gcc
            FC="$(brew --prefix)/bin/gfortran"
            test -x "$FC"
            "$FC" --version
            echo "FC=$FC" >> "$GITHUB_ENV"
            echo "$(dirname "$FC")" >> "$GITHUB_PATH"
          fi

          # Native ARM64 Qt IFW with STATIC Qt (built via scripts/platforms/mac/build_static_qt_ifw.sh).
          # The old dynamic-Qt ARM64 IFW produced installers whose maintenancetool
          # crashed on auto-uninstall (dyld: Library not loaded @rpath/libQt5Widgets.5.dylib).
          # Static link matches the official x86_64 IFW: zero @rpath deps, self-contained.
          curl -L "https://github.com/Asher-1/cloudViewer_downloads/releases/download/qt-ifw/QtIFW-4.6.1-darwin-ARM64-static.zip" -o ~/QtIFW-4.6.1-darwin-ARM64-static.zip
          unzip -q ~/QtIFW-4.6.1-darwin-ARM64-static.zip -d ~/
          rm ~/QtIFW-4.6.1-darwin-ARM64-static.zip
          ls -hal ~/QtIFW-4.6.1-darwin-ARM64-static/bin

          # Disk cache only, not resident RAM; leave room for the complete working set.
          ccache -M 10G
          # A stash restored on a different macos-15 image version must still
          # hit: key on compiler bytes instead of the image-local compiler
          # mtime, and ignore LANG/LC_* (they only localize diagnostics).
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=locale

      - name: Config and build APP
        id: build
        shell: bash -l {0}
        run: |
          set -e -o pipefail
          export PATH="${HOME}/QtIFW-4.6.1-darwin-ARM64-static/bin:$PATH"
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export PATH="$CONDA_PREFIX/lib:$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/lib/cmake:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "DEVELOPER_BUILD is ${{ env.DEVELOPER_BUILD }}"
          echo "INSTALL_DIR is ${{ env.INSTALL_DIR }}"

          ccache -z
          ccache -s
          trap 'ccache -s' EXIT
          echo "Start to build GUI package On MacOS..."
          source util/ci_utils.sh
          print_ccache_key_inputs
          # Tee the full build log to a file so it can be uploaded as an
          # artifact below (GitHub truncates very long step logs in the UI).
          build_gui_app with_conda package_installer 2>&1 | tee /tmp/macos-build.log

          CLOUDVIEWER_VERSION_FULL="$(grep -F CLOUDVIEWER_VERSION_FULL build/CMakeCache.txt | cut -f2 -d'=')"
          DEVEL_PKG_NAME="$(basename ${{ env.INSTALL_DIR }}/ACloudViewer-${CLOUDVIEWER_VERSION_FULL}*.dmg)"
          echo "DEVEL_PKG_NAME=$DEVEL_PKG_NAME" >> $GITHUB_ENV

      - name: Save compiler cache (stash)
        # Preserve restored entries even after a failed build; no partial-run pruning.
        if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), steps.build.outcome) }}
        continue-on-error: true
        uses: apache/infrastructure-actions/stash/save@e3e0a2261a9c6d5bdd882802b303f34b1511b6df
        with:
          key: ccache-macos-${{ runner.arch }}-app
          path: ${{ env.CCACHE_DIR }}
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload build log
        # Persist the full build log (GitHub truncates very long step logs in
        # the UI). if: always() + continue-on-error: upload even when the build
        # failed, so it can be inspected.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log-${{ runner.arch }}
          path: /tmp/macos-build.log
          if-no-files-found: ignore

      - name: qPythonRuntime native binding contracts
        run: |
          source util/ci_utils.sh
          run_qpythonruntime_tests build native

      - name: Upload ACloudViewer app to GitHub artifacts
        uses: actions/upload-artifact@v4
        if: ${{ env.BUILD_SHARED_LIBS == 'OFF' }}
        with:
          name: ACloudViewer-app-macosx-${{ runner.arch}}
          path: |
            ${{ env.INSTALL_DIR }}/${{ env.DEVEL_PKG_NAME }}
          if-no-files-found: error
        
      - name: Update devel release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload main-devel ${{ env.INSTALL_DIR }}/${{ env.DEVEL_PKG_NAME }} --clobber
          gh release view main-devel

      - name: Public App Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          generate_release_notes: false
          prerelease: false
          # body_path: ${{github.workspace}}/CHANGELOG.md
          files: |
            ${{ env.INSTALL_DIR }}/${{ env.DEVEL_PKG_NAME }}

  agent-integration:
    name: Agent Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    needs: [MacOS]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]

    steps:
      - name: Checkout ACloudViewer
        uses: actions/checkout@v4

      - name: Checkout CLI-Anything (agent harness)
        uses: ./.github/actions/checkout-agent-harness

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download ACloudViewer installer
        uses: actions/download-artifact@v4
        with:
          name: ACloudViewer-app-macosx-${{ runner.arch }}
          path: /tmp/acv-installer/

      - name: Install ACloudViewer (Qt IFW silent install from DMG)
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          DMG=$(find /tmp/acv-installer/ -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg installer found"
            exit 1
          fi
          hdiutil attach "$DMG" -nobrowse -noverify
          VOLUME=$(find /Volumes -maxdepth 1 -name "ACloudViewer*" | head -1)
          if [ -z "$VOLUME" ]; then
            echo "::error::DMG did not mount as expected"
            exit 1
          fi
          echo "=== DMG contents ==="
          ls -la "$VOLUME"/

          INSTALLER_APP=$(find "$VOLUME" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$INSTALLER_APP" ]; then
            echo "::error::No installer .app found in DMG"
            hdiutil detach "$VOLUME"
            exit 1
          fi

          # Copy the installer bundle off the DMG volume before running it.
          # A process whose binary or cwd lives on the mount (Qt IFW spawns
          # helpers like touch/lsregister, and Spotlight may index the
          # volume) keeps it busy, so `hdiutil detach` fails with
          # "Resource busy" (exit 16) right after a successful install.
          INSTALLER_LOCAL="$HOME/acv-installer-local.app"
          ditto "$INSTALLER_APP" "$INSTALLER_LOCAL"
          INSTALLER_BIN=$(find "$INSTALLER_LOCAL/Contents/MacOS" -type f -perm +111 | head -1)
          echo "Installer binary: $INSTALLER_BIN"

          INSTALL_DIR="$HOME/ACloudViewer"
          "$INSTALLER_BIN" --root "$INSTALL_DIR" \
            --accept-licenses --accept-messages --confirm-command install

          # Detach with retry; fall back to -force for transient system
          # references (mds/Spotlight, LaunchServices). Installation is
          # already complete at this point, so never fail the job here.
          cd "$HOME"
          if ! hdiutil detach "$VOLUME" -quiet; then
            echo "::warning::hdiutil detach busy, retrying after 3s"
            sleep 3
            hdiutil detach "$VOLUME" -quiet \
              || hdiutil detach "$VOLUME" -force \
              || echo "::warning::forced detach failed; leaving volume mounted"
          fi

          echo "=== Installed contents ==="
          ls -la "$INSTALL_DIR"/

          if [ -d "$INSTALL_DIR/ACloudViewer.app" ]; then
            echo "$INSTALL_DIR/ACloudViewer.app/Contents/MacOS" >> "$GITHUB_PATH"
            echo "ACV_BINARY=$INSTALL_DIR/ACloudViewer.app/Contents/MacOS/ACloudViewer" >> "$GITHUB_ENV"
          elif [ -f "$INSTALL_DIR/ACloudViewer" ]; then
            echo "$INSTALL_DIR" >> "$GITHUB_PATH"
            echo "ACV_BINARY=$INSTALL_DIR/ACloudViewer" >> "$GITHUB_ENV"
          else
            echo "::error::ACloudViewer binary not found after install"
            find "$INSTALL_DIR" -name "ACloudViewer*" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Install agent harness
        run: |
          pip install -e "_cli-anything/acloudviewer/agent-harness[dev]"

      - name: qPythonRuntime installed binding contracts
        run: |
          python -m pytest plugins/core/Standard/qPythonRuntime/tests/test_binding_contracts.py -q --acloudviewer_exe="$ACV_BINARY"

      - name: Level 3 — Headless processing tests
        env:
          ACV_REQUIRE_BINARY: "1"
        run: |
          python -m pytest agent-integration/tests/test_integration.py -v -k "level3"

  build-wheel:
    name: Build wheel
    permissions:
      contents: write  # upload
      actions: write   # release
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      # https://github.community/t/how-to-conditionally-include-exclude-items-in-matrix-eg-based-on-branch/16853/6
      matrix:
        os: [macos-15]
        python_version: ['3.10', '3.11', '3.12']
        is_main:
          - ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        exclude:
          - is_main: false
            python_version: '3.10'
          - is_main: false
            python_version: '3.11'

    env:
      CONDA_DEP_FILE: ".ci/conda_macos.yml"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Keep PyTorch builds and tests enabled on the macOS 15 Apple Silicon runner.
      BUILD_PYTORCH_OPS: ON
      # Keep TensorFlow disabled; the runner migration does not change ML coverage.
      BUILD_TENSORFLOW_OPS: OFF
      CLOUDVIEWER_ML_ROOT: ${{ github.workspace }}/CloudViewer-ML
    steps:
      - name: Setup DEVELOPER_BUILD
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "DEVELOPER_BUILD=OFF" >> $GITHUB_ENV
          else
            echo "DEVELOPER_BUILD=${{ github.event.inputs.developer_build || 'ON' }}" >> $GITHUB_ENV
          fi

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Checkout CloudViewer-ML source code
        uses: actions/checkout@v4
        with:
          repository: Asher-1/CloudViewer-ML
          ref: main
          path: ${{ env.CLOUDVIEWER_ML_ROOT }}

      - name: Restore compiler cache (stash)
        id: ccache-restore
        continue-on-error: true
        uses: apache/infrastructure-actions/stash/restore@e3e0a2261a9c6d5bdd882802b303f34b1511b6df
        with:
          key: ccache-macos-${{ runner.arch }}-wheel-py${{ matrix.python_version }}
          path: ${{ env.CCACHE_DIR }}
      - name: Seed compiler cache from legacy release asset
        if: steps.ccache-restore.outputs.stash-hit != 'true'
        continue-on-error: true
        run: |
          ASSET="ccache-macos-wheel-py${{ matrix.python_version }}.tar.gz"
          mkdir -p "$CCACHE_DIR"
          curl -fsSL --retry 3 -o /tmp/ccache-restore.tar.gz \
            "https://github.com/Asher-1/cloudViewer_downloads/releases/download/ci-ccache/${ASSET}" \
            && tar -xzf /tmp/ccache-restore.tar.gz -C "$CCACHE_DIR" \
            || echo "[cache] no legacy wheel pool; using a cold build"
          rm -f /tmp/ccache-restore.tar.gz

      - name: Set up Python version
        run: |
          sed -i "" "s/3.10/${{ matrix.python_version }}/g" ${{ env.CONDA_DEP_FILE }}

      - name: Set up Python environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: python${{ matrix.python_version }}
          auto-activate-base: false
          environment-file: ${{ env.CONDA_DEP_FILE }}
      - name: Set up fixed CMake
        uses: ./.github/actions/setup-cmake

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          set -e -o pipefail
          echo "Using python: $(which python)"
          python --version
          echo -n "Using pip: $(which pip)"
          python -m pip --version
          echo "Using cmake: $(which cmake)"
          cmake --version
          source util/ci_utils.sh
          install_python_dependencies
          
          if [[ ${{ runner.arch }} == "ARM64" ]]; then
            brew install gcc
            FC="$(brew --prefix)/bin/gfortran"
            test -x "$FC"
            "$FC" --version
            echo "FC=$FC" >> "$GITHUB_ENV"
            echo "$(dirname "$FC")" >> "$GITHUB_PATH"
          fi

          brew install ccache
          # Disk cache only, not resident RAM; leave room for the complete working set.
          ccache -M 10G
          # Same cross-image cache key policy as the App job.
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=locale

      - name: Check Filament source patch
        shell: bash -l {0}
        run: python 3rdparty/filament/test_filament_patch.py

      - name: Check wheel bundler
        shell: bash -l {0}
        run: python scripts/platforms/mac/bundle/test_lib_bundle_wheel.py

      - name: Config and build Wheel
        id: build
        shell: bash -l {0}
        run: |
          set -e -o pipefail
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export PATH="$CONDA_PREFIX/lib:$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/lib/cmake:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "DEVELOPER_BUILD is ${{ env.DEVELOPER_BUILD }}"

          ccache -z
          ccache -s
          trap 'ccache -s' EXIT
          echo "Start to build wheel package On MacOS..."
          source util/ci_utils.sh
          print_ccache_key_inputs
          # Tee the full build log to a file so it can be uploaded as an
          # artifact below (GitHub truncates very long step logs in the UI).
          build_mac_wheel with_conda build_realsense 2>&1 | tee /tmp/macos-wheel-build.log

          PIP_PKG_NAME="$(basename build/lib/python_package/pip_package/cloudviewer*.whl)"
          echo "PIP_PKG_NAME=$PIP_PKG_NAME" >> $GITHUB_ENV

      - name: Save compiler cache (stash)
        if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), steps.build.outcome) }}
        continue-on-error: true
        uses: apache/infrastructure-actions/stash/save@e3e0a2261a9c6d5bdd882802b303f34b1511b6df
        with:
          key: ccache-macos-${{ runner.arch }}-wheel-py${{ matrix.python_version }}
          path: ${{ env.CCACHE_DIR }}
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload build log
        # Persist the full build log (GitHub truncates very long step logs in
        # the UI). if: always() + continue-on-error: upload even when the build
        # failed, so it can be inspected.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel-build-log-py${{ matrix.python_version }}
          path: /tmp/macos-wheel-build.log
          if-no-files-found: ignore

      - name: Upload Wheel to GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PIP_PKG_NAME }}
          path: build/lib/python_package/pip_package/${{ env.PIP_PKG_NAME }}
          if-no-files-found: error
      
      - name: Update devel release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload main-devel build/lib/python_package/pip_package/${{ env.PIP_PKG_NAME }} --clobber
          gh release view main-devel

      - name: Public Wheel Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          generate_release_notes: false
          prerelease: false
          # body_path: ${{github.workspace}}/CHANGELOG.md
          files: |
            build/lib/python_package/pip_package/${{ env.PIP_PKG_NAME }}

  test-wheel:
    name: Test wheel
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    needs: [build-wheel]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python_version: ['3.10', '3.11', '3.12']
        is_main:
          - ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        exclude:
          - is_main: false
            python_version: '3.10'
          - is_main: false
            python_version: '3.11'

    env:
      # Keep PyTorch builds and tests enabled on the macOS 15 Apple Silicon runner.
      BUILD_PYTORCH_OPS: ON
      # Keep TensorFlow disabled; the runner migration does not change ML coverage.
      BUILD_TENSORFLOW_OPS: OFF
      CLOUDVIEWER_ML_ROOT: ${{ github.workspace }}/CloudViewer-ML
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Checkout CloudViewer-ML source code
        uses: actions/checkout@v4
        with:
          repository: Asher-1/CloudViewer-ML
          ref: main
          path: ${{ env.CLOUDVIEWER_ML_ROOT }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cloudviewer-*macosx*.whl
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      
      - name: Test Python package
        run: |
          python -V
          source util/ci_utils.sh
          pi_tag=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          test_wheel cloudviewer*-"$pi_tag"-*_$(uname -m).whl
      # - name: Run Python unit tests
      #   run: |
      #     python -V
      #     source util/ci_utils.sh
      #     echo "Running CloudViewer python tests..."
      #     pi_tag=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
      #     run_python_tests cloudviewer*-"$pi_tag"-*_$(uname -m).whl
