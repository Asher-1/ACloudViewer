name: Documentation

on:
  workflow_dispatch:
    inputs:
      developer_build:
        description: 'Set to OFF for Release documentation'
        required: false
        default: 'ON'
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  release:
    types: [released, edited]  # Trigger when release is published

concurrency:
  # For PR builds: use separate group, can cancel previous
  # For main/release: use shared group to prevent concurrent deployments
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages-deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Job 0: Structural guards (cheap, runs first)
  #
  # A workflow file that exceeds GitHub's per-`run` expression limit is
  # rejected before any job is created: no logs, no steps, nothing but an
  # annotation in the run's HTML page. These guards make that class of failure
  # and the deploy script's own contracts fail loudly and locally.
  # ===========================================================================
  docs-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guard dependencies
        run: pip install pyyaml

      - name: Workflow size limits
        run: python3 docs/automation/scripts/check_workflow_limits.py

      - name: Version derivation from version.txt
        run: python3 scripts/sync_version.py --check

      - name: Deploy script contract tests
        run: bash docs/automation/scripts/test_deploy_unified_docs.sh

  # ===========================================================================
  # Job 1: Build Documentation (runs for all events including PRs)
  # ===========================================================================
  build-docs:
    needs: docs-guards
    runs-on: ubuntu-latest
    permissions:
      contents: write        # For uploading artifacts and releases
      pull-requests: write   # For commenting on pull requests
      issues: write          # For creating issue comments
    
    # Output variables for the deploy job
    outputs:
      is_release: ${{ steps.config.outputs.is_release }}
      release_version: ${{ steps.config.outputs.release_version }}
      doc_version: ${{ steps.config.outputs.doc_version }}
      artifact_name: ${{ steps.config.outputs.artifact_name }}
      should_deploy: ${{ steps.config.outputs.should_deploy }}
    
    env:
      DEVELOPER_BUILD: ${{ github.event.inputs.developer_build || (github.event_name == 'release' && 'OFF' || 'ON') }}
    
    steps:
      - name: Determine version and build mode
        id: config
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Build Configuration"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Determine if this is a release build
          IS_RELEASE="${{ github.event_name == 'release' && 'true' || 'false' }}"
          RELEASE_VERSION="${{ github.event.release.tag_name || '' }}"
          DOC_VERSION="${{ github.event.release.tag_name != '' && github.event.release.tag_name || 'latest' }}"
          
          # Determine artifact name
          if [ "$IS_RELEASE" == "true" ] && [ -n "$RELEASE_VERSION" ]; then
            ARTIFACT_NAME="acloudviewer-${RELEASE_VERSION}-docs"
          else
            ARTIFACT_NAME="acloudviewer-${{ github.sha }}-docs"
          fi
          
          # Determine if we should deploy (main branch or release, not PR)
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.event_name }}" == "release" ]; then
            SHOULD_DEPLOY="true"
          else
            SHOULD_DEPLOY="false"
          fi
          
          # Set outputs for deploy job
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "doc_version=${DOC_VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "should_deploy=${SHOULD_DEPLOY}" >> $GITHUB_OUTPUT
          
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Is Release: ${IS_RELEASE}"
          echo "Release Version: ${RELEASE_VERSION}"
          echo "Documentation Version: ${DOC_VERSION}"
          echo "Developer Build: ${{ env.DEVELOPER_BUILD }}"
          echo "Should Deploy: ${SHOULD_DEPLOY}"
          echo ""
          
          if [ "$IS_RELEASE" == "true" ]; then
            echo "🎯 Release build detected - will archive documentation to version directory"
            echo "   Version: ${DOC_VERSION}"
            echo "   Archive path: documentation/${DOC_VERSION}/"
          elif [ "$SHOULD_DEPLOY" == "true" ]; then
            echo "📝 Development build - will deploy to latest documentation"
            echo "   Path: documentation/"
          else
            echo "🔍 PR build - documentation will be built but not deployed"
          fi
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Checkout ACloudViewer source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch or generate downloads_data.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Obtaining downloads_data.json"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Strategy: Fetch from main-devel release or generate from API"
          echo ""
          
          # Try to fetch from main-devel release (managed by update-downloads workflow)
          echo "🔍 Attempting to fetch from main-devel release..."
          if gh release download main-devel --pattern "downloads_data.json" --dir docs 2>/dev/null; then
            echo "✅ Successfully fetched from main-devel release"
            echo "  - Size: $(du -h docs/downloads_data.json | cut -f1)"
            echo "  - Versions: $(jq '.version_metadata | length' docs/downloads_data.json)"
            echo "  - Last update: $(jq -r '.generated_at' docs/downloads_data.json)"
            echo ""
            echo "ℹ️  This data is managed by the 'update-downloads' workflow"
          else
            # Fallback: Generate from GitHub API
            echo "⚠️  Could not fetch from release, generating from GitHub API..."
            echo ""
            
            python3 docs/automation/scripts/scan_releases.py
            
            if [ -f "docs/downloads_data.json" ]; then
              echo "✅ Generated downloads_data.json from GitHub API"
              echo "  - Size: $(du -h docs/downloads_data.json | cut -f1)"
              echo "  - Versions: $(jq '.version_metadata | length' docs/downloads_data.json)"
            else
              echo "❌ Failed to obtain downloads_data.json!"
              echo "Creating minimal placeholder..."
              echo '{"generated_at":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'","version_metadata":{},"download_links":{}}' > docs/downloads_data.json
            fi
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Maximize build space
        run: |
          echo "🧹 Cleaning up disk space..."
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build documentation Docker image
        run: |
          echo "🐳 Building documentation Docker image..."
          echo "Build parameters:"
          echo "  - BASE_IMAGE: ubuntu:22.04"
          echo "  - DEVELOPER_BUILD: ${DEVELOPER_BUILD}"
          echo ""
          
          docker build \
            --progress=plain \
            --build-arg BASE_IMAGE=ubuntu:22.04 \
            --build-arg DEVELOPER_BUILD=${DEVELOPER_BUILD} \
            -t acloudviewer-ci:docs \
            -f docker/Dockerfile.docs \
            .
          
          echo ""
          echo "✅ Docker image built successfully"
          docker images | grep acloudviewer-ci
      
      - name: Extract documentation from Docker
        run: |
          echo "📦 Extracting documentation..."
          
          # Run Docker container to copy documentation archive
          docker run \
            -v "${GITHUB_WORKSPACE}:/opt/mount" \
            --rm acloudviewer-ci:docs \
            bash -c "cp /root/ACloudViewer/acloudviewer-*-docs.tar.gz /opt/mount/ \
                  && chown $(id -u):$(id -g) /opt/mount/acloudviewer-*-docs.tar.gz"
          
          # Verify extraction
          if [ ! -f acloudviewer-*-docs.tar.gz ]; then
            echo "❌ Documentation archive not found!"
            exit 1
          fi
          
          # Determine archive name based on event type
          IS_RELEASE="${{ steps.config.outputs.is_release }}"
          RELEASE_VERSION="${{ steps.config.outputs.release_version }}"
          
          if [ "$IS_RELEASE" == "true" ] && [ -n "$RELEASE_VERSION" ]; then
            # For releases, use version tag
            ARCHIVE_NAME="acloudviewer-${RELEASE_VERSION}-docs.tar.gz"
            mv acloudviewer-*-docs.tar.gz "${ARCHIVE_NAME}"
            echo "📋 Release archive: ${ARCHIVE_NAME}"
          else
            # For development builds, use SHA
            ARCHIVE_NAME="acloudviewer-${{ github.sha }}-docs.tar.gz"
            mv acloudviewer-*-docs.tar.gz "${ARCHIVE_NAME}"
            echo "📋 Development archive: ${ARCHIVE_NAME}"
          fi
          
          echo "📋 Archive details:"
          ls -lh "${ARCHIVE_NAME}"
          
          # Extract for GitHub Pages deployment
          echo ""
          echo "📂 Extracting documentation for deployment..."
          mkdir -p docs-output
          tar -xzf "${ARCHIVE_NAME}" -C docs-output/
          
          # Verify extraction
          if [ ! -f "docs-output/index.html" ]; then
            echo "⚠️  Warning: index.html not found in extracted documentation"
          fi
          
          echo ""
          echo "✅ Documentation extracted successfully"
          echo ""
          echo "📊 Extracted content:"
          echo "  - Total files: $(find docs-output -type f | wc -l)"
          echo "  - HTML files: $(find docs-output -name '*.html' | wc -l)"
          echo "  - Total size: $(du -sh docs-output | cut -f1)"
          echo ""
          echo "📁 Top-level structure:"
          ls -la docs-output/
      
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.artifact_name }}
          path: acloudviewer-*-docs.tar.gz
          if-no-files-found: error
          compression-level: 0  # Already compressed
      
      - name: Upload docs-output for deploy job
        if: steps.config.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-output
          path: docs-output/
          if-no-files-found: error
          retention-days: 1  # Short retention, only needed for deploy job
      
      - name: Upload website-deploy for deploy job
        if: steps.config.outputs.should_deploy == 'true'
        run: |
          echo "📋 Preparing main website with generated downloads_data.json..."
          echo ""
          
          # Create website deployment directory
          mkdir -p website-deploy
          
          # Copy main website files (excluding build artifacts)
          echo "Copying main website files..."
          rsync -av --exclude='_out' --exclude='_build' --exclude='*.pyc' \
                --exclude='__pycache__' --exclude='.pytest_cache' \
                docs/ website-deploy/
          
          # ============================================================
          # Replace @VERSION@ placeholder in index.html
          # Mode B: Website version should match the stable documentation
          # ============================================================
          echo ""
          echo "🔄 Replacing @VERSION@ placeholder in website files..."
          echo "   (Mode B: Website version = Latest stable release)"
          
          # Determine version to use
          IS_RELEASE="${{ steps.config.outputs.is_release }}"
          RELEASE_VERSION="${{ steps.config.outputs.release_version }}"
          
          if [ "$IS_RELEASE" == "true" ] && [ -n "$RELEASE_VERSION" ]; then
            # For releases, use the release tag (e.g., v3.9.4)
            WEBSITE_VERSION="$RELEASE_VERSION"
            echo "  Release build: using $WEBSITE_VERSION"
          else
            # For main branch (Mode B): Use the latest stable release version
            # This keeps website version consistent with /documentation/ (stable)
            echo "  Development build: looking for latest stable release..."
            
            # Try to get latest release tag from GitHub
            LATEST_RELEASE=$(gh release list --limit 10 --json tagName -q '.[].tagName' 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            
            if [ -n "$LATEST_RELEASE" ]; then
              WEBSITE_VERSION="$LATEST_RELEASE"
              echo "  Found latest stable release: $WEBSITE_VERSION"
            else
              # Fallback: extract version from version.txt
              echo "  No stable release found, falling back to version.txt..."
              VERSION_FILE="libs/cloudViewer/version.txt"
              if [ -f "$VERSION_FILE" ]; then
                MAJOR=$(grep "CLOUDVIEWER_VERSION_MAJOR" "$VERSION_FILE" | awk '{print $2}')
                MINOR=$(grep "CLOUDVIEWER_VERSION_MINOR" "$VERSION_FILE" | awk '{print $2}')
                PATCH=$(grep "CLOUDVIEWER_VERSION_PATCH" "$VERSION_FILE" | awk '{print $2}')
                if [ -n "$MAJOR" ] && [ -n "$MINOR" ] && [ -n "$PATCH" ]; then
                  WEBSITE_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
                else
                  WEBSITE_VERSION="dev"
                fi
              else
                WEBSITE_VERSION="dev"
              fi
              echo "  Using fallback version: $WEBSITE_VERSION"
            fi
          fi
          
          echo "  Version to use: $WEBSITE_VERSION"
          
          # Replace @VERSION@ in index.html
          if [ -f "website-deploy/index.html" ]; then
            if grep -q '@VERSION@' website-deploy/index.html; then
              sed -i "s/@VERSION@/$WEBSITE_VERSION/g" website-deploy/index.html
              echo "  ✅ Replaced @VERSION@ with $WEBSITE_VERSION in index.html"
            else
              echo "  ℹ️  No @VERSION@ placeholder found in index.html"
            fi
          fi
          
          # Inject the latest stable version into 404.html so the 404
          # fallback page can redirect legacy flat /documentation/ deep links
          # (e.g. /documentation/getting_started/build_from_source.html) to
          # the equivalent page under /documentation/<latest-stable>/.
          # The page itself gates on a vX.Y.Z|dev pattern, so a failed
          # injection degrades safely to the plain 404 view.
          if [ -f "website-deploy/404.html" ]; then
            sed -i "s/@LATEST_STABLE_VERSION@/$WEBSITE_VERSION/g" website-deploy/404.html
            echo "  ✅ Injected latest stable version ($WEBSITE_VERSION) into 404.html"
          fi
          
          # ============================================================
          # Ensure downloads_data.json is included
          # ============================================================
          if [ -f "docs/downloads_data.json" ]; then
            echo "✅ downloads_data.json ready for deployment"
            cp docs/downloads_data.json website-deploy/
            echo "  Size: $(du -h docs/downloads_data.json | cut -f1)"
            echo "  Versions: $(jq '.version_metadata | length' docs/downloads_data.json)"
          else
            echo "⚠️ downloads_data.json not found, using placeholder"
            echo '{"generated_at":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'","version_metadata":{},"download_links":{}}' > website-deploy/downloads_data.json
          fi
          
          # Create a README for the documentation subdirectory link
          cat > website-deploy/DOCUMENTATION.md << 'DOCEOF'
          # ACloudViewer Documentation
          
          Full API documentation is available at: [/documentation/](/documentation/)
          
          ## Documentation Structure
          
          - **Main Website**: Current page (project info, downloads, getting started)
          - **API Documentation**: [/documentation/](/documentation/) (Python API, C++ API, Tutorials)
          
          ## Quick Links
          
          - [Python API Reference](/documentation/python_api/)
          - [C++ API Reference](/documentation/cpp_api/)
          - [Tutorials](/documentation/tutorial/)
          DOCEOF
          
          echo ""
          echo "✅ Main website prepared for deployment"
          echo ""
          echo "📊 Website deployment statistics:"
          echo "  - Total files: $(find website-deploy -type f | wc -l)"
          echo "  - Total size: $(du -sh website-deploy | cut -f1)"
      
      - name: Upload website-deploy artifact
        if: steps.config.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: website-deploy
          path: website-deploy/
          if-no-files-found: error
          retention-days: 1
      
      - name: Update main-devel release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📤 Uploading to main-devel release..."
          gh release upload main-devel \
            acloudviewer-${{ github.sha }}-docs.tar.gz \
            --clobber
          gh release view main-devel
      
      - name: Upload documentation archive to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION="${{ steps.config.outputs.release_version }}"
          echo "📤 Uploading documentation archive to release ${RELEASE_VERSION}..."
          
          # Rename archive to include version tag for easy identification
          VERSIONED_ARCHIVE="acloudviewer-${RELEASE_VERSION}-docs.tar.gz"
          cp acloudviewer-*-docs.tar.gz "${VERSIONED_ARCHIVE}"
          
          gh release upload "${RELEASE_VERSION}" \
            "${VERSIONED_ARCHIVE}" \
            --clobber
          
          echo "✅ Documentation archive uploaded to release"
          echo "   This archive will be used to preserve version history in future deployments"
      
      - name: Comment on PR with documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifactName = '${{ steps.config.outputs.artifact_name }}';
            
            // Find the archive file
            const files = fs.readdirSync('.').filter(f => f.endsWith('-docs.tar.gz'));
            const archiveFile = files[0] || 'acloudviewer-docs.tar.gz';
            let fileSize = 'unknown';
            try {
              const stats = fs.statSync(archiveFile);
              fileSize = (stats.size / 1024 / 1024).toFixed(2);
            } catch (e) {
              console.log('Could not get file size:', e.message);
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📚 **Documentation Preview**\n\n` +
                    `Documentation has been built successfully!\n\n` +
                    `- **Artifact**: \`${artifactName}\`\n` +
                    `- **Download**: Available in workflow run artifacts\n` +
                    `- **Size**: ~${fileSize} MB\n\n` +
                    `After merge, documentation will be automatically deployed to:\n` +
                    `https://asher-1.github.io/ACloudViewer/documentation/`
            });

  # ===========================================================================
  # Job 2: Deploy Documentation (only runs for main branch or releases)
  # ===========================================================================
  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    # Only deploy for main branch or releases, NOT for PRs
    if: needs.build-docs.outputs.should_deploy == 'true'
    
    permissions:
      contents: read         # For downloading artifacts
      pages: write           # For deploying to GitHub Pages
      id-token: write        # For GitHub Pages deployment (OIDC token)
    
    # Configure GitHub Pages environment for artifact-based deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    env:
      IS_RELEASE: ${{ needs.build-docs.outputs.is_release }}
      RELEASE_VERSION: ${{ needs.build-docs.outputs.release_version }}
      DOC_VERSION: ${{ needs.build-docs.outputs.doc_version }}
    
    steps:
      - name: Checkout (for gh CLI and deploy scripts)
        uses: actions/checkout@v4
        with:
          # docs/automation must be present: the merge step runs
          # docs/automation/scripts/deploy_unified_docs.sh from this checkout.
          sparse-checkout: |
            .github
            docs/automation
          sparse-checkout-cone-mode: false
      
      - name: Download docs-output artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-output
          path: docs-output/
      
      - name: Download website-deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: website-deploy
          path: website-deploy/
      
      - name: Preserve existing version archives from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Preserving existing version archives from GitHub Releases"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Strategy: Download documentation archives from GitHub Releases"
          echo "         (Version archives are stored as release assets, not in git)"
          echo ""
          echo "Current build info:"
          echo "  IS_RELEASE: ${{ env.IS_RELEASE }}"
          echo "  RELEASE_VERSION: ${{ env.RELEASE_VERSION }}"
          echo "  DOC_VERSION: ${{ env.DOC_VERSION }}"
          echo ""
          
          # Create directory for preserved archives
          mkdir -p preserved-versions/documentation
          
          # Get list of releases with documentation archives
          echo "🔍 Scanning GitHub Releases for documentation archives..."
          echo ""
          
          # First, list all releases to debug
          echo "📋 All releases:"
          gh release list --limit 20 || echo "  (failed to list releases)"
          echo ""
          
          RELEASES=$(gh release list --limit 20 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' || true)
          
          FOUND_COUNT=0
          NOT_FOUND_COUNT=0
          
          if [ -n "$RELEASES" ]; then
            echo "✅ Found versioned releases:"
            echo "$RELEASES"
            echo ""
            
            for VERSION in $RELEASES; do
              echo "  - Checking $VERSION..."
              
              # List assets for this release to debug
              echo "    Assets in $VERSION:"
              gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | head -10 || echo "    (failed to list assets)"
              
              # Try to download documentation archive from release
              DOCS_ARCHIVE="acloudviewer-${VERSION}-docs.tar.gz"
              if gh release download "$VERSION" --pattern "$DOCS_ARCHIVE" --dir /tmp 2>/dev/null; then
                echo "    ✅ Found and downloaded $DOCS_ARCHIVE"
                mkdir -p "preserved-versions/documentation/$VERSION"
                tar -xzf "/tmp/$DOCS_ARCHIVE" -C "preserved-versions/documentation/$VERSION/" 2>/dev/null || {
                  echo "    ⚠️  Failed to extract $DOCS_ARCHIVE"
                }
                rm -f "/tmp/$DOCS_ARCHIVE"
                FOUND_COUNT=$((FOUND_COUNT + 1))
              else
                echo "    ⏭️  No documentation archive found for $VERSION"
                echo "       Expected: $DOCS_ARCHIVE"
                echo "       💡 To add: manually upload acloudviewer-${VERSION}-docs.tar.gz to this release"
                NOT_FOUND_COUNT=$((NOT_FOUND_COUNT + 1))
              fi
              echo ""
            done
            
            echo "📊 Summary:"
            echo "  - Found archives: $FOUND_COUNT"
            echo "  - Missing archives: $NOT_FOUND_COUNT"
            echo ""
            echo "📊 Preserved version archives:"
            ls -la preserved-versions/documentation/ 2>/dev/null | grep -E '^d.*v[0-9]+' || echo "  (none found)"
            if [ -d "preserved-versions/documentation" ]; then
              for dir in preserved-versions/documentation/*/; do
                if [ -d "$dir" ]; then
                  echo "  - $(basename $dir): $(find "$dir" -type f | wc -l) files, $(du -sh "$dir" | cut -f1)"
                fi
              done
            fi
          else
            echo "ℹ️  No versioned releases found"
          fi

          # ============================================================
          # Preserve the DEV documentation tree.
          #
          # GitHub Pages replaces the whole artifact on each deploy. A release
          # build produces only the new vX.Y.Z archive, so unless dev is
          # carried forward it disappears from the deployment and every
          # /documentation/dev/ link starts 404ing. Every main build publishes
          # the dev docs to the `main-devel` release, which is therefore the
          # correct place to restore them from here.
          # ============================================================
          echo ""
          echo "📦 Preserving development documentation"
          DEV_ARCHIVE=$(gh release view main-devel --json assets \
            --jq '.assets[].name | select(test("^acloudviewer-[0-9a-f]+-docs\\.tar\\.gz$"))' 2>/dev/null | head -1 || true)
          if [ -n "$DEV_ARCHIVE" ]; then
            echo "  Found dev archive: $DEV_ARCHIVE"
            if gh release download main-devel --pattern "$DEV_ARCHIVE" --dir /tmp 2>/dev/null; then
              mkdir -p preserved-versions/documentation/dev
              if tar -xzf "/tmp/$DEV_ARCHIVE" -C preserved-versions/documentation/dev/ 2>/dev/null; then
                echo "  ✅ Restored dev: $(find preserved-versions/documentation/dev -type f | wc -l) files"
              else
                echo "  ⚠️  Could not extract $DEV_ARCHIVE"
              fi
              rm -f "/tmp/$DEV_ARCHIVE"
            else
              echo "  ⚠️  Could not download $DEV_ARCHIVE"
            fi
          else
            echo "  ℹ️  No dev archive on main-devel yet"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Merge website and documentation for unified deployment
        # The body lives in docs/automation/scripts/deploy_unified_docs.sh.
        # GitHub rejects the whole workflow when a single `run:` scalar
        # exceeds 21000 characters ("Exceeded max expression length"), and
        # that failure creates no jobs and no logs. Keeping this step a
        # constant-size pointer makes the workflow structure-independent of
        # the deploy logic, which is now testable outside CI.
        env:
          SITE_URL: https://asher-1.github.io/ACloudViewer
        run: bash docs/automation/scripts/deploy_unified_docs.sh
      # ============================================================================
      # GitHub Pages Artifact Deployment (No git objects pollution!)
      # This method uses GitHub's artifact storage instead of git branches,
      # so it won't affect git pull/fetch for other developers.
      # ============================================================================
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./unified-deploy
          # Note: This uploads the entire unified-deploy directory as a single artifact
          # No git objects are created - deployment uses GitHub's artifact storage
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # This deploys directly from the artifact, NOT through git
        # Benefits:
        # - No gh-pages branch needed
        # - No git objects pollution
        # - git pull/fetch won't download documentation files
        # - Other developers won't be affected by documentation updates
      
      - name: Verify deployment structure
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Deployment Verification (Mode B)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📋 Mode B Documentation Structure:"
          echo "   /documentation/       → Latest stable release"
          echo "   /documentation/dev/   → Development version"
          echo "   /documentation/vX.X.X → Permanent version archives"
          echo ""
          echo "📋 Deployment Summary:"
          echo "  ✅ Documentation built successfully"
          echo "  ✅ Main website prepared ($(du -sh website-deploy | cut -f1))"
          echo "  ✅ Unified deployment merged ($(du -sh unified-deploy | cut -f1))"
          
          if [ "${{ env.IS_RELEASE }}" == "true" ]; then
            echo "  ✅ Release ${{ env.RELEASE_VERSION }} deployed:"
            echo "     - /documentation/ updated (latest stable)"
            echo "     - /documentation/${{ env.DOC_VERSION }}/ created (permanent archive)"
          else
            echo "  ✅ Development build deployed:"
            echo "     - /documentation/dev/ updated"
            echo "     - /documentation/ preserved (latest stable release)"
          fi
          
          echo ""
          echo "🌐 GitHub Pages Structure:"
          echo "  https://asher-1.github.io/ACloudViewer/"
          echo "  ├── index.html (main website)"
          echo "  ├── downloads_data.json"
          echo "  └── documentation/"
          echo "      ├── index.html      (latest stable release)"
          echo "      ├── python_api/"
          echo "      ├── cpp_api/"
          echo "      ├── tutorial/"
          echo "      ├── dev/            (development version)"
          echo "      │   ├── index.html"
          echo "      │   ├── python_api/"
          echo "      │   └── ..."
          echo "      ├── v3.9.4/         (version archive)"
          echo "      ├── v3.9.3/         (version archive)"
          echo "      └── ..."
          
          echo ""
          echo "📚 Documentation URLs (Mode B):"
          echo "  - Main Website:      https://asher-1.github.io/ACloudViewer/"
          echo "  - Latest Stable:     https://asher-1.github.io/ACloudViewer/documentation/"
          echo "  - Development:       https://asher-1.github.io/ACloudViewer/documentation/dev/"
          
          if [ "${{ env.IS_RELEASE }}" == "true" ]; then
            echo ""
            echo "📦 This Release (${{ env.RELEASE_VERSION }}):"
            echo "  - Version Archive:   https://asher-1.github.io/ACloudViewer/documentation/${{ env.DOC_VERSION }}/"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # =====================================================================
      # Live smoke test.
      #
      # GitHub Pages serves the artifact asynchronously, so a green
      # `deploy-pages` step only means the upload succeeded. Nothing above
      # proves the deployed site is actually reachable or that versions.json
      # exists -- which is exactly how a broken 404 redirect and a missing
      # version manifest survived in production. Probe the real URLs and fail
      # the run when they do not answer.
      # =====================================================================
      - name: Verify live deployment
        if: success()
        run: |
          set -uo pipefail
          SITE="https://asher-1.github.io/ACloudViewer"
          FAILED=0

          # probe <url> <expected-substring>: retries while Pages propagates.
          # Bounded retry budget. Pages publishes an artifact asynchronously,
          # so a short propagation window is legitimate; waiting minutes per
          # probe is not. 6 attempts x (10s timeout + 5s wait) caps a failed
          # probe at ~90s, keeping the whole check under the job timeout even
          # when the deployment is genuinely broken.
          PROBE_ATTEMPTS=6
          PROBE_TIMEOUT=10
          PROBE_WAIT=5

          probe() {
            local url="$1" needle="${2:-}"
            local code="" body="" attempt
            for attempt in $(seq 1 "$PROBE_ATTEMPTS"); do
              body=$(curl -sS --max-time "$PROBE_TIMEOUT" -w '\n%{http_code}' "$url" 2>/dev/null) || body=""
              code=$(printf '%s' "$body" | tail -n1)
              if [ "$code" = "200" ]; then
                # Plain substring test, deliberately NOT `printf | grep -q`:
                # grep -q exits at the first match and closes the pipe, so
                # printf dies of SIGPIPE (141) and `set -o pipefail` turns a
                # successful match into a failed pipeline. That bug reported
                # a healthy 200 page as "missing".
                if [ -z "$needle" ] || case "$body" in *"$needle"*) true ;; *) false ;; esac; then
                  echo "  OK   $url"
                  return 0
                fi
                echo "  ..   $url (200 but missing '$needle', attempt $attempt/$PROBE_ATTEMPTS)"
              else
                echo "  ..   $url (HTTP ${code:-none}, attempt $attempt/$PROBE_ATTEMPTS)"
              fi
              [ "$attempt" -lt "$PROBE_ATTEMPTS" ] && sleep "$PROBE_WAIT"
            done
            echo "  FAIL $url (last HTTP ${code:-none})"
            return 1
          }

          echo "=============================================="
          echo "Live smoke test"
          echo "=============================================="

          probe "$SITE/" "ACloudViewer" || FAILED=1
          probe "$SITE/documentation/" "index.html" || FAILED=1
          probe "$SITE/documentation/versions.json" '"versions"' || FAILED=1
          probe "$SITE/documentation/dev/index.html" "documentation" || FAILED=1
          probe "$SITE/documentation/dev/cpp_api.html" "" || FAILED=1

          # The 404 handler must carry a calibrated version, otherwise legacy
          # deep links fall through to a bare 404 page.
          V404=$(curl -sS --max-time 30 "$SITE/404.html" 2>/dev/null | grep -oE "var version = '[^']*'" | head -1)
          if printf '%s' "$V404" | grep -qE "v[0-9]+\.[0-9]+\.[0-9]+|dev"; then
            echo "  OK   404 handler calibrated ($V404)"
          else
            echo "  FAIL 404 handler not calibrated ($V404)"
            FAILED=1
          fi

          # A legacy flat deep link must be rewritable, i.e. the handler must
          # exist at the site root and reference the documentation tree.
          if curl -sS --max-time 30 "$SITE/404.html" | grep -q '/documentation/'; then
            echo "  OK   404 handler knows the documentation tree"
          else
            echo "  FAIL 404 handler has no documentation redirect logic"
            FAILED=1
          fi

          # versions.json must agree with the directories actually served.
          MANIFEST=$(curl -sS --max-time 30 "$SITE/documentation/versions.json")
          for vid in $(printf '%s' "$MANIFEST" | grep -oE '"id": *"[^"]+"' | sed 's/.*: *"//;s/"$//'); do
            probe "$SITE/documentation/$vid/index.html" "" || FAILED=1
          done

          echo "=============================================="
          if [ "$FAILED" -ne 0 ]; then
            echo "Live deployment verification FAILED"
            exit 1
          fi
          echo "Live deployment verified"
