name: CI Qt production widget probe
'on':
  push:
    branches:
    - ci/qt-widget-probe-20261110
permissions:
  contents: read
jobs:
  qt-probe:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Match application Conda Python
      run: sed -i '' 's/python=3.10/python=3.12/g' .ci/conda_macos_cloudViewer.yml
    - uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: cloudViewer
        auto-activate-base: false
        environment-file: .ci/conda_macos_cloudViewer.yml
    - name: Compile and compare the loader environments
      shell: bash -l {0}
      run: "mkdir -p /tmp/qt-probe\ncat > /tmp/qt-probe/qt-probe.cpp <<'CPP'\n#include <QApplication>\n#include <QDialog>\n#include <QImageReader>\n#include <QListWidget>\n#include <QScrollArea>\n#include <QTableWidget>\n#include <QLineEdit>\n#include <QComboBox>\n#include <QPushButton>\n#include <QGridLayout>\n#include <QProgressBar>\n#include <cstdio>\n#include \"ecvAICoreUiHelper.h\"\nint main(int argc, char **argv) {\n QApplication app(argc,argv);\n std::fprintf(stderr,\"Qt %s style %s\\n\",qVersion(),qPrintable(app.style()->objectName()));\n QDialog dialog;auto* layout=new QVBoxLayout(&dialog);\n layout->addWidget(ecvAICoreUi::makeSampleDataBtn());\n auto* scroll=new QScrollArea();scroll->setWidgetResizable(true);auto* form=new QWidget();auto* grid=new QGridLayout(form);\n for(int i=0;i<10;++i){grid->addWidget(ecvAICoreUi::makeHintLabel(QStringLiteral(\"<b>Model checkpoint %1</b><br>Parameters\").arg(i)),i,0);auto* combo=new QComboBox();combo->addItems({\"F32\",\"F16\",\"Q8_0\"});grid->addWidget(combo,i,1);grid->addWidget(new QDoubleSpinBox(),i,2);}\n scroll->setWidget(form);layout->addWidget(scroll);layout->addWidget(new QTableWidget(4,9));\n auto* progress=new QProgressBar();progress->setRange(0,100);progress->setValue(5);layout->addWidget(progress);dialog.resize(800,600);\n std::fprintf(stderr,\"before show\\n\");std::fflush(stderr);dialog.show();\n for(int i=0;i<20;++i)QApplication::processEvents();\n std::fprintf(stderr,\"before grab\\n\");std::fflush(stderr);auto px=dialog.grab();\n std::fprintf(stderr,\"grabbed %dx%d\\n\",px.width(),px.height());return 0;\n}\nCPP\ncat > /tmp/qt-probe/CMakeLists.txt <<'CMAKE'\ncmake_minimum_required(VERSION 3.16)\nproject(QtCIProbe LANGUAGES CXX)\nfind_package(Qt5 REQUIRED COMPONENTS Widgets)\nadd_executable(qt-probe qt-probe.cpp)\ntarget_link_libraries(qt-probe PRIVATE Qt5::Widgets)\ntarget_include_directories(qt-probe PRIVATE \"$ENV{GITHUB_WORKSPACE}/libs/CVPluginAPI/include\")\nCMAKE\ncmake -S /tmp/qt-probe -B /tmp/qt-probe/build -DCMAKE_PREFIX_PATH=\"$CONDA_PREFIX\"\ncmake --build /tmp/qt-probe/build --parallel 2\nmkdir -p /tmp/qt-probe/results\nset +e\nQT_QPA_PLATFORM=offscreen DYLD_PRINT_LIBRARIES=1 /tmp/qt-probe/build/qt-probe > /tmp/qt-probe/results/clean.log 2>&1\nclean_status=$?\nQT_QPA_PLATFORM=offscreen DYLD_PRINT_LIBRARIES=1 DYLD_LIBRARY_PATH=\"$CONDA_PREFIX/lib\" /tmp/qt-probe/build/qt-probe > /tmp/qt-probe/results/override.log 2>&1\noverride_status=$?\nprintf 'clean_status=%s\\noverride_status=%s\\n' \"$clean_status\" \"$override_status\" | tee /tmp/qt-probe/results/status.txt\ntail -120 /tmp/qt-probe/results/clean.log\ntail -120 /tmp/qt-probe/results/override.log\nQT_QPA_PLATFORM=offscreen lldb -b -o \"settings set target.env-vars QT_QPA_PLATFORM=offscreen DYLD_LIBRARY_PATH=$CONDA_PREFIX/lib\" -o run -o 'thread backtrace all' -o 'image list' -o quit -- /tmp/qt-probe/build/qt-probe > /tmp/qt-probe/results/override-backtrace.log 2>&1\ntail -160 /tmp/qt-probe/results/override-backtrace.log\nfind \"$HOME/Library/Logs/DiagnosticReports\" -maxdepth 1 -type f -name '*qt-probe*' -exec cp {} /tmp/qt-probe/results/ \\; 2>/dev/null\nexit 0\n"
    - name: Upload logs and native crash reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qt-portability-diagnosis
        path: /tmp/qt-probe/results
        if-no-files-found: warn
