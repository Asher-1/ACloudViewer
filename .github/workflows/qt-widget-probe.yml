name: CI Ubuntu apt archive diagnosis
'on':
  push:
    branches:
    - ci/qt-widget-probe-20261110
permissions:
  contents: read
jobs:
  apt:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version:
        - '20.04'
        - '24.04'
    timeout-minutes: 15
    steps:
    - name: Check Ubuntu archive bootstrap on a clean image
      env:
        UBUNTU_VERSION: ${{ matrix.version }}
      run: "docker run --rm ubuntu:\"$UBUNTU_VERSION\" bash -c '\nset -eux\nfor attempt in 1 2 3; do\n if apt-get -o Acquire::Retries=3 update --fix-missing -y && apt-get -o Acquire::Retries=3 install -y apt-utils software-properties-common tzdata gnupg ca-certificates curl; then exit 0; fi\n if [ \"$attempt\" -eq 3 ]; then exit 1; fi\n rm -rf /var/lib/apt/lists/*\n sleep 10\ndone\n'\n"
