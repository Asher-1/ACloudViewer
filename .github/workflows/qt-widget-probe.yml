name: CI macOS loader regression verification
'on':
  push:
    branches:
    - ci/qt-widget-probe-20261110
permissions:
  contents: read
jobs:
  loader-regression:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-cmake
    - name: Verify production helper against dependency identity and fallback contracts
      run: 'set -e

        cp cmake/CloudViewerOutputDirectories.cmake /tmp/fixed-helper.cmake

        sed ''s/set(_cv_loader_var DYLD_FALLBACK_LIBRARY_PATH)/set(_cv_loader_var DYLD_LIBRARY_PATH)/'' /tmp/fixed-helper.cmake > cmake/CloudViewerOutputDirectories.cmake

        cmake -S core/tests/runtime-environment -B /tmp/runtime-before

        cmake --build /tmp/runtime-before --parallel 2

        set +e

        ctest --test-dir /tmp/runtime-before --output-on-failure

        before_status=$?

        set -e

        cp /tmp/fixed-helper.cmake cmake/CloudViewerOutputDirectories.cmake

        if [ "$before_status" -eq 0 ]; then echo ''Expected dependency replacement did not fail''; exit 1; fi

        cmake -S core/tests/runtime-environment -B /tmp/runtime-after

        cmake --build /tmp/runtime-after --parallel 2

        ctest --test-dir /tmp/runtime-after -V

        otool -L /tmp/runtime-after/pinned_probe

        otool -L /tmp/runtime-after/fallback_probe

        '
