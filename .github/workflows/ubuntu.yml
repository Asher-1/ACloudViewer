name: Ubuntu
permissions: {}

on:
  workflow_dispatch:
    inputs:
      developer_build:
        description: 'Set to OFF for Release wheels'
        required: false
        default: 'ON'
      aicore_model_tests:
        description: 'Run the AICore model tier (requires GGUF assets; tests skip when assets are missing)'
        required: false
        type: boolean
        default: false
      aicore_assets_root:
        description: 'AICore test asset root (extracted cloudViewer_data bundle, e.g. ~/cloudViewer_data/extract)'
        required: false
        default: ''
  push:
    branches:
      - main

  release:
    types: [released]

  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_BUILD: ${{ github.event.inputs.developer_build || 'ON' }}

jobs:
  skip-check:
    runs-on: ubuntu-latest
    name: Skip job for forks
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip check
        id: check
        run: |
          if [ "${GITHUB_REPOSITORY}" == "Asher-1/ACloudViewer" ]; then
            echo "skip=no" >> $GITHUB_OUTPUT
          else
            echo "skip=yes" >> $GITHUB_OUTPUT
          fi

  build-and-run-docker:
    name: Build and run
    permissions:
      contents: write  # upload
      actions: write   # release
    runs-on: ubuntu-latest
    needs: [skip-check]
    if: needs.skip-check.outputs.skip == 'no' && !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - CI_CONFIG: cpu-focal
          - CI_CONFIG: cpu-jammy
          - CI_CONFIG: cpu-noble
    env:
      # Export everything from matrix to be easily used.
      # Docker tag and ccache names must be consistent with docker_build.sh
      CI_CONFIG          : ${{ matrix.CI_CONFIG }}
      BUILD_PACKAGE      : true
      GCE_INSTANCE_PREFIX: cloudviewer-ci-${{ matrix.CI_CONFIG }}
      DOCKER_TAG         : cloudviewer-ci:${{ matrix.CI_CONFIG }}
    steps:
      - name: Setup DEVELOPER_BUILD
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "DEVELOPER_BUILD=OFF" >> $GITHUB_ENV
          else
            echo "DEVELOPER_BUILD=${{ github.event.inputs.developer_build || 'ON' }}" >> $GITHUB_ENV
          fi
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: '/var/lib/docker'
          build-mount-path-ownership: 'root:root'
      - name: Clean runner logs and cache before checkout
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo ""
          echo "=== Cleaning GitHub Actions runner logs and cache ==="
          # Clean runner diagnostic logs that cause "No space left on device" errors
          sudo find /home/runner/actions-runner -name "*.log" -type f -delete 2>/dev/null || true
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* 2>/dev/null || true
          sudo rm -rf /home/runner/.cache/* 2>/dev/null || true
          sudo rm -rf /home/runner/.npm 2>/dev/null || true
          sudo rm -rf /home/runner/.yarn 2>/dev/null || true
          
          # Clean system logs and temporary files
          echo "=== Cleaning system logs and temporary files ==="
          sudo journalctl --vacuum-time=1d --vacuum-size=100M 2>/dev/null || true
          sudo rm -rf /tmp/* 2>/dev/null || true
          sudo rm -rf /var/tmp/* 2>/dev/null || true
          sudo find /var/log -type f -name "*.log" -mtime +1 -delete 2>/dev/null || true
          sudo find /var/log -type f -name "*.gz" -delete 2>/dev/null || true
          
          # Clean package manager cache
          echo "=== Cleaning package manager cache ==="
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          
          echo ""
          echo "=== Disk space after cleanup ==="
          df -h
          echo ""
          echo "=== Largest directories on root filesystem ==="
          sudo du -h --max-depth=1 / 2>/dev/null | sort -hr | head -20 || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'false'
      - name: Additional space optimization
        run: |
          source util/ci_utils.sh
          maximize_ubuntu_github_actions_build_space
      - name: Docker build
        run: |
          set -o pipefail
          # GITHUB_WORKSPACE: /home/runner/work/ACloudViewer/ACloudViewer
          echo "DEVELOPER_BUILD is $DEVELOPER_BUILD"
          if [ "${BUILD_PACKAGE}" == "true" ] && [ "$DEVELOPER_BUILD" == "OFF" ]; then
            export RELEASE_TAG="-release"
          fi
          # Tee the full build log to a file so it can be uploaded as an
          # artifact below (GitHub truncates very long step logs in the UI).
          docker/docker_build.sh ${CI_CONFIG}${RELEASE_TAG:-} 2>&1 | tee /tmp/ubuntu-build.log

          ls -alh

          # --- OOM / health diagnostics (root-cause aid) ---
          echo "=== Runner memory ==="
          free -m
          echo "=== OOM killer events (if any) ==="
          sudo dmesg 2>/dev/null | grep -iE 'oom|killed process|out of memory' | tail -30 || true
          echo "=== Docker status ==="
          sudo systemctl status docker --no-pager -l | head -20 || true

          # Clean up Docker build cache to free space
          echo "=== Cleaning Docker build cache ==="
          docker builder prune -af --filter "until=1h" || true
          docker system df
      - name: Upload Docker build log
        # Persist the full build log (GitHub truncates very long step logs in
        # the UI). if: always() + continue-on-error: upload even when the build
        # failed, so it can be inspected.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-build-log-${{ matrix.CI_CONFIG }}
          path: /tmp/ubuntu-build.log
          if-no-files-found: ignore
      - name: Upload package to GitHub artifacts
        if: ${{ env.BUILD_PACKAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ACloudViewer-devel-linux-x86_64-${{ matrix.CI_CONFIG }}
          path: ACloudViewer-*.run
          if-no-files-found: error
      - name: Update devel release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload main-devel ACloudViewer-*.run --clobber
          gh release view main-devel

      - name: Docker test
        run: |
          # Map CI_CONFIG to docker_test.sh options
          # The test script will dynamically check if ML ops are available
          TEST_CONFIG="${CI_CONFIG}"
          if [ "$DEVELOPER_BUILD" == "OFF" ]; then
            TEST_CONFIG="${CI_CONFIG}-release"
          fi
          docker/docker_test.sh ${TEST_CONFIG}

      - name: Public CPU App Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          generate_release_notes: false
          prerelease: false
          files: |
            ACloudViewer-*.run

  agent-integration:
    name: Agent Integration (${{ matrix.CI_CONFIG }})
    runs-on: ubuntu-latest
    needs: [build-and-run-docker]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - CI_CONFIG: cpu-focal
            RUNNER: ubuntu-20.04
          - CI_CONFIG: cpu-jammy
            RUNNER: ubuntu-22.04
          - CI_CONFIG: cpu-noble
            RUNNER: ubuntu-24.04

    steps:
      - name: Checkout ACloudViewer
        uses: actions/checkout@v4

      - name: Checkout CLI-Anything (agent harness)
        uses: actions/checkout@v4
        with:
          repository: Asher-1/CLI-Anything
          path: _cli-anything
          sparse-checkout: |
            acloudviewer/agent-harness

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libfontconfig1 libfreetype6 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-xinput0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1

      - name: Download ACloudViewer installer
        uses: actions/download-artifact@v4
        with:
          name: ACloudViewer-devel-linux-x86_64-${{ matrix.CI_CONFIG }}
          path: /tmp/acv-installer/

      - name: Install ACloudViewer (headless .run installer)
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          INSTALLER=$(find /tmp/acv-installer/ -name "*.run" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::No .run installer found"
            exit 1
          fi
          chmod +x "$INSTALLER"
          mkdir -p "$HOME/Desktop"
          "$INSTALLER" --root "$HOME/ACloudViewer" \
            --accept-licenses --accept-messages --confirm-command install
          echo "$HOME/ACloudViewer" >> "$GITHUB_PATH"
          echo "ACV_BINARY=$HOME/ACloudViewer/ACloudViewer.sh" >> "$GITHUB_ENV"

      - name: Install agent harness
        run: |
          pip install -e "_cli-anything/acloudviewer/agent-harness[dev]"

      - name: Level 3 — Headless processing tests
        run: |
          python -m pytest agent-integration/tests/test_integration.py -v -k "level3"

  # ---------------------------------------------------------------------------
  # AICore tiered tests — fast lane for hot-path changes
  #
  # The AICore CTest suite is already tiered (core/AICore/tests/CMakeLists.txt):
  #   fast  — no GGUF assets            aicore-fast-tests     (ctest -LE "model|gpu|e2e")
  #   capi  — public C API contract     aicore-contract-tests (ctest -L capi -LE "model|gpu|e2e")
  #   model — needs GGUF assets         AICORE_TEST_ENABLE_MODEL_TESTS=ON + asset root
  #
  # The docker build/test chain never runs ctest, so this job is the only
  # Ubuntu lane exercising the tiers. It activates when a hot-path file
  # changed (PR/push), or unconditionally on release / workflow_dispatch, so
  # unrelated PRs stay cheap and the full docker build is untouched.
  #
  # model tier reachability: hosted runners have neither a durable model cache
  # nor a GPU, so model tests are OFF by default (ENV{CI}). When enabled
  # without assets they skip (SKIP_RETURN_CODE 77) — reported as skipped, not
  # failed — so enabling them can never introduce an unreachable check.
  aicore-tests:
    name: AICore tiered tests
    runs-on: ubuntu-latest
    needs: [skip-check]
    if: needs.skip-check.outputs.skip == 'no' && !contains(github.event.head_commit.message, '[skip ci]')
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paths-filter needs history to diff against the PR base
      - name: Detect hot-path changes
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            aicore:
              - 'core/AICore/**'
              - 'libs/CVPluginAPI/**'
              - 'plugins/core/Standard/qDA3/**'
              - 'plugins/core/Standard/qFreeSplatter/**'
              - 'plugins/core/Standard/qDeepLSD/**'
              - 'plugins/core/Standard/qFaceDetect/**'
              - 'plugins/core/Standard/qLightGlue/**'
              - 'plugins/core/Standard/qRFDetr/**'
              - 'plugins/core/Standard/qRMBG/**'
              - 'plugins/core/Standard/qYOLO/**'
              - '3rdparty/ggml/**'
              - 'cmake/AICoreOptions.cmake'
              - '.github/workflows/ubuntu.yml'
      - name: Gate (non-PR/push events always run)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=${{ steps.filter.outputs.aicore }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Qt5 (configure requires Qt for libs/CVAppCommon)
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev libgl1-mesa-dev
      - name: Configure (AICore + tiered tests, CPU-only)
        if: steps.gate.outputs.run == 'true'
        run: |
          MODEL_ARGS=""
          if [ "${{ github.event.inputs.aicore_model_tests }}" = "true" ]; then
            MODEL_ARGS="-DAICORE_TEST_ENABLE_MODEL_TESTS=ON"
            if [ -n "${{ github.event.inputs.aicore_assets_root }}" ]; then
              MODEL_ARGS="$MODEL_ARGS -DAICORE_TEST_ASSET_ROOT=${{ github.event.inputs.aicore_assets_root }}"
            else
              # Empty asset root: model tests register but their asset env is
              # never set, so each skips (SKIP_RETURN_CODE 77) instead of
              # failing on missing files. Hosted runners have no assets, so
              # this keeps the model tier reachable but never red.
              MODEL_ARGS="$MODEL_ARGS -DAICORE_TEST_ASSET_ROOT="
            fi
          fi
          cmake -S . -B build-aicore \
            -DDEVELOPER_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DUSE_VTK_BACKEND=OFF \
            -DBUILD_PYTHON_MODULE=OFF \
            -DBUILD_OPENCV=OFF \
            -DBUILD_RECONSTRUCTION=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_UNIT_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_WITH_CONDA=OFF \
            -DAICore_ENABLED=ON \
            -DAICore_BUILD_TESTS=ON \
            -DAICore_BUILD_WHITEBOX_TESTS=ON \
            -DAICore_USE_VULKAN=OFF \
            -DAICore_USE_CUDA=OFF \
            $MODEL_ARGS
      - name: Build + run fast tier (no GGUF assets)
        if: steps.gate.outputs.run == 'true'
        run: |
          cmake --build build-aicore --target aicore-fast-tests -j2
      - name: Build + run capi contract tier
        if: steps.gate.outputs.run == 'true'
        run: |
          cmake --build build-aicore --target aicore-contract-tests -j2
      # Shared AICore UI helper (ecvAICoreUiHelper.h) regression test:
      # compact spacing/margins, form-grid stretch pattern and DPI scaling
      # invariants used by every AICore plugin dialog.  Runs headless.
      - name: Build + run shared UI helper tests
        if: steps.gate.outputs.run == 'true'
        run: |
          cmake --build build-aicore --target test_cvpluginapi_ui_helpers -j2
          ctest --test-dir build-aicore -R test_cvpluginapi_ui_helpers --output-on-failure
      - name: Build + run model tier (workflow_dispatch; skips without assets)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.aicore_model_tests == 'true'
        run: |
          cmake --build build-aicore --target aicore-model-tests -j2