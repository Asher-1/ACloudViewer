name: npm publish

# Publish @asher-1/acloudviewer (npm/ installer bootstrap) to both registries:
#   1. npmjs.org        — primary channel, zero-auth install for end users
#   2. GitHub Packages  — mirror, appears under
#                         https://github.com/Asher-1/ACloudViewer/packages
#
# Version invariant (see the "Resolve version" step): npm latest always
# equals the app version carried by the main-devel release assets.
#   - workflow_run (a platform build finished — same 5 uploaders that feed
#     main-devel, like update-release.yml) and push (main) touching npm/**
#     both run the same RECONCILE: publish the app version when the
#     registry is behind, re-point `latest` when it drifted ahead, skip
#     when aligned. The bootstrap is version-agnostic (it fetches current
#     release assets at runtime), so bootstrap source changes never create
#     npm versions on their own — the next app release ships them.
#   - tag npm-v* / workflow_dispatch are emergency paths for explicit
#     versions; reconcile automatically re-points `latest` back to the app
#     version on the next run.

permissions:
  contents: read
  packages: write  # GitHub Packages mirror publish
  id-token: write  # npm trusted publishing (OIDC): when a trusted publisher
                   # is configured on npmjs for this workflow, npm >= 11.5.1
                   # authenticates the npmjs publish via short-lived OIDC and
                   # only falls back to NPM_TOKEN if that is unavailable.

on:
  push:
    branches: [main]
    tags: ['npm-v*']
    # paths only constrain branch pushes; tag pushes match the tags filter.
    paths: ['npm/**', '.github/workflows/npm-publish.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (x.y.z, overrides package.json)'
        required: true
  workflow_run:
    # Same uploader list as update-release.yml: whoever finishes last yields
    # the final pass; the version alignment below is idempotent, so earlier
    # triggers are no-ops.
    workflows: [Windows, MacOS, Ubuntu, Ubuntu CUDA, Ubuntu Wheel]
    types: [completed]

# Serialize publishes: near-simultaneous completions would otherwise race on
# the same version in both registries (429/409 from the second publisher).
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job-level so step `if`s and the Summary can read them. SKIP/MODE get
    # overwritten by the resolve step via GITHUB_ENV; declaring them here
    # keeps `env.SKIP` accesses statically valid for runs that fail early.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SKIP: 'false'
      MODE: 'init'
      ACTION: 'none'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, the minimum for OIDC trusted
          # publishing (Node 22's bundled npm is too old for scoped OIDC).
          node-version: 24

      # ── Version resolution: one step decides IF and WHAT to publish ──────
      - name: Resolve version and publish mode
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./npm/package.json').version")
          registry_latest() {
            # Distinguish "package not published yet" (404 -> 0.0.0) from
            # network/auth failures: mapping those to 0.0.0 would produce a
            # doomed publish that can only end in 409/EPUBLISHCONFLICT. Fail
            # loudly instead so the run reports the real cause.
            if out=$(npm view @asher-1/acloudviewer version 2>/tmp/npm-view.err); then
              printf '%s' "$out"
            elif grep -qE 'E404|404 Not Found' /tmp/npm-view.err; then
              printf '0.0.0'
            else
              echo "::error::npm registry query failed (not a 404; check network or NPM_TOKEN):" >&2
              cat /tmp/npm-view.err >&2
              exit 1
            fi
          }

          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            # ── Emergency mode: explicit tag. The tag must equal the app
            # version from main-devel — the same invariant reconcile enforces;
            # the tag merely forces a publish even when the registry looks
            # aligned (metadata cache delay, forced re-ship, ...).
            tag="${GITHUB_REF#refs/tags/npm-v}"
            app_ver=$(curl -sSf -H "Authorization: token $GH_TOKEN" \
              https://api.github.com/repos/Asher-1/ACloudViewer/releases/tags/main-devel \
              | grep -oE '"name": *"ACloudViewer-[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -z "${app_ver:-}" ] || [ "$tag" != "$app_ver" ]; then
              echo "::error::tag npm-v$tag does not match the main-devel app version ${app_ver:-<none>}"
              exit 1
            fi
            (cd npm && npm version "$tag" --no-git-tag-version >/dev/null)
            echo "MODE=tag" >> "$GITHUB_ENV"
            echo "ACTION=publish" >> "$GITHUB_ENV"
            echo "SKIP=false" >> "$GITHUB_ENV"
            echo "VERSION=$tag" >> "$GITHUB_ENV"

          elif [ -n "${DISPATCH_VERSION:-}" ]; then
            # ── Emergency mode: manual dispatch — force the given version ──
            (cd npm && npm version "$DISPATCH_VERSION" --no-git-tag-version >/dev/null)
            echo "MODE=dispatch" >> "$GITHUB_ENV"
            echo "ACTION=publish" >> "$GITHUB_ENV"
            echo "SKIP=false" >> "$GITHUB_ENV"
            echo "VERSION=$DISPATCH_VERSION" >> "$GITHUB_ENV"

          elif [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "push" ]; then
            # ── Mode: reconcile — one invariant drives both triggers:
            # npm latest must equal the app version carried by the
            # main-devel assets. The npm bootstrap is version-agnostic
            # (it fetches current release assets at runtime), so its own
            # source changes NEVER create new npm versions; the next
            # reconcile ships them with the next app version.
            app_ver=$(curl -sSf -H "Authorization: token $GH_TOKEN" \
              https://api.github.com/repos/Asher-1/ACloudViewer/releases/tags/main-devel \
              | grep -oE '"name": *"ACloudViewer-[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            echo "MODE=reconcile" >> "$GITHUB_ENV"
            if [ -z "${app_ver:-}" ]; then
              echo "::warning::main-devel has no installer assets; nothing to reconcile with. Skipping."
              echo "SKIP=true" >> "$GITHUB_ENV"
              echo "ACTION=none" >> "$GITHUB_ENV"
              exit 0
            fi
            reg=$(registry_latest)
            if [ "$app_ver" = "$reg" ]; then
              echo "npm@$reg matches app version $app_ver; nothing to do."
              echo "SKIP=true" >> "$GITHUB_ENV"
              echo "ACTION=none" >> "$GITHUB_ENV"
              echo "VERSION=$app_ver" >> "$GITHUB_ENV"
            elif [ "$(printf '%s\n%s\n' "$reg" "$app_ver" | sort -V | head -n1)" != "$reg" ]; then
              # app_ver > reg: registry is behind the app release — publish
              # the aligned version (this also carries the latest bootstrap
              # source to users).
              echo "npm@$reg is behind app release $app_ver; publishing aligned version."
              (cd npm && npm version "$app_ver" --no-git-tag-version >/dev/null)
              echo "SKIP=false" >> "$GITHUB_ENV"
              echo "ACTION=publish" >> "$GITHUB_ENV"
              echo "VERSION=$app_ver" >> "$GITHUB_ENV"
            else
              # app_ver < reg: registry latest drifted ahead of the app
              # release (historical patch-bump runs, or a manual tag). The
              # latest dist-tag must point at the app version again; the
              # extra versions stay in the registry (npm versions are
              # immutable) but stop being the default install target.
              echo "npm@$reg is ahead of app release $app_ver; retagging latest -> $app_ver."
              echo "SKIP=false" >> "$GITHUB_ENV"
              echo "ACTION=tagback" >> "$GITHUB_ENV"
              echo "VERSION=$app_ver" >> "$GITHUB_ENV"
            fi
          fi

      # ── Fail fast on packaging mistakes before touching any registry ────
      - name: Package sanity check
        if: env.SKIP != 'true' && env.ACTION != 'tagback'
        working-directory: npm
        run: npm pack --dry-run

      # ── Primary channel ──────────────────────────────────────────────────
      # Requires NPM_TOKEN (npmjs granular token with publish rights for the
      # @asher-1 scope). Skipped when the secret is absent so the GitHub
      # Packages mirror can still ship on its own. Trusted Publishing (OIDC)
      # is a drop-in alternative once the trusted publisher is bound on
      # npmjs.com (see docs.npmjs.com/trusted-publishers).
      # ACTION=tagback instead re-points the `latest` dist-tag at the app
      # version when the registry drifted ahead (no tarball is published).
      - name: Publish to npmjs.org (primary)
        id: npmjs
        if: env.SKIP != 'true' && env.NPM_TOKEN != ''
        working-directory: npm
        run: |
          set -o pipefail
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          if [ "$ACTION" = "tagback" ]; then
            if ! npm dist-tag add "@asher-1/acloudviewer@$VERSION" latest 2>&1 | tee /tmp/npmjs-tagback.log; then
              echo "::error::dist-tag retag to $VERSION failed (registry auth or network)."
              exit 1
            fi
            exit 0
          fi
          if ! npm publish --access public 2>&1 | tee /tmp/npmjs-publish.log; then
            # A concurrent reconcile run (workflow_run events converge; reruns
            # race within npmjs' metadata-cache window) may publish the same
            # version between our resolve and our PUT — that is success by
            # definition for reconcile. Verified 2026-11-15 (E409 "previously
            # staged"). Explicit tag/dispatch modes must fail: a 409 there
            # means the version contract was violated and a human must look.
            if [ "$MODE" = "reconcile" ] && grep -qE "E409|previously published|previously staged" /tmp/npmjs-publish.log; then
              echo "::warning::npm@$VERSION already published by a concurrent run; reconcile is idempotent, treating as success."
            else
              exit 1
            fi
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Mirror channel (best-effort) ─────────────────────────────────────
      # npmjs and the mirror can drift (e.g. mirror published first while
      # NPM_TOKEN was missing); a version already present on the mirror is a
      # benign skip, anything else fails the run.
      - name: Publish to GitHub Packages (mirror)
        id: mirror
        if: env.SKIP != 'true'
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "//npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc
          if [ "$ACTION" = "tagback" ]; then
            if ! npm dist-tag add --registry https://npm.pkg.github.com "@asher-1/acloudviewer@$VERSION" latest 2>&1 | tee /tmp/ghp-tagback.log; then
              echo "::error::mirror dist-tag retag to $VERSION failed."
              exit 1
            fi
            echo "MIRROR_RESULT=retagged latest -> $VERSION" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! npm publish --registry https://npm.pkg.github.com --access public 2>&1 | tee /tmp/ghp-publish.log; then
            if grep -qE "EPUBLISHCONFLICT|cannot publish over|previously published|409" /tmp/ghp-publish.log; then
              echo "::warning::GitHub Packages already has version ${VERSION:-unknown}; mirror skipped."
              echo "MIRROR_RESULT=skipped (already present)" >> "$GITHUB_ENV"
            else
              exit 1
            fi
          fi

      # ── Summary ──────────────────────────────────────────────────────────
      # Runs even for failed jobs. Every status is derived from the actual
      # step outcomes and MIRROR_RESULT (written inside the mirror step),
      # never inferred — the old version claimed "published" for a mirror
      # step that 409-skipped.
      - name: Summary
        if: always()
        run: |
          version=$(node -p "require('./npm/package.json').version")
          skip="${SKIP:-false}"
          mode="${MODE:-unknown}"
          action="${ACTION:-unknown}"
          npmjs_outcome="${{ steps.npmjs.outcome }}"
          mirror_outcome="${{ steps.mirror.outcome }}"
          case "$npmjs_outcome" in
            success)
              if [ "$action" = "tagback" ]; then npmjs_status="retagged latest -> $version"
              else npmjs_status="published"; fi ;;
            skipped)
              if [ "$skip" = "true" ]; then npmjs_status="skipped (already aligned)"
              else npmjs_status="skipped (NPM_TOKEN secret missing)"; fi ;;
            *) npmjs_status="FAILED ($npmjs_outcome)" ;;
          esac
          case "$mirror_outcome" in
            success)
              if [ "${MIRROR_RESULT:-published}" = "skipped (already present)" ]; then
                mirror_status="skipped (already present)"
              else
                mirror_status="published"
              fi ;;
            skipped) mirror_status="skipped (already aligned)" ;;
            *) mirror_status="FAILED ($mirror_outcome)" ;;
          esac
          {
            echo "## npm publish — @asher-1/acloudviewer@$version"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Mode | \`$mode\` |"
            echo "| Action | \`$action\` |"
            echo "| Skipped | \`$skip\` |"
            echo "| npmjs.org | $npmjs_status |"
            echo "| GitHub Packages | $mirror_status |"
            echo ""
            echo "_Invariant: npm latest == app version from main-devel assets. Summary runs even for failed jobs; FAILED rows point at the failing step._"
          } >> "$GITHUB_STEP_SUMMARY"
