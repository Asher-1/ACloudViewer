name: CI macOS production loader control
'on':
  push:
    branches:
    - ci/qt-portability-probe-20261110
permissions:
  contents: read
  actions: write
env:
  NPROC: 4
  DEVELOPER_BUILD: ${{ github.event.inputs.developer_build || 'ON' }}
  BUILD_CUDA_MODULE: false
jobs:
  macos:
    permissions:
      contents: write
      actions: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        python_version:
        - '3.12'
    env:
      BUILD_SHARED_LIBS: false
      BUILD_TENSORFLOW_OPS: false
      BUILD_PYTORCH_OPS: false
      LOW_MEM_USAGE: true
      CONDA_DEP_FILE_CLOUDVIEWER: .ci/conda_macos_cloudViewer.yml
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
    - name: Setup DEVELOPER_BUILD
      run: "if [[ \"${GITHUB_EVENT_NAME}\" == \"release\" ]]; then\n  echo \"DEVELOPER_BUILD=OFF\" >> $GITHUB_ENV\nelse\n  echo \"DEVELOPER_BUILD=${{ github.event.inputs.developer_build || 'ON' }}\" >> $GITHUB_ENV\nfi\n"
    - name: Set up Install path environment
      run: 'echo "INSTALL_DIR=${HOME}/cloudViewer_install" >> $GITHUB_ENV

        '
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Restore completed production compiler cache
      uses: actions/download-artifact@v4
      with:
        name: ccache-macos-ARM64-app-ci_qt-portability-probe-20261110
        path: ${{ env.CCACHE_DIR }}
        run-id: 42758429277
        github-token: ${{ github.token }}
    - name: Set up Python version
      run: 'sed -i "" "s/3.10/${{ matrix.python_version }}/g" ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}

        '
    - name: Set up Python environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: cloudViewer
        auto-activate-base: false
        environment-file: ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}
    - name: Set up fixed CMake
      uses: ./.github/actions/setup-cmake
    - name: Install dependencies
      run: "brew install ccache pkg-config\n\nif [[ ${{ runner.arch }} == \"ARM64\" ]]; then\n  brew install gcc\n  FC=\"$(brew --prefix)/bin/gfortran\"\n  test -x \"$FC\"\n  \"$FC\" --version\n  echo \"FC=$FC\" >> \"$GITHUB_ENV\"\n  echo \"$(dirname \"$FC\")\" >> \"$GITHUB_PATH\"\nfi\n\n# Native ARM64 Qt IFW with STATIC Qt (built via scripts/platforms/mac/build_static_qt_ifw.sh).\n# The old dynamic-Qt ARM64 IFW produced installers whose maintenancetool\n# crashed on auto-uninstall (dyld: Library not loaded @rpath/libQt5Widgets.5.dylib).\n# Static link matches the official x86_64 IFW: zero @rpath deps, self-contained.\ncurl -L \"https://github.com/Asher-1/cloudViewer_downloads/releases/download/qt-ifw/QtIFW-4.6.1-darwin-ARM64-static.zip\" -o ~/QtIFW-4.6.1-darwin-ARM64-static.zip\nunzip -q ~/QtIFW-4.6.1-darwin-ARM64-static.zip -d ~/\nrm ~/QtIFW-4.6.1-darwin-ARM64-static.zip\nls -hal ~/QtIFW-4.6.1-darwin-ARM64-static/bin\n\n# Disk cache only, not resident RAM; leave room for the complete working set.\nccache -M 10G\n# A stash restored on a different macos-15 image version must still\n# hit: key on compiler bytes instead of the image-local compiler\n# mtime, and ignore LANG/LC_* (they only localize diagnostics).\nccache --set-config=compiler_check=content\nccache --set-config=sloppiness=locale\n"
    - name: Build only the three production UI tests
      id: build
      shell: bash -l {0}
      run: "set -e -o pipefail\nexport PATH=\"${HOME}/QtIFW-4.6.1-darwin-ARM64-static/bin:$CONDA_PREFIX/lib:$PATH\"\nexport PKG_CONFIG_PATH=\"$CONDA_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH\"\npython3 - <<'PATCH'\nfrom pathlib import Path\np=Path('util/ci_utils.sh')\ns=p.read_text()\na='    make -j\"$NPROC\"\n    cmake --build . --target aicore-contract-tests -j \"$NPROC\"'\nb='    make -j\"$NPROC\" test_qopenpcdet_dialog test_qinstantmesh_dialog test_qinstantmesh_plugin\n    popd\n    return 0'\nassert s.count(a)==1\np.write_text(s.replace(a,b))\nPATCH\nsource util/ci_utils.sh\nccache -z\nbuild_gui_app with_conda package_installer 2>&1 | tee /tmp/macos-build.log\nccache -s\n"
    - name: Compare the identical production binaries under each loader mode
      if: always()
      shell: bash -l {0}
      run: "set +e\nmkdir -p /tmp/ui-crash-results\npaths=\"$PWD/build/bin:$CONDA_PREFIX/lib:$PWD/build/external/lib\"\nfor name in test_qopenpcdet_dialog test_qinstantmesh_dialog test_qinstantmesh_plugin; do\n exe=\"$PWD/build/bin/plugin_test/$name\"\n [ -f \"$exe\" ] || continue\n env -u DYLD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen \"$exe\" > \"/tmp/ui-crash-results/$name-clean.txt\" 2>&1\n echo \"$name clean=$?\" | tee -a /tmp/ui-crash-results/status.txt\n QT_QPA_PLATFORM=offscreen DYLD_LIBRARY_PATH=\"$paths\" \"$exe\" > \"/tmp/ui-crash-results/$name-override.txt\" 2>&1\n echo \"$name override=$?\" | tee -a /tmp/ui-crash-results/status.txt\n lldb -b -o \"settings set target.env-vars QT_QPA_PLATFORM=offscreen DYLD_LIBRARY_PATH=$paths\" -o run -k 'thread backtrace all' -k 'image list' -- \"$exe\" > \"/tmp/ui-crash-results/$name-backtrace.txt\" 2>&1\n echo \"$name lldb=$?\" | tee -a /tmp/ui-crash-results/status.txt\n find \"$HOME/Library/Logs/DiagnosticReports\" -maxdepth 1 -type f -name '*test_q*' -exec cp {} /tmp/ui-crash-results/ \\; 2>/dev/null\n cat \"/tmp/ui-crash-results/$name-backtrace.txt\"\ndone\nunset DYLD_LIBRARY_PATH\npython3 - <<'PATCH'\nfrom pathlib import Path\np=Path('cmake/CloudViewerOutputDirectories.cmake');s=p.read_text();assert 'set(_cv_loader_var DYLD_LIBRARY_PATH)' in s;p.write_text(s.replace('set(_cv_loader_var DYLD_LIBRARY_PATH)','set(_cv_loader_var DYLD_FALLBACK_LIBRARY_PATH)'))\nPATCH\nset -e\ncmake -S . -B build\nctest --test-dir build -R '^test_q(openpcdet_dialog|instantmesh_dialog|instantmesh_plugin)$' -V --output-on-failure | tee /tmp/ui-crash-results/fallback-ctest.txt\n"
    - name: Upload native crash evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: production-loader-controls
        path: '/tmp/ui-crash-results

          /tmp/macos-build.log'
        if-no-files-found: warn
    timeout-minutes: 180
