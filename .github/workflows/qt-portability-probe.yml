name: CI native failure diagnosis
'on':
  push:
    branches:
    - ci/qt-portability-probe-20261110
permissions:
  contents: read
  actions: write
env:
  NPROC: 4
  DEVELOPER_BUILD: ${{ github.event.inputs.developer_build || 'ON' }}
  BUILD_CUDA_MODULE: false
jobs:
  macos:
    permissions:
      contents: write
      actions: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        python_version:
        - '3.12'
    env:
      BUILD_SHARED_LIBS: false
      BUILD_TENSORFLOW_OPS: false
      BUILD_PYTORCH_OPS: false
      LOW_MEM_USAGE: true
      CONDA_DEP_FILE_CLOUDVIEWER: .ci/conda_macos_cloudViewer.yml
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
    - name: Setup DEVELOPER_BUILD
      run: "if [[ \"${GITHUB_EVENT_NAME}\" == \"release\" ]]; then\n  echo \"DEVELOPER_BUILD=OFF\" >> $GITHUB_ENV\nelse\n  echo \"DEVELOPER_BUILD=${{ github.event.inputs.developer_build || 'ON' }}\" >> $GITHUB_ENV\nfi\n"
    - name: Set up Install path environment
      run: 'echo "INSTALL_DIR=${HOME}/cloudViewer_install" >> $GITHUB_ENV

        '
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Restore compiler cache (stash)
      id: ccache-restore
      continue-on-error: true
      uses: apache/infrastructure-actions/stash/restore@e3e0a2261a9c6d5bdd882802b303f34b1511b6df
      with:
        key: ccache-macos-${{ runner.arch }}-app
        path: ${{ env.CCACHE_DIR }}
    - name: Seed compiler cache from legacy release asset
      if: steps.ccache-restore.outputs.stash-hit != 'true'
      continue-on-error: true
      run: "ASSET=\"ccache-macos-app.tar.gz\"\nmkdir -p \"$CCACHE_DIR\"\ncurl -fsSL --retry 3 -o /tmp/ccache-restore.tar.gz \\\n  \"https://github.com/Asher-1/cloudViewer_downloads/releases/download/ci-ccache/${ASSET}\" \\\n  && tar -xzf /tmp/ccache-restore.tar.gz -C \"$CCACHE_DIR\" \\\n  || echo \"[cache] no legacy pool; using a cold build\"\nrm -f /tmp/ccache-restore.tar.gz\n"
    - name: Set up Python version
      run: 'sed -i "" "s/3.10/${{ matrix.python_version }}/g" ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}

        '
    - name: Set up Python environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: cloudViewer
        auto-activate-base: false
        environment-file: ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}
    - name: Set up fixed CMake
      uses: ./.github/actions/setup-cmake
    - name: Install dependencies
      run: "brew install ccache pkg-config\n\nif [[ ${{ runner.arch }} == \"ARM64\" ]]; then\n  brew install gcc\n  FC=\"$(brew --prefix)/bin/gfortran\"\n  test -x \"$FC\"\n  \"$FC\" --version\n  echo \"FC=$FC\" >> \"$GITHUB_ENV\"\n  echo \"$(dirname \"$FC\")\" >> \"$GITHUB_PATH\"\nfi\n\n# Native ARM64 Qt IFW with STATIC Qt (built via scripts/platforms/mac/build_static_qt_ifw.sh).\n# The old dynamic-Qt ARM64 IFW produced installers whose maintenancetool\n# crashed on auto-uninstall (dyld: Library not loaded @rpath/libQt5Widgets.5.dylib).\n# Static link matches the official x86_64 IFW: zero @rpath deps, self-contained.\ncurl -L \"https://github.com/Asher-1/cloudViewer_downloads/releases/download/qt-ifw/QtIFW-4.6.1-darwin-ARM64-static.zip\" -o ~/QtIFW-4.6.1-darwin-ARM64-static.zip\nunzip -q ~/QtIFW-4.6.1-darwin-ARM64-static.zip -d ~/\nrm ~/QtIFW-4.6.1-darwin-ARM64-static.zip\nls -hal ~/QtIFW-4.6.1-darwin-ARM64-static/bin\n\n# Disk cache only, not resident RAM; leave room for the complete working set.\nccache -M 10G\n# A stash restored on a different macos-15 image version must still\n# hit: key on compiler bytes instead of the image-local compiler\n# mtime, and ignore LANG/LC_* (they only localize diagnostics).\nccache --set-config=compiler_check=content\nccache --set-config=sloppiness=locale\n"
    - name: Config and build APP
      id: build
      shell: bash -l {0}
      run: 'set -e -o pipefail

        export PATH="${HOME}/QtIFW-4.6.1-darwin-ARM64-static/bin:$PATH"

        export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"

        export PATH="$CONDA_PREFIX/lib:$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/lib/cmake:$PATH"

        echo "PATH=$PATH" >> $GITHUB_ENV

        echo "DEVELOPER_BUILD is ${{ env.DEVELOPER_BUILD }}"

        echo "INSTALL_DIR is ${{ env.INSTALL_DIR }}"


        ccache -z

        ccache -s

        trap ''ccache -s'' EXIT

        echo "Start to build GUI package On MacOS..."

        source util/ci_utils.sh

        print_ccache_key_inputs

        # Tee the full build log to a file so it can be uploaded as an

        # artifact below (GitHub truncates very long step logs in the UI).

        build_gui_app with_conda package_installer 2>&1 | tee /tmp/macos-build.log


        CLOUDVIEWER_VERSION_FULL="$(grep -F CLOUDVIEWER_VERSION_FULL build/CMakeCache.txt | cut -f2 -d''='')"

        DEVEL_PKG_NAME="$(basename ${{ env.INSTALL_DIR }}/ACloudViewer-${CLOUDVIEWER_VERSION_FULL}*.dmg)"

        echo "DEVEL_PKG_NAME=$DEVEL_PKG_NAME" >> $GITHUB_ENV

        '
    - name: Save compiler cache (stash)
      if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), steps.build.outcome) }}
      continue-on-error: true
      uses: apache/infrastructure-actions/stash/save@e3e0a2261a9c6d5bdd882802b303f34b1511b6df
      with:
        key: ccache-macos-${{ runner.arch }}-app
        path: ${{ env.CCACHE_DIR }}
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
        if-no-files-found: ignore
    - name: Upload build log
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-log-${{ runner.arch }}
        path: /tmp/macos-build.log
        if-no-files-found: ignore
    - name: Backtrace the failing production UI executables
      if: always()
      shell: bash -l {0}
      run: "mkdir -p /tmp/ui-crash-results\nfor name in test_qopenpcdet_dialog test_qinstantmesh_dialog test_qinstantmesh_plugin; do\n  exe=\"$(find \"$PWD/build/bin\" -type f -name \"$name\" | head -1)\"\n  if [ -z \"$exe\" ]; then continue; fi\n  otool -L \"$exe\" > \"/tmp/ui-crash-results/$name-libraries.txt\"\n  for mode in clean override; do\n    if [ \"$mode\" = override ]; then\n      export DYLD_LIBRARY_PATH=\"$PWD/build/bin:$CONDA_PREFIX/lib:$PWD/build/external/lib\"\n    else\n      unset DYLD_LIBRARY_PATH\n    fi\n    QT_QPA_PLATFORM=offscreen lldb -b -o run -o 'thread backtrace all' -o 'image list' -o quit -- \"$exe\" > \"/tmp/ui-crash-results/$name-$mode.txt\" 2>&1\n    cat \"/tmp/ui-crash-results/$name-$mode.txt\"\n  done\ndone\nfind \"$HOME/Library/Logs/DiagnosticReports\" -maxdepth 1 -type f -name '*test_q*' -exec cp {} /tmp/ui-crash-results/ \\; 2>/dev/null || true\n"
    - name: Upload native UI backtraces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: production-ui-crashes
        path: /tmp/ui-crash-results
        if-no-files-found: warn
    timeout-minutes: 180
  windows-cumesh:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - name: Install CUDA
      uses: Jimver/cuda-toolkit@v0.2.23
      with:
        cuda: 12.6.0
        sub-packages: '["nvcc", "cudart", "thrust"]'
        method: network
        use-github-cache: 'false'
        use-local-cache: 'false'
    - uses: ./.github/actions/setup-cmake
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Compile the plain CUDA CuMesh bridge
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        $smokeBuild = Join-Path $env:RUNNER_TEMP ''cumesh Windows build smoke''

        cmake -S core/AICore/tests/cumesh-cmake -B $smokeBuild -G ''Ninja Multi-Config'' -DCMAKE_CUDA_ARCHITECTURES=75

        if ($LASTEXITCODE -ne 0) { throw ''CuMesh configure failed'' }

        cmake --build $smokeBuild --config Release --target aicore_cumesh_smoke --parallel 2

        if ($LASTEXITCODE -ne 0) { throw ''CuMesh build failed'' }

        ctest --test-dir $smokeBuild -C Release --output-on-failure

        if ($LASTEXITCODE -ne 0) { throw ''CuMesh contract failed'' }

        '
