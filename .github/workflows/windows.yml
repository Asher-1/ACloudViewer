# - librealsense upgrade needed to build with MSVC 17
# - MSVC 17 and CUDA 12.4+ error while building CreateCUDAHashBackend.cu (Debug only)
# - PyTorch Ops in debug mode - DLL initialization error while loading cloudViewer_torch_ops.dll
# - CUDA - Draw.exe does not run due to CUDA DLL path issues

name: Windows
permissions: {}

# TODO: conda do not support python3.13 now

on:
  workflow_dispatch:
    inputs:
      developer_build:
        description: "Set to OFF for Release wheels"
        required: false
        default: "ON"
      cold_build:
        description: "Disable compile cache for end-to-end cold-build verification"
        required: false
        default: "false"

  # Weekly cold-build gate: the full workflow runs with the compile cache
  # disabled (COLD_BUILD=true), keeping the from-scratch end-to-end path
  # exercised so cache hits can never rot the no-cache build.
  schedule:
    - cron: '0 3 * * 1'

  push:
    branches:
      - main

  release:
    types: [released]

  pull_request:
    types: [opened, reopened, synchronize] # Rebuild on new pushes to PR

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_VER: "23.2.1"
  WHEEL_VER: "0.38.4"
  STOOLS_VER: "67.3.2"
  JEDI_VER: "0.17.2"  # https://github.com/ipython/ipython/issues/12740
  IDNA_VER: "2.8"  # https://github.com/psf/requests/issues/5710
  CUDA_VERSION: "12.6.0" # CUDA_VERSION: "11.8.0"
  SRC_DIR: "D:\\a\\ACloudViewer\\ACloudViewer"
  INSTALL_DIR: "C:\\dev\\cloudViewer_install"
  NPROC: 8
  DEVELOPER_BUILD: ${{ github.event.inputs.developer_build || 'ON' }}
  VULKAN_SDK_VERSION: 1.4.350.0

jobs:
  windows:
    permissions:
      contents: write  # upload
      actions: write   # release
    runs-on: windows-2022
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: true
      matrix:
        python_version: ['3.12']
        # Debug matrix entries are kept intentionally (devel-release smoke +
        # future Debug-config testing); they run the env-setup steps only —
        # the build steps are conditioned on Release (build_win_app.ps1 is
        # Release-only) and do not affect any job's 6h wall time.
        BUILD_SHARED_LIBS: [ON, OFF]
        STATIC_RUNTIME: [ON, OFF]
        BUILD_CUDA_MODULE: [ON, OFF]
        CONFIG: [Release, Debug]
        exclude:
          - BUILD_SHARED_LIBS: ON
          - STATIC_RUNTIME: ON
        include:
          - BUILD_SHARED_LIBS: OFF
          - STATIC_RUNTIME: OFF
    env:
      CONDA_DEP_FILE_CLOUDVIEWER: ".ci/conda_windows_cloudViewer.yml"
      # Ninja Multi-Config drives cl.exe directly (no MSBuild vcxproj
      # overhead) while keeping the VS-style bin/<Config>/ layout, the
      # per-config output-dir properties and the --config Release build
      # commands used by the scripts and the workflow test step. Requires the
      # MSVC environment from the msvc-dev-cmd step below.
      CLOUDVIEWER_GENERATOR: "Ninja Multi-Config"
      # Cold-build gate: releases, the weekly schedule and an explicit
      # workflow_dispatch run WITHOUT the compile cache so the shipped
      # artifacts stay reproducible from clean sources.
      COLD_BUILD: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || github.event.inputs.cold_build == 'true') && 'true' || 'false' }}

    steps:
      - name: Setup DEVELOPER_BUILD
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "release") {
            echo "DEVELOPER_BUILD=OFF" >> $env:GITHUB_ENV
          } else {
            echo "DEVELOPER_BUILD=$env:DEVELOPER_BUILD" >> $env:GITHUB_ENV
          }
      - name: Disk space used
        run: Get-PSDrive

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.23
        if: ${{ matrix.BUILD_CUDA_MODULE == 'ON' }}
        id: cuda-toolkit
        with:
          cuda: "${{ env.CUDA_VERSION }}"
          sub-packages: '["nvcc", "visual_studio_integration", "cublas", "cublas_dev", "cudart", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "npp", "npp_dev", "thrust", "nvtx", "curand", "curand_dev", "nvrtc_dev"]'
          method: 'network'
          use-github-cache: 'false'
          use-local-cache: 'false'
  
      - name: Setup ENV
        if: ${{ matrix.BUILD_CUDA_MODULE == 'ON' }}
        run: |
          $CUDA_VER_FULL = "${{ env.CUDA_VERSION }}"
          $CUDA_VER_ARR = $CUDA_VER_FULL.Split(".")
          $CUDA_VER = "$($CUDA_VER_ARR[0]).$($CUDA_VER_ARR[1])"
          $CUDA_VER_ID = "$($CUDA_VER_ARR[0])_$($CUDA_VER_ARR[1])"

          # Add CUDA environment variables.
          $CUDA_PATH = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          echo "CUDA_PATH=$CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CUDA_PATH_V$CUDA_VER_ID=$CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$CUDA_PATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          echo "DEVELOPER_BUILD is $env:DEVELOPER_BUILD"

      - name: Checkout source code
        uses: actions/checkout@v4

      # NOTE: do not trim CMAKE_CUDA_ARCHITECTURES here for CI speed. The CUDA
      # installer is a distribution artifact (main-devel / release): dropping
      # any -real arch breaks that GPU class outright (e.g. no sm_80 SASS and
      # compute_86 PTX cannot JIT backwards onto A100), and relying on PTX JIT
      # for newer GPUs changes first-run behavior. Compatibility of shipped
      # artifacts is non-negotiable; build time is addressed elsewhere.

      - name: Install Vulkan SDK
        shell: powershell
        run: |
          # LunarG silent install -> $GITHUB_WORKSPACE/VULKAN_SDK/{Include,Bin,Lib,...}
          # Do not use humbletim 7z extract on SDK >= 1.4.313 (Include/ missing).
          $sdkRoot = Join-Path $env:GITHUB_WORKSPACE 'VULKAN_SDK'
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          .\util\vulkan\install_vulkan_sdk_windows.ps1 -InstallRoot $sdkRoot -SkipProfile

      - name: Sync ACloudViewer Vulkan env
        shell: powershell
        run: .\util\vulkan\sync_vulkan_env_from_sdk.ps1

      - name: Set up python version
        run: |
          (Get-Content ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}) -replace "3.10", "${{ matrix.python_version }}" | Set-Content ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}

      # DGM: without caching, using conda on Windows takes a long time...
      - name: Set up Python environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          architecture: 'x64'
          activate-environment: cloudViewer
          auto-activate-base: false
          environment-file: ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}
      - name: Set up fixed CMake
        uses: ./.github/actions/setup-cmake
      - name: Set up MSVC environment
        # Ninja generators need cl.exe / INCLUDE / LIB from vcvarsall; this
        # exports them through GITHUB_ENV so the build step inherits them.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up sccache binary (warm runs only)
        # Compile cache is an optimization overlay: cache keys are content-
        # addressed (compiler hash + full command line + preprocessed input),
        # so any source/header/flag/third-party-version change misses and
        # recompiles for real. Infra failures degrade to a vanilla build via
        # continue-on-error + the outcome check below (cache never gates CI).
        # The action is used ONLY to install the binary. Its ghac backend is
        # intentionally NOT enabled (no SCCACHE_GHA_ENABLED): one cache entry
        # per compiled object flooded the 10 GB repo quota (12,640 entries /
        # 5.76 GB from run 39601603983 alone) and evicted other workflows'
        # caches, and when the object pool went cold every compile blocked on
        # per-object ghac lookups/uploads during the 2026-10-21 Actions
        # incident, stretching that run from ~2.5 h to 6.03 h. A local disk
        # pool saved as ONE bounded tarball (below) is immune to both; the
        # ubuntu/macOS pools live on cloudViewer_downloads release assets
        # instead, leaving this pool as the actions cache's only consumer.
        if: env.COLD_BUILD != 'true'
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Restore sccache cache from release assets
        # Persistent per-cell pool stored as a release asset on the public
        # cloudViewer_downloads repo (free, no total quota, 2 GB per-asset
        # limit; SCCACHE_CACHE_SIZE=1900M caps the pool so its tarball stays
        # ~1.0-1.2 GB with ~350 MB headroom to the 2 GB asset limit).
        # Unlike actions/cache this storage is shared between
        # PR and main runs (no refs/pull/N/merge scoping) and never expires
        # after 7 idle days. Downloads are plain HTTPS (fork PRs work);
        # uploads use the repo's ACCESS_TOKEN. Cache never gates CI.
        if: env.COLD_BUILD != 'true' && steps.sccache.outcome == 'success' && matrix.CONFIG == 'Release'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $asset = "sccache-win-app-cuda${{ matrix.BUILD_CUDA_MODULE }}.tar.gz"
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\sccache" | Out-Null
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\ccache-restore.tar.gz" `
            "https://github.com/Asher-1/cloudViewer_downloads/releases/download/ci-ccache/$asset"
          if ($LASTEXITCODE -eq 0) {
            tar -xzf "$env:RUNNER_TEMP\ccache-restore.tar.gz" -C "${{ runner.temp }}\sccache"
            Remove-Item "$env:RUNNER_TEMP\ccache-restore.tar.gz" -ErrorAction SilentlyContinue
            Write-Host "[cache] restored $asset"
          } else {
            Write-Host "[cache] no remote pool yet for $asset (first run)"
          }
      - name: Enable sccache launcher
        # Only wire the launcher when the binary actually came up;
        # util/ci_utils.ps1 forwards it as CMAKE_C/CXX_COMPILER_LAUNCHER
        # (ExternalProject_CMAKE_ARGS propagates it to VTK/OpenCV/COLMAP).
        # SCCACHE_DIR caps the pool at 1900M so the saved tarball stays under
        # the 2 GB release-asset limit. CUDA (nvcc) caching is intentionally
        # not enabled.
        # SCCACHE_IDLE_TIMEOUT must exceed the packaging time after the last
        # compile (installer + import checks ran 11-12 min past it, run 39994107226);
        # at the 600 s default the server self-exits, and every --show-stats
        # afterwards (in-step AND workflow-level) lazily spawns a fresh server
        # reporting 0 requests — which masked the real hit/miss numbers of
        # three consecutive ~5.7 h warm rounds.
        # The explicit --start-server removes the lazy-start race between the
        # first parallel cl.exe wrappers and proves right here that the
        # restored pool is visible to the daemon (cache location + size).
        if: env.COLD_BUILD != 'true' && steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_DIR=${{ runner.temp }}\sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SCCACHE_CACHE_SIZE=1900M" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CLOUDVIEWER_COMPILER_LAUNCHER=$env:SCCACHE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SCCACHE_IDLE_TIMEOUT=36000" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SCCACHE_DIR = "${{ runner.temp }}\sccache"
          $env:SCCACHE_CACHE_SIZE = "1900M"
          $env:SCCACHE_IDLE_TIMEOUT = "36000"
          & $env:SCCACHE_PATH --start-server
          & $env:SCCACHE_PATH --show-stats | Select-String -Pattern "Cache location|Cache size|Max cache size|Version"

      - name: Install dependencies
        # deploy QtIFW for installer and deploy 3rdparty_downloads.zip for fast building on windows
        run: |
          # Deploy QtIFW for installer packaging (pre-built, hosted on cloudViewer_downloads).
          Invoke-WebRequest -Uri "https://github.com/Asher-1/cloudViewer_downloads/releases/download/qt-ifw/QtIFW-4.6.1-win.zip" -OutFile "C:\QtIFW-4.6.1-win.zip"
          Expand-Archive "C:\QtIFW-4.6.1-win.zip" "C:\" -Force && Remove-Item "C:\QtIFW-4.6.1-win.zip"
          $env:PATH = "C:\QtIFW-4.6.1-win\bin;$env:PATH"
          echo $env:PATH
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Invoke-WebRequest -Uri "https://github.com/Asher-1/cloudViewer_downloads/releases/download/1.9.4/3rdparty_downloads.zip" -OutFile "3rdparty_downloads.zip"
          Expand-Archive "3rdparty_downloads.zip" "${{ env.SRC_DIR }}" -Force && Remove-Item "3rdparty_downloads.zip"

      - name: Fix Windows 11 appverifUI issues
        run: |
          echo "Running Windows 11 appverifUI fix script..."
          $ErrorActionPreference = 'Continue'
          & "${{ env.SRC_DIR }}\scripts\platforms\windows\fix_win11_appverifUI.bat"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "appverifUI fix script returned exit code: $LASTEXITCODE"
          }
          $ErrorActionPreference = 'Stop'

      - name: Build ACloudViewer App
        if: ${{ matrix.BUILD_SHARED_LIBS == 'OFF' && matrix.STATIC_RUNTIME == 'OFF' && matrix.CONFIG == 'Release' }}
        working-directory: ${{ env.SRC_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Set environment variables for build script
          # These will be used by build_win_app.ps1
          $env:STATIC_RUNTIME = "${{ matrix.STATIC_RUNTIME }}"
          $env:DEVELOPER_BUILD = "${{ env.DEVELOPER_BUILD }}"
          $env:BUILD_SHARED_LIBS = "${{ matrix.BUILD_SHARED_LIBS }}"
          $env:BUILD_CUDA_MODULE = "${{ matrix.BUILD_CUDA_MODULE }}"
          # IGNORE_TEST: Set to ON to skip tests in build script (tests run separately in workflow)
          $env:IGNORE_TEST = "ON"
          echo "IGNORE_TEST=$env:IGNORE_TEST"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:ONLY_BUILD_CUDA = "${{ matrix.BUILD_CUDA_MODULE }}"
          echo "ONLY_BUILD_CUDA=$env:ONLY_BUILD_CUDA"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          # Call build script with named parameters
          & "${{ env.SRC_DIR }}\scripts\build_win_app.ps1" `
            -PythonVersion "${{ matrix.python_version }}" `
            -ACloudViewerInstall "${{ env.INSTALL_DIR }}" 2>&1 | `
            Tee-Object -FilePath "${{ runner.temp }}\windows-build.log"
          # Propagate build exit code (exit N in .ps1 sets $LASTEXITCODE,
          # but the Tee-Object pipeline above resets the step exit code)
          if ($LASTEXITCODE -ne 0) {
              Write-Error "build_win_app.ps1 failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          # === Diagnostic: dump installer-related state ===
          Write-Host "=== Diagnostic: installer search ==="
          Write-Host "INSTALL_DIR contents (*.exe):"
          Get-ChildItem "${{ env.INSTALL_DIR }}" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          $deployDir = Join-Path "${{ env.INSTALL_DIR }}" "deploy"
          Write-Host "deploy directory exists: $(Test-Path $deployDir)"
          if (Test-Path $deployDir) {
            Write-Host "deploy tree (depth 3):"
            Get-ChildItem $deployDir -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object {
              $rel = $_.FullName.Substring($deployDir.Length)
              Write-Host "  $rel"
            }
          }
          $configXml = Join-Path "$deployDir" "config\config_win.xml"
          Write-Host "config_win.xml exists: $(Test-Path $configXml)"
          if (Test-Path $configXml) {
            Write-Host "config_win.xml Version/Title:"
            Select-String -Path $configXml -Pattern "Version|Title" | ForEach-Object { Write-Host "  $_" }
          }
          $pkgData = Join-Path "$deployDir" "packages\ACloudViewer\data"
          Write-Host "packages/ACloudViewer/data exists: $(Test-Path $pkgData)"
          if (Test-Path $pkgData) {
            Write-Host "  data children: $((Get-ChildItem $pkgData | Measure-Object).Count) items"
          }
          # === End diagnostic ===

          # Extract package installer name for subsequent steps
          $installers = Get-ChildItem (Join-Path "${{ env.INSTALL_DIR }}" "ACloudViewer-*.exe") -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Error "No ACloudViewer-*.exe installer found in ${{ env.INSTALL_DIR }}"
            Write-Host "Listing install directory contents:"
            Get-ChildItem "${{ env.INSTALL_DIR }}" -Recurse -Filter "*.exe" | Select-Object FullName
            exit 1
          }
          $PACKAGE_INSTALLER_NAME = $installers[0].Name
          Write-Host "Found installer: $PACKAGE_INSTALLER_NAME"
          echo "PACKAGE_INSTALLER_NAME=$PACKAGE_INSTALLER_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run C++ unit tests
        if: ${{ matrix.CONFIG == 'Release' && matrix.BUILD_CUDA_MODULE == 'OFF' }}
        working-directory: ${{ env.SRC_DIR }}\build
        run: |
          $ErrorActionPreference = 'Continue'
          
          # Check if build directory exists
          $buildDir = "${{ env.SRC_DIR }}\build"
          if (-not (Test-Path $buildDir)) {
            Write-Error "Build directory not found: $buildDir"
            exit 1
          }
          
          # Check if test executable exists
          $testExe = Join-Path $buildDir "bin\cloudviewer_test\${{ matrix.CONFIG }}\tests.exe"
          if (-not (Test-Path $testExe)) {
            Write-Error "Test executable not found: $testExe"
            Write-Host "Current directory: $(Get-Location)"
            Write-Host "Listing bin directory:"
            if (Test-Path (Join-Path $buildDir "bin")) {
              Get-ChildItem (Join-Path $buildDir "bin") -Recurse -Filter "*.exe" | Select-Object FullName
            }
            exit 1
          }
          
          Write-Host "Running C++ unit tests from: $(Get-Location)"
          Write-Host "Test executable: $testExe"
          Write-Host "BUILD_CUDA_MODULE: ${{ matrix.BUILD_CUDA_MODULE }}"
          Write-Host "Add --gtest_random_seed=SEED to the test command to repeat this test sequence."
          
          # tests.exe lives under bin\cloudviewer_test\ but the shared DLLs are
          # centralized in bin\<CONFIG>\; Windows has no RPATH, so prepend the
          # DLL directory before launching.
          $dllDir = Join-Path $buildDir "bin\${{ matrix.CONFIG }}"
          $env:PATH = "$dllDir;$env:PATH"
          
          # Run the tests
          & $testExe --gtest_shuffle --gtest_filter=-*ReduceSum64bit2DCase0*:*ReduceSum64bit2DCase3*
          $testResult = $LASTEXITCODE
          
          if ($testResult -ne 0) {
            Write-Error "C++ unit tests failed with exit code: $testResult"
            exit $testResult
          }
          
          Write-Host "C++ unit tests passed successfully."
      - name: Upload build log
        # Persist the full build log (GitHub truncates very long step logs in
        # the UI). if: always() + continue-on-error: upload even when the build
        # failed, so it can be inspected.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ matrix.CONFIG }}-cuda${{ matrix.BUILD_CUDA_MODULE }}
          path: ${{ runner.temp }}\windows-build.log
          if-no-files-found: ignore
      - name: Stop sccache server
        # Flush the daemon's pending cache writes before the job ends so the
        # save step below tars a complete pool. The --show-stats here
        # may print zeros on Windows: the daemon serving the compiles dies
        # with the build step's process tree (runner kills it at step exit)
        # or has already self-exited (SCCACHE_IDLE_TIMEOUT, default 600 s,
        # vs an 11-12 min packaging window — the in-step stats in runs
        # 39904120017/39944134589/39994107226 were all fresh 0-request
        # servers), so this step lazily spawns yet another empty one.
        # The authoritative numbers are the in-step stats printed by
        # scripts/build_win_app.ps1 / build_win_wheel.ps1 right after
        # packaging — real since SCCACHE_IDLE_TIMEOUT=36000. Never gates
        # the job; build-log compile rates remain the reliable signal.
        if: always() && env.COLD_BUILD != 'true' && steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          & $env:SCCACHE_PATH --show-stats
          & $env:SCCACHE_PATH --stop-server
      - name: Save sccache cache to release assets
        # Overwrite the cell's persistent asset in place (--clobber). Runs
        # regardless of the build outcome; SCCACHE_CACHE_SIZE=1900M caps the
        # pool ~350 MB below the 2 GB asset limit (a pool at the old 2G cap
        # produced 2143 MB tarballs, only ~5 MB under the limit). Fork PRs
        # have no ACCESS_TOKEN: the upload fails non-fatally and the pool
        # simply is not updated.
        if: always() && env.COLD_BUILD != 'true' && steps.sccache.outcome == 'success' && matrix.CONFIG == 'Release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path "${{ runner.temp }}\sccache") {
            $asset = "sccache-win-app-cuda${{ matrix.BUILD_CUDA_MODULE }}.tar.gz"
            tar -czf "$env:RUNNER_TEMP\$asset" -C "${{ runner.temp }}\sccache" .
            # A cancelled/aborted run may clobber the pool with a near-empty
            # tarball; a real pool is ~2 GB. Branch policy and cleanup
            # rationale: see ubuntu.yml's save step.
            $size = (Get-Item "$env:RUNNER_TEMP\$asset").Length
            if ($size -lt 52428800) {
              Write-Host "[cache] $asset is only $size bytes (cancelled/aborted run); skip upload to keep the previous pool"
            } else {
              gh release upload ci-ccache "$env:RUNNER_TEMP\$asset" -R Asher-1/cloudViewer_downloads --clobber
              if ($LASTEXITCODE -ne 0) {
                gh release upload ci-ccache "$env:RUNNER_TEMP\$asset" -R Asher-1/cloudViewer_downloads --clobber
              }
              if ($LASTEXITCODE -eq 0) { Write-Host "[cache] uploaded $asset" }
              else { Write-Host "[cache] upload failed (non-fatal; next run restores the previous pool)" }
            }
            Remove-Item "$env:RUNNER_TEMP\$asset" -ErrorAction SilentlyContinue
          }
      - name: Upload ACloudViewer to GitHub artifacts
        if: ${{ matrix.BUILD_SHARED_LIBS == 'OFF' && matrix.STATIC_RUNTIME == 'OFF' && matrix.CONFIG == 'Release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_INSTALLER_NAME }}
          path: ${{ env.INSTALL_DIR }}\${{ env.PACKAGE_INSTALLER_NAME }}
          if-no-files-found: error
      - name: Update devel release
        # PACKAGE_INSTALLER_NAME is only produced by the Release build step;
        # Debug matrix jobs must skip this or the gh upload runs with an empty
        # path (and fails the job, cascading via fail-fast).
        if: ${{ github.ref == 'refs/heads/main' && matrix.CONFIG == 'Release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload main-devel ${{ env.INSTALL_DIR }}\${{ env.PACKAGE_INSTALLER_NAME }} --clobber
          gh release view main-devel
      - name: Public App Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.CONFIG == 'Release'
        with:
          fail_on_unmatched_files: false
          generate_release_notes: false
          prerelease: false
          # body_path: ${{github.workspace}}/CHANGELOG.md
          files: |
            ${{ env.INSTALL_DIR }}\${{ env.PACKAGE_INSTALLER_NAME }}
      - name: Disk space used
        run: Get-PSDrive

  agent-integration:
    name: Agent Integration (Level 3) ${{ matrix.BUILD_CUDA_MODULE == 'ON' && 'CUDA' || 'CPU' }}
    runs-on: windows-2022
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    needs: [windows]

    strategy:
      fail-fast: true
      matrix:
        BUILD_CUDA_MODULE: [ON, OFF]
        python_version: ['3.12']

    env:
      CONDA_DEP_FILE_CLOUDVIEWER: ".ci/conda_windows_cloudViewer.yml"

    steps:
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.23
        if: ${{ matrix.BUILD_CUDA_MODULE == 'ON' }}
        id: cuda-toolkit
        with:
          cuda: "${{ env.CUDA_VERSION }}"
          sub-packages: '["nvcc", "visual_studio_integration", "cublas", "cublas_dev", "cudart", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "npp", "npp_dev", "thrust", "nvtx", "curand", "curand_dev", "nvrtc_dev"]'
          method: 'network'
          use-github-cache: 'false'
          use-local-cache: 'false'

      - name: Setup ENV
        if: ${{ matrix.BUILD_CUDA_MODULE == 'ON' }}
        run: |
          $CUDA_VER_FULL = "${{ env.CUDA_VERSION }}"
          $CUDA_VER_ARR = $CUDA_VER_FULL.Split(".")
          $CUDA_VER = "$($CUDA_VER_ARR[0]).$($CUDA_VER_ARR[1])"
          $CUDA_VER_ID = "$($CUDA_VER_ARR[0])_$($CUDA_VER_ARR[1])"

          # Add CUDA environment variables.
          $CUDA_PATH = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          echo "CUDA_PATH=$CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CUDA_PATH_V$CUDA_VER_ID=$CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$CUDA_PATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          echo "Testing with CUDA support: CUDA_PATH=$CUDA_PATH"

      - name: Checkout ACloudViewer
        uses: actions/checkout@v4

      - name: Set up python version
        run: |
          (Get-Content ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}) -replace "3.10", "${{ matrix.python_version }}" | Set-Content ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}

      - name: Set up Python environment (conda, same as build)
        uses: conda-incubator/setup-miniconda@v3
        with:
          architecture: 'x64'
          activate-environment: cloudViewer
          auto-activate-base: false
          environment-file: ${{ env.CONDA_DEP_FILE_CLOUDVIEWER }}

      - name: Checkout CLI-Anything (agent harness)
        uses: actions/checkout@v4
        with:
          repository: Asher-1/CLI-Anything
          path: _cli-anything
          sparse-checkout: |
            acloudviewer/agent-harness

      - name: Download ACloudViewer installer
        uses: actions/download-artifact@v4
        with:
          pattern: ACloudViewer-*-${{ matrix.BUILD_CUDA_MODULE == 'ON' && 'cuda' || 'cpu' }}-*.exe
          path: ${{ runner.temp }}/acv-installer/
          merge-multiple: true

      - name: Install agent harness
        run: |
          pip install -e "_cli-anything/acloudviewer/agent-harness[dev]"

      - name: Test ACloudViewer installer
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          $ErrorActionPreference = 'Continue'
          
          # Verify conda environment
          Write-Host "=== Environment Check ==="
          Write-Host "Python: $(python --version)"
          Write-Host "Python path: $(Get-Command python | Select-Object -ExpandProperty Source)"
          Write-Host "CONDA_PREFIX: $env:CONDA_PREFIX"
          if ($env:CUDA_PATH) {
            Write-Host "CUDA_PATH: $env:CUDA_PATH"
          }
          Write-Host ""
          
          $installer = Get-ChildItem "${{ runner.temp }}\acv-installer\" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No .exe installer found for ${{ matrix.BUILD_CUDA_MODULE == 'ON' && 'CUDA' || 'CPU' }} variant"
            exit 1
          }

          $installDir = Join-Path $env:USERPROFILE "ACloudViewer-Test"
          Write-Host "Testing $($installer.Name)"
          Write-Host "Install dir: $installDir"

          & $installer.FullName --root $installDir `
            --accept-licenses --accept-messages --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installation failed for $($installer.Name)"
            exit 1
          }

          # Set up comprehensive DLL search paths
          # Include conda environment paths (same as build environment)
          $dllPaths = @(
            $installDir,
            (Join-Path $installDir "lib"),
            (Join-Path $installDir "bin"),
            (Join-Path $installDir "plugins"),
            (Join-Path $installDir "platforms")
          ) | Where-Object { Test-Path $_ }
          
          # Add conda library paths if conda is active
          if ($env:CONDA_PREFIX) {
            $condaLibPath = Join-Path $env:CONDA_PREFIX "Library\bin"
            if (Test-Path $condaLibPath) {
              $dllPaths += $condaLibPath
              Write-Host "Added conda library path: $condaLibPath"
            }
          }
          
          # Add CUDA paths if CUDA is installed (for CUDA builds)
          if ($env:CUDA_PATH) {
            $cudaBinPath = Join-Path $env:CUDA_PATH "bin"
            if (Test-Path $cudaBinPath) {
              $dllPaths += $cudaBinPath
              Write-Host "Added CUDA binary path: $cudaBinPath"
            }
          }
          
          $env:PATH = ($dllPaths -join ";") + ";$env:PATH"
          Write-Host "=== Updated PATH ==="
          Write-Host $env:PATH

          # Locate binary
          $exeFile = Join-Path $installDir "ACloudViewer.exe"
          $batFile = Join-Path $installDir "ACloudViewer.bat"
          if (Test-Path $exeFile) {
            $env:ACV_BINARY = $exeFile
            Write-Host "Using binary: $exeFile"
          } elseif (Test-Path $batFile) {
            $env:ACV_BINARY = $batFile
            Write-Host "Using binary: $batFile"
          } else {
            Write-Error "Neither ACloudViewer.exe nor .bat found in $installDir"
            Get-ChildItem $installDir | Format-Table Name
            exit 1
          }

          # Debug: Test if binary can run at all
          Write-Host "=== Testing binary execution ==="
          & $env:ACV_BINARY --version 2>&1 | Write-Host
          $binaryTestResult = $LASTEXITCODE
          Write-Host "Binary test exit code: $binaryTestResult (0x$($binaryTestResult.ToString('X8')))"
          
          if ($binaryTestResult -eq 3221225781) {
            Write-Error "Binary failed with STATUS_DLL_NOT_FOUND (0xC0000135)"
            Write-Host "This indicates missing DLL dependencies."
            Write-Host "=== Checking for common DLLs in install directory ==="
            $commonDlls = @("Qt5Core.dll", "Qt6Core.dll", "msvcp*.dll", "vcruntime*.dll")
            foreach ($pattern in $commonDlls) {
              $found = Get-ChildItem $installDir -Recurse -Filter $pattern -ErrorAction SilentlyContinue
              if ($found) {
                Write-Host "Found: $($found.FullName)"
              } else {
                Write-Host "NOT FOUND: $pattern"
              }
            }
            exit 1
          }

          # Run integration tests; a missing binary must fail, not skip
          $env:ACV_REQUIRE_BINARY = "1"
          python -m pytest agent-integration/tests/test_integration.py -v -k "level3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Cleanup
          if (Test-Path (Join-Path $installDir "maintenancetool.exe")) {
            & (Join-Path $installDir "maintenancetool.exe") purge `
              --accept-licenses --accept-messages --confirm-command 2>&1 | Out-Null
          } else {
            Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          }

  build-wheel:
    name: Build wheel
    permissions:
      contents: write  # upload
      actions: write   # release
    runs-on: windows-2022
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: true
      # https://github.community/t/how-to-conditionally-include-exclude-items-in-matrix-eg-based-on-branch/16853/6
      matrix:
        BUILD_CUDA_MODULE: [ON, OFF]
        python_version: ['3.10', '3.11', '3.12']
        is_main:
          - ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        exclude:
          - BUILD_CUDA_MODULE: OFF
          - is_main: false
            python_version: '3.10'
          - is_main: false
            python_version: '3.11'

    env:
      BUILD_PYTORCH_OPS: ON
      BUILD_TENSORFLOW_OPS: OFF
      BUILD_JUPYTER_EXTENSION: ON
      BUILD_AZURE_KINECT: ON
      BUILD_LIBREALSENSE: ON
      CLOUDVIEWER_ML_ROOT: ${{ github.workspace }}/CloudViewer-ML
      # Ninja Multi-Config, same as the app matrix job: the CMAKE_C/CXX
      # COMPILER_LAUNCHER (sccache) is ONLY honored by Makefile/Ninja
      # generators — a Visual Studio generator routes compiles through
      # MSBuild, silently ignores the launcher, and the wheel job therefore
      # compiled the whole double pass with 0 sccache requests (job summary
      # all-zero stats in run 39088510659) and hit the 6h runner limit.
      CLOUDVIEWER_GENERATOR: "Ninja Multi-Config"
      # Cold-build gate, same expression as the app matrix job: releases, the
      # weekly schedule and an explicit workflow_dispatch run WITHOUT the
      # compile cache so the shipped artifacts stay reproducible.
      COLD_BUILD: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || github.event.inputs.cold_build == 'true') && 'true' || 'false' }}

    steps:
      - name: Setup DEVELOPER_BUILD
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "release") {
            echo "DEVELOPER_BUILD=OFF" >> $env:GITHUB_ENV
          } else {
            echo "DEVELOPER_BUILD=$env:DEVELOPER_BUILD" >> $env:GITHUB_ENV
          }

      - name: Set up MSVC environment
        # Ninja generators need cl.exe / INCLUDE / LIB from vcvarsall; the
        # app matrix job wires the same step for its Ninja Multi-Config
        # build. Without it the NMC wheel build cannot find a compiler.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.23
        if: ${{ matrix.BUILD_CUDA_MODULE == 'ON' }}
        id: cuda-toolkit
        with:
          cuda: "${{ env.CUDA_VERSION }}"
          sub-packages: '["nvcc", "visual_studio_integration", "cublas", "cublas_dev", "cudart", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "npp", "npp_dev", "thrust", "nvtx", "curand", "curand_dev", "nvrtc_dev"]'
          method: 'network'
          use-github-cache: 'false'
          use-local-cache: 'false'

      - name: Setup ENV
        if: ${{ matrix.BUILD_CUDA_MODULE == 'ON' }}
        run: |
          $CUDA_VER_FULL = "${{ env.CUDA_VERSION }}"
          $CUDA_VER_ARR = $CUDA_VER_FULL.Split(".")
          $CUDA_VER = "$($CUDA_VER_ARR[0]).$($CUDA_VER_ARR[1])"
          $CUDA_VER_ID = "$($CUDA_VER_ARR[0])_$($CUDA_VER_ARR[1])"

          # Add CUDA environment variables.
          $CUDA_PATH = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          echo "CUDA_PATH=$CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CUDA_PATH_V$CUDA_VER_ID=$CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$CUDA_PATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          echo "DEVELOPER_BUILD is $env:DEVELOPER_BUILD"

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: powershell
        working-directory: ${{ env.SRC_DIR }}
        run: |
          # LunarG silent install -> $GITHUB_WORKSPACE/VULKAN_SDK/{Include,Bin,Lib,...}
          # Do not use humbletim 7z extract on SDK >= 1.4.313 (Include/ missing).
          $sdkRoot = Join-Path $env:GITHUB_WORKSPACE 'VULKAN_SDK'
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          .\util\vulkan\install_vulkan_sdk_windows.ps1 -InstallRoot $sdkRoot -SkipProfile

      - name: Sync ACloudViewer Vulkan env
        shell: powershell
        working-directory: ${{ env.SRC_DIR }}
        run: .\util\vulkan\sync_vulkan_env_from_sdk.ps1

      - name: Checkout CloudViewer-ML source code
        uses: actions/checkout@v4
        with:
          repository: Asher-1/CloudViewer-ML
          ref: main
          path: ${{ env.CLOUDVIEWER_ML_ROOT }}

      # DGM: without caching, using conda on Windows takes a long time...
      - name: Set up Python environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python_version }}
          auto-activate-base: true
      - name: Set up fixed CMake
        uses: ./.github/actions/setup-cmake
      - name: Set up sccache binary (warm runs only)
        # Same contract as the app matrix job above: the action installs the
        # binary only; the ghac backend stays disabled (see the app job for
        # the thrashing incident that justified the local-pool tarball).
        # This job is the one that hits the 6h runner limit (the CPU pass
        # alone compiles ~3.5h of C++ without cache), so the launcher matters
        # most here.
        if: env.COLD_BUILD != 'true'
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Restore sccache cache from release assets
        # Persistent per-python pool on the ci-ccache release assets, same
        # pattern as the app matrix job. This job is the one that hits the
        # 6h runner limit (the CPU pass alone compiles ~3.5h of C++ without
        # cache), so the launcher matters most here.
        #
        # Cross-pool restore: the wheel build's two passes (CUDA + CPU)
        # compile nearly the same 3rdparty/core object set as the two app
        # jobs, so restoring BOTH app pools (when they exist from a previous
        # run) turns this job's cold pass into a mostly-hit pass. Without
        # this the wheel's first cold run (~353-400 min) exceeds the 360 min
        # hosted-runner job cap and its pool can never be saved — a
        # chicken-and-egg deadlock. The three pools merge into one local
        # directory (content-addressed files; overlapping names carry
        # identical content) and sccache trims the merged pool to
        # SCCACHE_CACHE_SIZE on first use.
        if: env.COLD_BUILD != 'true' && steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $assets = @(
            "sccache-win-wheel-cuda${{ matrix.BUILD_CUDA_MODULE }}-py${{ matrix.python_version }}.tar.gz",
            "sccache-win-app-cuda${{ matrix.BUILD_CUDA_MODULE }}.tar.gz",
            "sccache-win-app-cudaOFF.tar.gz"
          ) | Select-Object -Unique
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\sccache" | Out-Null
          foreach ($a in $assets) {
            curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\ccache-restore.tar.gz" `
              "https://github.com/Asher-1/cloudViewer_downloads/releases/download/ci-ccache/$a"
            if ($LASTEXITCODE -eq 0) {
              tar -xzf "$env:RUNNER_TEMP\ccache-restore.tar.gz" -C "${{ runner.temp }}\sccache"
              Write-Host "[cache] restored $a"
            } else {
              Write-Host "[cache] no remote pool yet for $a (first run)"
            }
            Remove-Item "$env:RUNNER_TEMP\ccache-restore.tar.gz" -ErrorAction SilentlyContinue
          }
      - name: Enable sccache launcher
        # util/ci_utils.ps1 Build-PipPackage forwards it as
        # CMAKE_C/CXX_COMPILER_LAUNCHER when this env var is set.
        # CUDA (nvcc) caching is intentionally not enabled initially.
        # SCCACHE_IDLE_TIMEOUT=36000 keeps the daemon alive past packaging so
        # the in-step stats are real numbers (see the app-matrix job for the
        # full 600 s default autopsy). The explicit --start-server also
        # verifies the merged three-pool restore is visible to the daemon.
        if: env.COLD_BUILD != 'true' && steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_DIR=${{ runner.temp }}\sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SCCACHE_CACHE_SIZE=1900M" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CLOUDVIEWER_COMPILER_LAUNCHER=$env:SCCACHE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SCCACHE_IDLE_TIMEOUT=36000" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SCCACHE_DIR = "${{ runner.temp }}\sccache"
          $env:SCCACHE_CACHE_SIZE = "1900M"
          $env:SCCACHE_IDLE_TIMEOUT = "36000"
          & $env:SCCACHE_PATH --start-server
          & $env:SCCACHE_PATH --show-stats | Select-String -Pattern "Cache location|Cache size|Max cache size|Version"

      - name: Install 3rdparty_downloads
        working-directory: ${{ env.SRC_DIR }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/Asher-1/cloudViewer_downloads/releases/download/1.9.4/3rdparty_downloads.zip" -OutFile "3rdparty_downloads.zip"
          Expand-Archive "3rdparty_downloads.zip" "${{ env.SRC_DIR }}" -Force && Remove-Item "3rdparty_downloads.zip"

      - name: Fix Windows 11 appverifUI issues (Wheel Build)
        run: |
          echo "Running Windows 11 appverifUI fix script for wheel build..."
          $ErrorActionPreference = 'Continue'
          & "${{ env.SRC_DIR }}\scripts\platforms\windows\fix_win11_appverifUI.bat"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "appverifUI fix script returned exit code: $LASTEXITCODE"
          }
          $ErrorActionPreference = 'Stop'

      - name: Config and Building
        working-directory: ${{ env.SRC_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          
          # no need to test due to to next step is test-wheel
          $env:IGNORE_TEST = "ON"
          echo "IGNORE_TEST=$env:IGNORE_TEST" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          # Call build script with named parameters
          & "${{ env.SRC_DIR }}\scripts\build_win_wheel.ps1" `
            -PythonVersion "${{ matrix.python_version }}" `
            -ACloudViewerInstall "${{ env.INSTALL_DIR }}" `
            -CloudViewerMLRoot "${{ env.CLOUDVIEWER_ML_ROOT }}" 2>&1 | `
            Tee-Object -FilePath "${{ runner.temp }}\windows-wheel-build.log"
          # Propagate build exit code (exit N in .ps1 sets $LASTEXITCODE,
          # but the Tee-Object pipeline above resets the step exit code)
          if ($LASTEXITCODE -ne 0) {
              Write-Error "build_win_wheel.ps1 failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          $PIP_PKG_NAME=(Get-ChildItem (Join-Path "${{ env.INSTALL_DIR }}" "cloudviewer-*.whl")).Name
          $PIP_CPU_PKG_NAME=(Get-ChildItem (Join-Path "${{ env.INSTALL_DIR }}" "cloudviewer_cpu*.whl")).Name
          echo "PIP_PKG_NAME=$PIP_PKG_NAME"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PIP_CPU_PKG_NAME=$PIP_CPU_PKG_NAME"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build log
        # Persist the full build log (GitHub truncates very long step logs in
        # the UI). if: always() + continue-on-error: upload even when the build
        # failed, so it can be inspected.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel-build-log-py${{ matrix.python_version }}-cuda${{ matrix.BUILD_CUDA_MODULE }}
          path: ${{ runner.temp }}\windows-wheel-build.log
          if-no-files-found: ignore
      
      - name: Save sccache cache to release assets
        # Overwrite the cell's persistent asset in place (--clobber); see
        # the app matrix job for the storage rationale. Runs after the
        # build step: disk writes for completed compiles are already
        # durable, and the daemon dies with the step tree either way.
        if: always() && env.COLD_BUILD != 'true' && steps.sccache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path "${{ runner.temp }}\sccache") {
            $asset = "sccache-win-wheel-cuda${{ matrix.BUILD_CUDA_MODULE }}-py${{ matrix.python_version }}.tar.gz"
            tar -czf "$env:RUNNER_TEMP\$asset" -C "${{ runner.temp }}\sccache" .
            # Cancelled/aborted-run guard and branch policy: see the app
            # matrix job's save step (real pools are ~2 GB).
            $size = (Get-Item "$env:RUNNER_TEMP\$asset").Length
            if ($size -lt 52428800) {
              Write-Host "[cache] $asset is only $size bytes (cancelled/aborted run); skip upload to keep the previous pool"
            } else {
              gh release upload ci-ccache "$env:RUNNER_TEMP\$asset" -R Asher-1/cloudViewer_downloads --clobber
              if ($LASTEXITCODE -ne 0) {
                gh release upload ci-ccache "$env:RUNNER_TEMP\$asset" -R Asher-1/cloudViewer_downloads --clobber
              }
              if ($LASTEXITCODE -eq 0) { Write-Host "[cache] uploaded $asset" }
              else { Write-Host "[cache] upload failed (non-fatal; next run restores the previous pool)" }
            }
            Remove-Item "$env:RUNNER_TEMP\$asset" -ErrorAction SilentlyContinue
          }
      - name: Upload Wheel to GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PIP_PKG_NAME }}
          path: |
            ${{ env.INSTALL_DIR }}/${{ env.PIP_PKG_NAME }}
            ${{ env.INSTALL_DIR }}/${{ env.PIP_CPU_PKG_NAME }}
          if-no-files-found: error
      
      - name: Update devel release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload main-devel ${{ env.INSTALL_DIR }}/${{ env.PIP_PKG_NAME }} ${{ env.INSTALL_DIR }}/${{ env.PIP_CPU_PKG_NAME }} --clobber
          gh release view main-devel

      - name: Public Wheel Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          generate_release_notes: false
          prerelease: false
          files: |
            ${{ env.INSTALL_DIR }}/${{ env.PIP_PKG_NAME }}
            ${{ env.INSTALL_DIR }}/${{ env.PIP_CPU_PKG_NAME }}

  test-wheel:
    name: Test wheel
    permissions:
      contents: read
    runs-on: windows-2022
    # Hard cap well below the 6h runner limit: the 4fddd764b run wedged for
    # ~6h after a C++-side abort in the python suite (faulthandler dumped,
    # the pipeline never released) and burned a full runner. The suite
    # itself completes in ~6min on Ubuntu; 60min leaves generous headroom
    # for the slower Windows host while reclaiming the runner on a wedge.
    timeout-minutes: 60
    needs: [build-wheel]
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.10', '3.11', '3.12']
        is_main:
          - ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        exclude:
          - is_main: false
            python_version: '3.10'
          - is_main: false
            python_version: '3.11'

    env:
      BUILD_PYTORCH_OPS: ON
      BUILD_TENSORFLOW_OPS: OFF
      CONDA_DEP_FILE: ".ci/conda_windows.yml"
      CLOUDVIEWER_ML_ROOT: ${{ github.workspace }}/CloudViewer-ML

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Checkout CloudViewer-ML source code
        uses: actions/checkout@v4
        with:
          repository: Asher-1/CloudViewer-ML
          ref: main
          path: ${{ env.CLOUDVIEWER_ML_ROOT }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cloudviewer*win*.whl
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Test Python package (CPU)
        env:
          BUILD_CUDA_MODULE: OFF
        run: |
          python -V
          $env:PIP_VER = "${{ env.PIP_VER }}"
          $env:CLOUDVIEWER_SOURCE_ROOT = (Get-Location).Path
          . util/ci_utils.ps1
          $py_tag=(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          if (Test-Path -Path "pip_package") {
            $PIP_PKG_NAME=(Get-ChildItem pip_package\cloudviewer_cpu*-$py_tag-*.whl).Name
          } else {
            $PIP_PKG_NAME=(Get-ChildItem cloudviewer_cpu*-$py_tag-*.whl).Name
          }
          echo "Testing wheel: $PIP_PKG_NAME"
          Test-Wheel -wheel_path $PIP_PKG_NAME
      - name: Run Python unit tests (CPU)
        env:
          # Unbuffered stdout: the 4fddd764b Test-wheel crash (Fatal Python
          # error: Aborted in test_parity_batches.py) printed only buffered
          # progress dots - the verbose per-test lines that name the failing
          # test stayed in the stdio buffer and were lost when the abort
          # wedged the pipeline for the remaining ~6h (Ubuntu's
          # run_python_tests passes -v and the same suite passes in ~6min).
          PYTHONUNBUFFERED: '1'
          # Forensics gate for test_database_management_surface (the Windows
          # abort diagnosed via test_parity_batches.py): set the repository
          # variable ACV_WINDOWS_DB_DIAG=1 (repo Settings -> Variables) to run
          # that test with its step-level stderr markers on; default 0 keeps
          # it skipped per the upstream verification boundary.
          ACV_WINDOWS_DB_DIAG: ${{ vars.ACV_WINDOWS_DB_DIAG || '0' }}
        run: |
          $ErrorActionPreference = 'Stop'
          cloudViewer_test.venv\Scripts\Activate.ps1
          python -V
          echo "Installing test dependencies..."
          python -m pip install -r python/requirements_test.txt
          echo "Running CloudViewer python tests (CPU)..."
          echo "Testing ML and ML Ops disabled"
          # -v + fixed seed (parity with run_python_tests' -v): verbose lines
          # name every test, the fixed seed makes any failure locally
          # reproducible.
          python -m pytest -v --randomly-seed=42 python/test/ --ignore python/test/ml_ops/
          deactivate
      - name: Test Python package (CUDA)
        env:
          BUILD_CUDA_MODULE: ON
        run: |
          python -V
          $env:PIP_VER = "${{ env.PIP_VER }}"
          $env:CLOUDVIEWER_SOURCE_ROOT = (Get-Location).Path
          . util/ci_utils.ps1
          $py_tag=(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          if (Test-Path -Path "pip_package") {
            $PIP_PKG_NAME=(Get-ChildItem pip_package\cloudviewer-*-$py_tag-*.whl).Name
          } else {
            $PIP_PKG_NAME=(Get-ChildItem cloudviewer-*-$py_tag-*.whl).Name
          }
          echo "Testing wheel: $PIP_PKG_NAME"
          Test-Wheel -wheel_path $PIP_PKG_NAME
      - name: Run Python unit tests (CUDA)
        env:
          # Same forensics as the CPU step above (unbuffered verbose lines
          # name the failing test when a C++ extension aborts mid-run).
          PYTHONUNBUFFERED: '1'
          # Forensics gate for test_database_management_surface (the Windows
          # abort diagnosed via test_parity_batches.py): set the repository
          # variable ACV_WINDOWS_DB_DIAG=1 (repo Settings -> Variables) to run
          # that test with its step-level stderr markers on; default 0 keeps
          # it skipped per the upstream verification boundary.
          ACV_WINDOWS_DB_DIAG: ${{ vars.ACV_WINDOWS_DB_DIAG || '0' }}
        run: |
          $ErrorActionPreference = 'Stop'
          cloudViewer_test.venv\Scripts\Activate.ps1
          echo "Installing test dependencies..."
          python -V
          python -m pip install -r python/requirements_test.txt
          echo "Running CloudViewer python tests (CUDA)..."
          echo "Testing ML and ML Ops disabled"
          python -m pytest -v --randomly-seed=42 python/test/ --ignore python/test/ml_ops/
          deactivate
