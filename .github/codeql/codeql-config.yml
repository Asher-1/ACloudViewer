# CodeQL configuration: exclude vendored third-party libraries from analysis.
# For C/C++ manual builds, paths-ignore alone is insufficient -- the workflow
# also uses advanced-security/filter-sarif to post-filter SARIF results.

paths-ignore:
  - '3rdparty'
  - '3rdparty_downloads'
  - 'libs/Reconstruction/lib'
  - '**/extern'
  - '**/external'
  - '**/3rdparty'
  - '**/3rdparty_downloads'
  - '**/third_party'
  - '**/thirdparty'
  # Build artifacts — CMake FetchContent downloads vendored third-party code
  # into build/_deps/ (e.g. ext_imgui, ext_glfw). Exclude them from analysis.
  - 'build'
  - 'build_app'
  - '**/build/**'
  - '**/build_app/**'
  - 'plugins/core/Standard/qSIBR/3rdparty'
  # Vendored third-party SIBR library (Inria) embedded in qSIBR - not first-party code
  - 'plugins/core/Standard/qSIBR/SIBR'
