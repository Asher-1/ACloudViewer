# Ordered ggml unified-diff patches applied at ExternalProject fetch time.
# Add new entries here; do not edit fetched ggml sources in-place.
# All modifications go through these unified-diff files (validated and applied
# with `git apply`) so the fetched tree is byte-reproducible on every platform.
# Previously this was split across legacy Python mutators; those have been
# converted to patches (see apply_ggml_patches.py header).
#
patches:
  - file: aliked_merged/0001-vulkan-aliked.patch
    note: "ALIKED Vulkan extraction (compute, DCN, SDDH, DKD, public C API, shader registration). vk_aliked_finish delegates to ggml_vk_synchronize: the former private path submitted the batch with ctx->fence and set submit_pending, so synchronize's fence-only submit attached the same fence to a second pending submit (VVL VUID-vkQueueSubmit-fence-00064, 6 per run) and the readback could race; it also reset compute_ctx first, skipping synchronize's in_memcpys/transfer submit. Measured on RTX 4090 test_aliked_capi_parity_512: 4/40 runs returned 0 or 128 keypoints before, 40/40 pass and 0 fence-00064 after."
  - file: msvc_vulkan/0001-msvc-vulkan-hpp-compat.patch
    note: MSVC compatibility for Vulkan-Hpp __faststorefence intrinsic
  - file: cpu_all_variants/0001-cpu-all-variants-compiler-checks.patch
    note: "Gate CPU ALL_VARIANTS BF16/AMX/AVX-VNNI variants behind compiler-flag checks; remove apple_m4 (+nosve+sme unreliable on Apple Clang); inert when GGML_CPU_ALL_VARIANTS=OFF"
  - file: metal_merged/0001-metal-optimizations.patch
    note: "Metal optimizations (one consolidated patch): conv_transpose_2d IC-parallel tree reduction; flash-attn large-seq (MAX_COMMAND_BUFFERS 64, auto-tune n_cb/n_main); fused Swin QKV split+bias kernel; flat-grid im2col (16 ch/thread, division-free carry); flat vectorized bin (4xfloat4/thread, broadcast-specialized); flat unary; flat get_rows (F32); K>=16 F16 mul_mm threshold; 4ch/thread QKV layout; inert when Metal is OFF"
  - file: vulkan_parallel/0001-vulkan-shaders-gen-skip-parallel-trycompile.patch
    note: "vulkan-shaders-gen: pre-seed CMAKE_C/CXX_ABI_COMPILED=1 so the nested configure skips the ABI/works try_compile, removing the MSBuild parallel file-lock race (MSB3491) on .lastbuildstate"
  - file: rmbg_merged/0001-rmbg-custom-ops.patch
    note: "RMBG background-removal custom ops: fused CUDA layer-norm/affine/deform/conv/Swin kernels plus Vulkan scalar direct-conv, named CM1 matmul selection, Flash attention and task dispatch; zero cuDNN (the former CUDA cuDNN conv2d custom op was removed - the RMBG graph builder runs the conv as F16 im2col + F16-weight GEMM on the fast profile, pure F32 under strict_math); CPU/Metal fall back to vanilla ggml ops. Vulkan scalar routing is name-based: the RMBG graph builder marks matmul outputs (rmbg_scalar_* always scalar; rmbg_tc_* scalar only on coopmat2, whose F32 matmul path converts operands to F16) and direct convs (rmbg_conv2d_*), replacing the per-matmul RMBG_VK_COOPMAT_MATMUL / RMBG_VK_SCALAR_DIRECT_CONV env whitelist (process-global env leaked into other tasks and crashed qTrellis DINO on NV_coopmat2); the CREATE_RMBG_SCALAR matmul pipelines are instantiated on every device path (they used to be CM1-only, leaving empty structs on coopmat2), and the is_empty() guard stays as a defensive fallback"
  - file: rfdetr_merged/0001-ggml-cpu-fold-broadcast-iterations.patch
    note: "RF-DETR CPU perf: fold broadcast iterations into the llamafile sgemm epilogue loop; inert when GGML_LLAMAFILE=OFF"
  - file: yolo_merged/0001-yolo-ggml-backend-integration.patch
    note: "YOLO GPU ops: ggml_conv_2d_direct_bias_silu API (ggml.h/ggml.c), CUDA direct/dw/transpose conv + pool/upscale/scale kernels, Vulkan F16 conv2d pipeline; merged against the aliked/rmbg/vulkan_parallel chain so only YOLO-specific hunks remain. vk_conv_block_sizes CONV_SHAPE_64x32/64x128 CRS kept at v0.18.1 values (32/16): the NVIDIA 64/32 override crashed SAM3 encoder graphs with VK_ERROR_DEVICE_LOST on RTX 3060 (driver 550.144.03); A/B measured no YOLO Vulkan regression (5.77 vs 5.97 ms on yolov8n-f32 640x640)"
  - file: sam3_merged/0001-sam3-ggml-custom-ops.patch
    note: "SAM3 custom ops: ggml_mul_mat_cast + ggml_rope_custom_freqs/qkv (ggml.h/ggml.c), CUDA win_part/win_unpart kernels + 2x2 stride-2 conv_transpose cuBLAS fast path + flash-attn tile DKQ 16/32/56 + custom RoPE kernels, Metal flash-attn head 16/56 templates, Vulkan 2x2 stride-2 conv_transpose reorder/interleave fast path (guarded to the SAM3 F32-activation contract: src1/dst must be F32, F16 flows fall through to the generic conv_transpose pipeline — an unguarded fast path fed F16 protos misread as F32 and produced garbage YOLOE/v8seg masks on Vulkan); merged against the yolo/rmbg chain so only SAM3-specific hunks remain"
  - file: sam3_merged/0002-conv-transpose-p0-fast-batch-fix.patch
    note: "CUDA 2x2/stride-2 conv_transpose cuBLAS fast path batch fix: the reorder/GEMM/interleave decomposition only computed batch 0 and left batches 1..N-1 of the destination untouched (stale allocator memory) whenever the input carried ne[3]>1. LingBot-Map's DPT resize1 hits this op with bs=8 (the multi-frame scale pass folds frames into the batch axis), so frames 1..7 of the scale pass decoded garbage depth while frame 0 and every single-frame streaming call stayed correct. Runs one [C_out, WH] GEMM per (phase, batch) on the per-batch input pointer (the ggml [W,H,C_in,B] layout cannot fold batches into one GEMM because the channel stride sits below the batch stride), adds the contiguity asserts the naive kernel already had, and widens the interleave kernel to write every batch. The naive kernel covers B>1 but the fast path did not; SAM3 itself only ever calls the op with B=1, which is why its gates never caught it"
  - file: trellis_merged/0001-ggml-cuda-cpy-q8_0.patch
    note: "TRELLIS.2 / general CUDA: Q8_0→Q8_0 direct block copy (cpy_blck_q8_0_q8_0 kernel), avoiding the dequant→F32→requant roundtrip when copying quantized weights between CUDA buffers; placed after sam3_merged because sam3's cpy.cu changes are at a different offset (641+) and would shift the hunk context if applied first"
  - file: igemm_fix/0001-igemm-plan-rebuild-guards.patch
    note: "YOLO igemm conv fix: the pointer-keyed plan/nhwc caches were not shape-aware, so a rebuilt ggml graph that recycled a dst tensor pointer could reuse a stale plan and write/read out of bounds (e.g. a 1x1 plan whose 2KB weight buffer served a 3x3 conv, or an erased plan whose buffers were still queued on the async stream). Records in/out/weight byte sizes on the plan, rebuilds the plan (after a stream sync) on any mismatch, validates the chained-consumer owner plan, and drops the fast path when the staged device pointers are not valid; inert when the igemm conv path is unused"
  - file: igemm_session/0001-igemm-plan-session-generation.patch
    note: "YOLO CUDA igemm cache ownership: stamp direct-conv nodes with the model-session generation and rebuild a pointer-keyed plan when the generation changes, preventing same-address/same-shape allocations from reusing transformed weights from a destroyed model session"
  - file: glslc_fconvert/0001-pool-shaders-avoid-redundant-fconvert.patch
    note: "glslc/spirv-opt same-bit-width FConvert fix (affects Ubuntu 24.04+ default shaderc 2023.8 and newer): pool1d.comp / pool2d.comp read A_TYPE values with `D_TYPE(data_a[...])`, which becomes a redundant `float16_t(float16_t)` cast for the f16 variants and generates `OpFConvert %half %half`, rejected by spirv-opt. Changed to `float(data_a[...])` to generate a proper f16->f32 conversion; f32 variants are unaffected (glslang elides float(float)). Same approach as upstream ggml's OPTIMIZATION_ERROR_WORKAROUND in copy.comp; inert when GGML_USE_VULKAN=OFF"
  - file: cuda_merged/0001-cuda-downstream-fixes.patch
    note: "Consolidated CUDA downstream fixes (merged from cuda_mmq + cuda_mul_mat_f16_dst + cuda_rope_dup_mode, disjoint file sets). (1) Force MMQ kernels and static cudart when GGML_CUDA_FORCE_MMQ=ON; removes cuBLAS/cublasLt link dependency so libggml-cuda.so needs only libcuda.so.1 (NVIDIA driver). (2) mul_mat F16/BF16 output fix: guard the F32-output path when ggml_mul_mat_cast requests a native destination, then write native cuBLAS results directly to that destination; a temporary-buffer copy changed batched destination strides and corrupted SAM3 ViT QKV/MLP outputs into empty masks. (3) v0.21.0 rope.cu: remove the duplicate `const int mode` declaration in ggml_cuda_op_rope_impl (identical initializer op_params[2]; nvcc 11.8 rejects the redeclaration, newer host compilers tolerate it). Semantics of all three unchanged; inert when GGML_CUDA=OFF"
  - file: q41_mmq_parity/0001-q8-1-standard-sum-semantics.patch
    note: "Type-differentiated CUDA Q8_1 activation-sum semantics: MMVQ quantize_q8_1 and the MMQ DS4 instantiation for Q4_1/Q5_1 (quantize_mmq_q8_1<DS4,*,standard_sum=true>) store the standard block_q8_1 sum s = d*sum(qs[i]) so the m_x*s_y correction matches quantize_row_q8_1_ref on the CPU (Q4_1 mul_mat max_abs 0.658 -> 0.044; sam3-visual-q4_1 mask IoU 0.978 -> 0.994). The MMQ DS4 instantiation for Q4_K/Q5_K keeps the upstream v0.21.0 raw float sum: their correction consumer vec_dot_q4_K_q8_1_impl_mmq (sumf_m = ds8.y * m[i]) must stay bit-identical to the sam-3d-objects-ggml reference, whose q4_k conditioning parity broke at int8-quantization scale under the global standard semantics (DINO block-0 qkv GEMM diverged, amplified by the pinned-noise e2e into a ~0.2% gaussian-count gap). D2S6 (Q2_K) raw sum unchanged from upstream; MMVQ k-quant kernels read the int8 dot, not ds.y, so they are unaffected"
  - file: upstream_accuracy/0001-world-f32-gemm-tf32-route-and-im2col-race.patch
    note: "Upstream ultralytics-ggml correctness fixes our yolo_merged was missing: (1) ggml-cuda/mmf.cu — route F32 GEMM through cuBLAS instead of the TF32 MMF path ('not numerically equivalent to PyTorch F32, especially visible in World attention GEMMs' — fixed the CUDA open-vocabulary detection count divergence); keep MMF for F16/BF16. (2) ggml-cpu/ops.cpp — im2col f32/f16 parallel rewrite: parallelise over output rows N*OH; the old IC-strided scheme let threads write the same dst slot (data race → non-deterministic conv output on multi-threaded CPU)"
  - file: trellis_f32_route/0001-ggml-f32-prec-route-cuda-only.patch
    note: "TRELLIS.2 GGML_PREC_F32 CUDA routing: the CUDA hunk of upstream trellis-ggml patches/ggml-vulkan-f32-route.patch (verbatim) — GGML_PREC_F32 bypasses the f16-MMA mmvf/mmf kernel selection in ggml_cuda_mul_mat and falls through to cuBLAS (CUBLAS_COMPUTE_32F, no TF32), matching CPU f32-accumulate semantics. The upstream VULKAN hunks (coopmat2 fp32 pipeline registration + PREC_F32 dequant dispatch) are deferred — they apply cleanly but produce wrong results on our validation stack (RTX 4090, driver 550.144.03: trellis coarse q8 output = all-negative occupancy on both GGML_VK_DISABLE_F16=1 and unset); the full port is preserved in trellis_f32_route/0001-ggml-f32-prec-route.patch for the next ggml-upgrade attempt (see trellis_f32_route/README.md). Vulkan runs the base v0.18.1 dispatch (validated: coarse q8 e2e 9.9s vs CUDA 18.6s, geometry within the q8 chaotic-sampler envelope). Inert unless a graph requests GGML_PREC_F32 (trellis2 lin()/attention projections)"
  - file: cuda_strict_f32/0001-prec-f32-disable-tf32.patch
    note: "GGML_PREC_F32 CUDA correctness: cuBLAS handles default to CUBLAS_TF32_TENSOR_OP_MATH, so CUBLAS_COMPUTE_32F alone still rounds F32 operands to TF32. Temporarily select CUBLAS_DEFAULT_MATH for explicit GGML_PREC_F32 GEMMs and restore TF32 afterward. This protects explicit F32 GEMMs while normal F16/TF32 paths remain fast; direct F32 convolution is handled by the following patch."
  - file: cuda_strict_f32/0002-f32-direct-conv-no-igemm.patch
    note: "CUDA direct F32 convolution correctness: the IGEMM path uses TF32 WMMA and therefore cannot preserve F32 operands. Route only direct F32 convolutions through the existing scalar-F32 fallback; F16, Q8, and im2col/GEMM paths retain their optimized kernels."
  - file: cuda_strict_f32/0003-strict-f32-env-opt-in.patch
    note: "Restore the upstream sam-3d-objects-ggml GGML_CUDA_STRICT_F32 env opt-in that the v0.21.0 port lost: the cuBLAS handle init picks CUBLAS_PEDANTIC_MATH (no implicit TF32 tensor-core reductions) when the env is set, CUBLAS_TF32_TENSOR_OP_MATH otherwise. Default (env unset) behavior is bit-identical to before; the opt-in exists for numerically sensitive debugging (for example MoGe later DINO blocks) and matches the reference tree's common.cuh"
  - file: vulkan_sysmem_fallback/0001-vulkan-log-host-memory-fallback.patch
    note: "Vulkan sysmem fallback observability: ggml-vulkan's memory-property flags chain ({ReBAR, DeviceLocal, HostVisible}) retries allocation candidates silently, so a buffer that no longer fits VRAM lands in host memory with zero signal — a PCIe-bound run that took 100x longer was indistinguishable from a hang (qTrellis 1024-f16+PBR: ~9 GiB spilled, 70+ min). After a DeviceLocal candidate fails and the buffer lands in host-visible memory, log a GGML_LOG_WARN with the size so the AICore log bridge (ggml_env_bridge) surfaces it in the application log; suppressed on UMA devices where host memory is unified and not a degradation. Allocation semantics unchanged; inert unless an allocation actually degrades."
  - file: vulkan_small_bar/0001-vulkan-no-rebar-small-bar-window.patch
    note: "Vulkan small-BAR policy: ggml_vk_create_buffer_device prefers any DeviceLocal|HostVisible memory type as 'ReBAR'. Without Resizable BAR that type lives in a separate PCIe BAR heap (246 MiB of 24 GiB on the RTX 4090 test host, nvidia-smi BAR1 total 256 MiB), so a few contexts fill it and host writes into the mapped buffers collapse: OCR det+rec with a SLANet table context in one process went from 1.3 ms to 113 ms p50 input upload (wall p50/p95 135/328 ms) once BAR1 reached 238/246 MiB, perf task-clock attributing 73% of process CPU to the tensor_set memmove; syscalls (futex/poll/ioctl) and page faults were unchanged, so this is not fence waiting or CPU frequency scaling. At device init the patch sets disable_host_visible_vidmem when the largest DeviceLocal|HostVisible heap is smaller than half the largest device-local heap (non-UMA only), i.e. the upstream GGML_VK_DISABLE_HOST_VISIBLE_VIDMEM behaviour selected from the memory properties instead of a process env; ReBAR/SAM devices (host-visible type on the VRAM heap) and UMA devices are unchanged, and allow_sysmem_fallback keeps its meaning. Measured on the same host: wall p50/p95 22.1/47.4 ms, upload 1.47 ms, BAR1 stays at 9-10 MiB, OCR outputs bitwise identical (200/200 FNV hashes)."
  - file: lingbot_merged/0001-lingbot-ggml-default-path.patch
    note: "LingBot-Map (GCT streaming reconstruction) default-path fixes, semantically merged from upstream lingbot-map-ggml 0001-lingbot-ggml-v021.patch onto the aliked/rmbg-modified CREATE_CONVS region: (1) ggml_conv_2d keeps F32/BF16 weights in F32 im2col instead of truncating to F16 (GCT DPT heads); (2) coopmat2/CM1 paths also instantiate the scalar F32-destination conv2d/conv_transpose_2d pipelines (an empty type-based lookup died with SIGFPE on the first dispatch); (3) conv2d_mm coopmat variants (F16 accumulators) are only generated/selected for F16-weight convolutions, so they no longer overwrite the scalar pipeline name; (4) the name-based scalar matmul routing gains the 'lingbot_scalar_' owner prefix. The upstream flash-attention kernel rewrites (CUDA fattn-mma F32 VKQ + Vulkan FA hi/lo split), the GGML_VK_* process-global env switches, and the flash KV-cache mode are deliberately NOT carried over: AICore runs the default strict attention path, routes precision through graph-node markers and this name routing instead of process-global state, and does not move the validated FA baselines of the other tasks. Inert unless a graph uses F32-weight ggml_conv_2d or lingbot_scalar_-marked outputs."
  - file: lingbot_merged/0002-lingbot-matmul-pipeline-alloc.patch
    note: "Fix a NULL shared_ptr dereference at first Vulkan device init: the lingbot scalar-matmul pipelines (pipeline_matmul_f32_lingbot / pipeline_matmul_f32_f16_lingbot) were declared and registered via CREATE_LINGBOT_SCALAR but never allocated — every other vk_matmul_pipeline member gets a make_shared guard before the ggml_vk_create_pipeline lambda, so device->pipeline_matmul_f32_lingbot->l read through NULL and segfaulted inside ggml_vk_load_shaders before the application banner. Adds the standard allocation guards; no behavior change once allocated."
  - file: lingbot_merged/0003-cuda-mmq-lingbot-route.patch
    note: "LingbotMap-only name-routed cuBLAS for q8-weight matmuls: the upstream reference CLI (cpp_ggml build-cuda) sets GGML_CUDA_FORCE_CUBLAS=ON, so its q8 linear/attention matmuls run the cuBLAS reduction tree instead of the MMQ int8 kernels, and the camera head's iterative AdaLN refinement amplifies the 1e-12 accumulation-order differences into visible depth/pose drift. A global FORCE_CUBLAS would regress every other AICore task's quantized throughput, so the dispatch is exempted ONLY for nodes named 'lingbot_scalar_*' (every lingbot matmul is named that by the model builder; zero-dependency prefix compare). F16 keeps the mmf kernel on both engines and F32 with GGML_PREC_F32 already bypasses MMQ, so no other task's dispatch changes; pairs with the lingbot_scalar_ exemption in cuda_strict_f32/0001 (cuBLAS math mode stays TF32 for these nodes, matching the reference build)."
  - file: sam3d_merged/0001-sam3d-ggml-custom-ops.patch
    note: "SAM 3D Objects custom ops ported from the sam-3d-objects-ggml v0.21.0 combined patch and semantically merged onto this chain: (1) three new ops — GGML_OP_SAM3D_F16_MASKED_ATTN (CUDA-only PyTorch-2.5 mem-eff cutlass FMHA layout, vendored pinned PyTorch headers + CUTLASS), GGML_OP_SAM3D_SPARSE_SCATTER_MEAN (CPU + CUDA half2-fastAtomicAdd + Vulkan comp shader), GGML_OP_SAM3D_SPARSE_CONV_F16 (CPU F32-accumulate reference + CUDA vendored spconv 2.3.8 Ampere kernels under 3rdparty/llama/sam3d/spconv, gated by GGML_SAM3D_OPS + GGML_SAM3D_SPCONV_DIR); (2) CPU soft_max work-buffer under-reservation fix (n_threads>1 wrote past the buffer); (3) Q4_K→F32 copy (CUDA kernel + Vulkan copy_from_quant_qk.comp); (4) name-gated sam3d fast paths — PyTorch-Welford F32 NORM, NORM-affine and F16-Linear+bias cublasLt graph fusions, and dense FLASH_ATTN_EXT→cutlass routing — all keyed on the 'sam3d_' node-name prefix so no other task's validated numerics change; the cublasLt path is compiled out under GGML_CUDA_FORCE_MMQ to preserve the cublasLt-free dependency footprint. Deliberately NOT carried from the upstream patch: all env hooks (GGML_CUDA_STRICT_F32, GGML_CUDA_FATTN_KERNEL, SAM3D_CUDA_OP_PROFILE, SAM3D_VK_MM_TILE/WG, SAM3D_VK_MUL_MAT_DEBUG), the OCP-fp4 Vulkan branch removals, the global precise-silu rewrite (carried by the following patch), the global PREC_F32→cuBLAS early route (redundant: trellis_f32_route already routes PREC_F32), and the PREC_F32 F16-operand exception (would change trellis F16-strict GEMM semantics)."
  - file: sam3d_merged/0002-allow-sam3d-masked-attn-scratch-allocation.patch
    note: "The CUDA SAM3D F16 masked-attention buffer appends backend scratch beyond ggml_nbytes; llama 0.27's allocator guard requires every such custom op to be explicitly allowlisted. This scopes expanded allocation permission to that op and preserves all other op-size checks."
  - file: sam3d_merged/0002-precise-silu-parity.patch
    note: "CUDA SiLU parity with sam-3d-objects-ggml: the upstream tree (submodule 8599e0ea) implements ggml_cuda_op_silu_single with a double-precision exp and __fdiv_rn so PyTorch's F16 SiLU rounding survives even under -use_fast_math. The fast-math form (__expf + __fdividef) perturbs F16 activation outputs by ULPs and the sam3d diffusion samplers amplify that into ~6% gaussian-count divergence vs the upstream reference. Applied globally (matches upstream exactly) except nodes named mapany_*, which map_anything_merged/0001 (part B) returns to the pristine expression because the map-anything-ggml reference runs pristine ggml; non-sam3d accuracy gates are tolerance-based and precise math only moves them closer to PyTorch. Pairs with GGML_CUDA_FAST_MATH=OFF (now the AICore_CUDA_FAST_MATH=OFF build; the project default switched to ON for map-anything-ggml parity, and before sam3d_merged/0005 sam3d bit-parity evidence was valid only in OFF builds - measured same-input A/B on the kidsroom f16 CUDA run, seed 42 / 25 steps: ON 841760 vs OFF 842560 gaussians, both deterministic across runs; 0005 restores the OFF numerics for sam3d_* nodes inside the ON build), mirroring the upstream production build (cpp_ggml/build-cuda CMakeCache). Upstream also replays CUDA graphs (run_ggml.sh); that flag is deliberately NOT mirrored: replay bakes the first call's internal scratch pointers of our ported spconv/masked-attention custom ops into the capture and bypasses their per-call host logic, collapsing the ss flow occupancy (58182 -> 4992 coords on the kidsroom fixture)."
  - file: sam3d_merged/0003-sam3d-f32-mmf-route-exemption.patch
    note: "sam3d upstream-parity exemption for the F32 MMF route: the sam-3d-objects-ggml upstream carries NO F32 cuBLAS route (its combined patch leaves mmf.cu at the v0.21.0 base), so every F32 mul_mat in upstream runs executes the Ampere TF32 MMF path. Our upstream_accuracy patch routes F32 through cuBLAS for PyTorch equivalence, which broke sam3d conditioning parity - the DINO/PointPatch graphs are all-F32 (as_f32 + manual mul_mat attention chains), and their tokens diverged from upstream at ~1% (TF32-mantissa scale), which the pinned-noise/pinned-condition bisect then amplified through the SS flow (vc0 maxabs 6e-2). Exempts nodes named sam3d_* from the F32 cuBLAS route so they keep the base TF32 MMF behavior and match the upstream reference; every other task (YOLO World attention etc.) keeps the PyTorch-equivalent cuBLAS F32 route unchanged."
  - file: sam3d_merged/0004-f16-cublas-prefer-f32-name-gate.patch
    note: "sam3d parity gate for the RMBG Ampere F16 cuBLAS F32-direct output: the SS occupancy decoder's conv3d GEMM (F16 weight x F32 im2col, unnamed node auto-named sam3d_N by the task graph builder) hits the rmbg prefer_f32_output Ampere branch and takes the F32-direct output, while the upstream reference keeps the base F16-temp-buffer + convert path on Ampere - the F16 quantization step flips 2 occupancy voxels (61756 vs 61758), which surface-prune amplifies to +1 coord and +32 gaussians (888256 vs the 888224 golden) under the pinned contract noise. Gates the Ampere branch off for nodes named sam3d_* so sam3d keeps the upstream F16 numerics (full chain now bit-exact: cond/SS flow/occupancy/count = 888224); every other task keeps the RMBG optimization. Applied after 0003 because the hunk context is the rmbg prefer_f32_output assignment in ggml_cuda_mul_mat_cublas_impl."
  - file: warning_cleanup/0001-compiler-warning-cleanup.patch
    note: "Compiler-cleanup without runtime changes: move set_rows row-size calculation into the F16-only constexpr branch, and compare IGEMM cache byte counts using their declared int64_t representation."
  - file: cuda_graphs/0001-exclude-custom-ops-from-graph-capture.patch
    note: "Re-enables CUDA graph capture for pure standard-op graphs. GGML_CUDA_GRAPHS was globally OFF because replay bakes the first call's host-side decisions into the stream, which collapsed the sam3d ss-flow occupancy (58182->4992 coords). Instead of keeping the global kill-switch, this patch excludes graphs containing host-orchestrated custom ops (SAM3D_F16_MASKED_ATTN / SAM3D_SPARSE_SCATTER_MEAN / SAM3D_SPARSE_CONV_F16 / MAP_CUSTOM1-3) from capture, so sam3d keeps its per-call host logic while OCR det/rec, layout and other standard-op graphs get capture/replay (fixed topology + stable gallocr buffer addresses across cached computes). OCR rec single forward CUDA: 40.5ms dispatch-bound for a <2ms GPU compute; OCR dense-image e2e target <100ms requires this."
  - file: cuda_igemm_tf32/0001-tf32-optin-and-igemm-plan-shape-validation.patch
    note: "Consolidated OCR ggml patch: Vulkan IM2COL descriptor safety skips only unbound shape metadata src0 while retaining bound-buffer checks; CUDA igemm work makes F32 TF32 WMMA opt-in, covers every output-channel tile, and validates cached plans by full input/destination/kernel geometry and types. This is the sole ggml source patch for OCR fixes."
  - file: map_anything_merged/0001-map-anything-ggml-parity.patch
    note: "Single MapAnything (map-anything-ggml cpp_ggml) parity patch, folded from three formerly separate patches (A-C; the folded chain was verified byte-identical to the three-patch chain on the extracted v0.21.0 tree) plus the Vulkan part (D). (A) CUDA perf: k==s conv_transpose_2d_p0 direct-gather kernel (every output element (co,oh,ow,n) is fed by exactly one input pixel, so the generic stride-alignment search collapses to a plain c_in dot product with co-contiguous kernel reads). Rebases the upstream cpp_ggml 0001-cuda-conv-transpose-ks patch (written against v0.24.0) onto the v0.21.0 patched chain - the 0.21 generic kernel is input/kernel/output templated with ggml_cuda_cast output writes, so the port adds an explicit F32-activation dispatch guard (input->type == dst->type == GGML_TYPE_F32; the F16-input combos keep the generic kernel) while the 2x2 cuBLAS path above keeps owning k==s==2. map_anything DPT heads upsample with s==k in {4,8,16}. (B) CUDA numerics: MapAnything CUDA upstream-parity gate (node-name prefix mapany_, mirroring the sam3d_ convention): the map-anything-ggml reference runs on PRISTINE ggml plus only its own committed third_party/ggml-patches/0001 k==s CUDA kernel, which part (A) ports (verified: pristine v0.21.0 and v0.24.0 are bit-exact on the 2-frame courtyard pair, so the ggml version is irrelevant), while four downstream overrides in this chain perturb every MapAnything stage from cpp_conv4 onward: (1) rmbg_merged Ampere+ F16 cuBLAS F32-direct output, (2) the sam3_merged 2x2/stride-2 conv_transpose cuBLAS 4-phase fast path (changes the f32 reduction order of DPT resize1), (3) the upstream_accuracy F32-GEMM cuBLAS route that pristine sends to TF32 MMF, (4) the sam3d_merged/0002 global precise-math SiLU (double exp + __fdiv_rn) in both ggml_cuda_op_silu and the fused silu*mul ggml_cuda_op_unary_mul path. Adds ggml_cuda_mapany_pristine_node() in common.cuh and exempts mapany_* nodes at those four dispatch points so they keep the pristine kernel selection; the MapAnything graph builder names every mul_mat / conv_transpose / SiLU output with that prefix. (4) is reached only by SiLU models (the MapAnything DINOv2-G SwiGLU encoder and the camera-head poseLN_modulation); before it, mapanything-q8_0 CUDA first diverged at vg_bb_blocks_0 (mlp output 2.25e-4) and ended at depth max 6.82 on the 2-frame pair, while GELU families (omega/pi3/vggt-1b/dust3r) were already bit-exact. Every other task keeps the downstream defaults. Controlled bisect (upstream vggt-cli rebuilt on this patched tree, identical (S,3,H,W) f32 input): with these four exemptions plus -use_fast_math every dumped stage and pose/depth/depth_conf are bit-exact with the pristine reference; the only residual under a GGML_CUDA_FAST_MATH=OFF build (the historical sam3d requirement, lifted by sam3d_merged/0005) is fast-math ULP noise (pose max 1.95e-3, depth 2.8e-2, depth_conf 0.95 on that pair), which this patch cannot and does not address. (C) CPU/Metal batching: Backport of the ggml upstream batched GGML_OP_CONV_TRANSPOSE_2D (in v0.24.0, which the map-anything-ggml reference pins; absent in our v0.21.0): the v0.21 CPU kernel permuted and accumulated only batch 0 (work buffer sized for one batch) and the Metal kernel dispatched OW x OH x OC threadgroups without a batch index, so batches 1..N-1 stayed at the memset zero. Every MapAnything DPT head folds frames into ne[3], so frames >= 1 decoded garbage on CPU/Metal (measured on mapanything-q8_0 CPU, 2-frame sacre_coeur pair: frame 0 bit-exact with the upstream cpu reference, frame 1 depth max 40.7 / mask max 0.9997). CUDA (generic kernel + map_anything_merged/0001 + sam3_merged/0002 batch fix) and Vulkan (NPQ = N*OH*OW) already loop the batch. Mirrors the v0.24.0 loop order exactly so the CPU result stays bit-identical to the reference; batch-1 graphs (every other task) take the same single-iteration path as before. The Metal half only adds the batch index to the metal_merged/0001 kernel, which keeps its IC-parallel tree reduction; pristine v0.24.0 Metal (kernels/conv.metal) sums IC sequentially per (kh,kw) thread and then serially across threads, so Metal mapany_* conv_transpose output is batch-correct but not reduction-order-identical to the reference (unmeasured: no macOS host; Metal v0.21.0 and v0.24.0 also differ in ggml-metal-ops.cpp, so Metal bit-parity is not claimed). (D) Vulkan numerics: same mapany_* gate on the Vulkan backend (ggml_vk_mapany_pristine_node). Pristine v0.21.0 and v0.24.0 Vulkan are bit-exact on the upstream reference graph, and a manifest-prefix bisect (upstream vggt-cli rebuilt on v0.21.0 + the first k patches) attributes the whole Vulkan gap to three downstream overrides: (1) rmbg_merged/0001 routes F32 K/V flash attention to FA_SCALAR with the fp32 module, while pristine keeps the device path (coopmat2/coopmat1) - mapany_* FA nodes pass pristine=true to get_fa_tuning_params / get_fa_pipeline_state, and the flag is part of vk_fa_pipeline_state so both modules can coexist; (2) the sam3_merged/0001 2x2/stride-2 conv_transpose reorder/GEMM/interleave fast path is skipped for mapany_* nodes; (3) lingbot_merged/0001 sends F32-weight conv_transpose_2d to the scalar module on coopmat2/CM1 devices and stops generating its coopmat SPIR-V - the F32 conv_transpose coopmat variants are generated again and loaded into a separate pipeline_conv_transpose_2d_f32_mapany slot with exactly the module pristine selects per device path (cm2 / cm1 / unroll / plain), selected only for mapany_* nodes, so lingbot keeps its scalar routing. Before (D), dust3r-q8_0 / mapanything-q8_0 on RTX 4090 Vulkan differed from the upstream reference by 0.066 / 2.39 max |diff|; with (D) the AICore candidate is bit-exact. (E) CUDA flash-attention twin (src/ggml-cuda/mapany/): the F16 MMA FA kernel is launched stream-k with grid = min(max_active_blocks_per_sm*nsm, ntiles), and max_active_blocks_per_sm is cudaOccupancyMaxActiveBlocksPerMultiprocessor of the COMPILED kernel; v0.24.0 swizzles the K/V shared-memory tiles, so the same <64,64,8,1> instance compiles to 130 registers / 3 blocks per SM there vs 127 / 4 on v0.21.0 (sm_89, fast math), the KV range is cut at different points and the fixup sums partials in a different order. Measured before (E): pi3x-q8_0 CUDA frames parity 0 up to S=6, then max_diff 1.15e-3 (S=7), 3.40e-3 (S=8), 4.37e-4 (S=16) - first divergent stage mtdec.blocks.0_sdpa, everything upstream of it bit-exact; nsys at S=7: grid 384 / dyn smem 18560 B (reference) vs 424 / 20608 B. No dispatch gate can fix that, because the partition is a property of the kernel binary, so (E) vendors the reference's own fattn-common.cuh / fattn-mma-f16.cuh / fattn-swizzle.cuh VERBATIM (byte-identical to ggml 456172ec, the v0.24.0 tag map-anything-ggml pins) under mapany/ggml-v0.24.0/, compiles the four head-64 ncols2=1 instances plus a dispatcher inside namespace ggml_cuda_mapany (own launch_fattn / fixup / combine symbols, the sam3d precise-twin technique), and routes only mapany_* FLASH_ATTN_EXT nodes that the v0.21.0 dispatcher already sends to MMA_F16 with gqa_ratio 1 and head size 64 there; v0.24.0's sparse-gather path is only selectable for DKQ 512/576 and is stubbed to abort. Measured with (E): twin instance 130 registers (= reference), pi3x-q8_0 CUDA S=8 and S=16 max_diff 0 (6 raw files each), CUDA release matrix 36/36 frames rows and S=16 10/10 models max_diff 0, interleaved same-host A/B (3 rounds, p50) within +-1% at S=2 and S=16 for mapanything/pi3x/vggt-1b/vggt-omega. Upgrade contract: src/ggml-cuda/CMakeLists.txt aborts configure when GGML_VERSION_BASE equals 0.24.0 (that tree's own kernel is the reference; drop (E)), and run_map_anything_upstream_parity.py fails the CUDA row when the vendored bytes differ from the pinned reference ggml's (re-vendor when the reference moves). Cost: 5 CUDA TUs, ~1.3 MB in libggml-cuda.so, one strncmp per FA node. Ordering: must stay after sam3d_merged/0004 (prefer_f32_output hunk context), cuda_graphs, cuda_igemm_tf32 and lingbot_merged/0001 (CREATE_F16_CONVS / conv2d_mm gen context), and before sam3d_merged/0005 (compute_forward/fuser hunks)."
  - file: vulkan_prec_f32/0001-vulkan-ocr-exact-f32-matmul-on-coopmat2.patch
    note: "OCR det/layout exact F32 conv GEMM on NV_coopmat2 (node-name gate ocr_scalar_*). Coopmat2 has no F32 cm2 shader and reformats contiguous F32 operands to F16, so threshold-sensitive OCR maps diverged from the Paddle predictor. Interleaved same-host A/B on RTX 4090: det f32 max_diff 0.026709 -> 0.000039 with p50 2.735 -> 2.965 ms; real-image layout f32 0.015627 -> 0.000015 with p50 2.455 -> 2.800 ms. Rec joined later (dense conv GEMMs, SVTR attention and matmul_v2, marked by ocr_runtime exactF32): on coopmat2 its f32 fixture logits were 4.4e-4 off (CUDA 3e-6, after: 0) and 15 of 2123 ICDAR2015 texts differed from Paddle CPU on identical boxes and pad widths (after: 0); cost +17 ms on a 54-box page (73 -> 90 ms e2e, Paddle GPU 105 ms). The rule is not global: an unscoped prototype regressed rmbg f32 +21%, rmbg-strict +34%, lingbot keyframe/skyseg +26%/+32%, loma +28% process wall and SLANet f32 +17.5% although their gates were already green. Final cross-task A/B keeps rmbg/rmbg-strict fingerprints identical and p50 within 0.4%; SLANet f32 metrics/fingerprint are identical. Graphs without ocr_scalar_* remain byte-for-byte unchanged."
  - file: cuda_conv_transpose_prec/0001-conv-transpose-prec-f32-strict-sgemm.patch
    note: "Precision request for conv_transpose_2d_p0: adds ggml_conv_transpose_2d_p0_set_prec (op_params[1], the slot after the stride; CPU/Vulkan/Metal kernels read only op_params[0]). The sam3_merged CUDA 2x2/stride-2 fast path runs its four phase GEMMs through cublasSgemm on a handle whose default math mode is TF32, and conv_transpose had no way to opt out; OCR det F32 bisection showed every earlier op within rel 1e-6 and this op jump to rel 5.8e-4. With GGML_PREC_F32 the fast path saves the handle's math mode, runs the GEMMs with CUBLAS_DEFAULT_MATH (strict SGEMM) and restores it. Graphs that do not set the precision (sam3, lingbot, yolo, depth, moge) are unchanged."
  - file: vulkan_coopmat2_dependency/0001-vulkan-enable-khr-coopmat-with-coopmat2.patch
    note: "Vulkan device-creation spec fix (also absent upstream as of llama.cpp master): VK_NV_cooperative_matrix2 was added to ppEnabledExtensionNames whenever it is advertised, but its required dependency VK_KHR_cooperative_matrix (and the KHR cooperativeMatrix feature that coopmat2 shaders' CooperativeMatrixKHR capability needs) was enabled only while coopmat_support stayed true. coopmat_support is cleared by GGML_VK_DISABLE_COOPMAT and by the no-suitable-coopmat1-shape path, which left coopmat2 enabled without its dependency (VUID-vkCreateDevice-ppEnabledExtensionNames-01387; reproduced on RTX 4090 / driver 580.95.05 with VVL 1.4.350: 2 per device creation both with GGML_VK_DISABLE_COOPMAT=1 and under VVL, whose filtered coopmat1 properties hit the no-suitable-shape path). Tracks the advertised KHR extension separately and enables it plus its feature struct whenever coopmat2 is requested; coopmat_support keeps meaning 'use the coopmat1 shader paths', so pipeline selection is unchanged. Placed before sam3d_merged/0005 (CUDA-only files)."
  - file: sam3d_merged/0005-sam3d-precise-math-twins.patch
    note: "sam3d bit-parity inside the GGML_CUDA_FAST_MATH=ON build (the project default since the map-anything-ggml contract requires fast math). -use_fast_math is a per-translation-unit nvcc switch (ftz, approximate div/sqrt, __expf/__sinf/__erff intrinsic substitution), so the two upstream contracts (sam-3d-objects-ggml built OFF, map-anything-ggml built ON) can coexist by compiling the kernels sam3d reaches twice: (1) ggml-cuda/CMakeLists.txt attaches -use_fast_math per source instead of to the target, excluding sam3d-*.cu and the new precise/ directory; (2) precise/*-precise.cu re-include norm.cu, unary.cu, softmax.cu, upscale.cu and the four fattn-mma-f16 ncols2=1 template instances inside `namespace ggml_cuda_precise` (dependency headers pre-included at global scope), giving the fixup/combine kernels and the header-only launch_fattn template their own symbols - a plain second TU is not enough because launch_fattn<DV,ncols1,ncols2> is a weak COMDAT template that the linker merges with the fast-math instance TUs (measured: twinning only the two instance TUs sam3d uses still left the SS flow off by ULPs); (3) ggml_cuda_compute_forward and the RMS_NORM/UNARY fusers route nodes named sam3d_* (every node of the SAM 3D task graphs) to ggml_cuda_precise::compute_forward for NORM/GROUP_NORM/RMS_NORM/L2_NORM/UNARY/GLU/SQR/SQRT/SIN/COS/LOG/LEAKY_RELU/SOFT_MAX/UPSCALE and the gqa_ratio==1 F16 MMA flash-attention path (fattn.cu exposes ggml_cuda_flash_attn_ext_selects_mma_f16 for the eligibility check; masked/gqa/vec/tile shapes keep the fast dispatcher - sam3d never issues them). Sufficiency was established by TU-level bisection against the OFF build: {norm, unary, softmax, upscale, fattn, sam3d-*} precise with everything else (binbcast, cpy, convert, cuBLAS/MMF/MMQ GEMMs, conv2d, im2col) fast reproduces all 352 deterministic kidsroom stage dumps (MoGe conditions, PointPatch/DINO tokens, every SS flow step, SS decoder, SLAT cond tokens) bit-for-bit; softmax (pp_tokens), upscale (MoGe only) and the fattn family were each shown necessary; the GS decoder's atomic scatter stays nondeterministic even in OFF-vs-OFF runs and is not a gate. Measured with this patch on the ON build (CUDA sm_89, seed 42, 25 steps, kidsroom f16): 352/352 stage dumps identical to the OFF build, 842560 gaussians (OFF 842560; ON without this patch 841760), end-to-end conditions identical; MapAnything frames gate unchanged at 76/76 bit-exact vs the pristine cpp_ggml reference. Cost: +10 CUDA TUs (~1.7 MB of objects), zero runtime cost for non-sam3d nodes (one strncmp per node). Only compiled when GGML_SAM3D_OPS=ON and GGML_CUDA_FAST_MATH=ON (GGML_CUDA_SAM3D_PRECISE_TWINS); an OFF build has no twins and no routing. Must follow the earlier upstream CUDA patches: touches their ggml-cuda.cu compute_forward/fuser hunks."
  # Local model-owner integrations are rebased on the complete upstream chain.
  - file: ram_merged/0001-ram-owner-scoped-cuda-arithmetic.patch
    note: "RAM upstream arithmetic scoped to ram_tags_/ram_caption_ graph nodes: contiguous Q8_0 x F16 activations stay on CUDA; tagging uses F16 operands with F32 accumulation/output, caption uses F32 compute. Replaces upstream process-global compute env mutation. Other task dispatch and precision remain unchanged. GGML_MAX_NAME=128 already owned by the existing patch chain."
  - file: relation_merged/0001-relateanything-ggml.patch
    note: "RelateAnything v0.21.0 operators and strict arithmetic from upstream patch sha256 1a856e6ed60e2a80eb3f26516cfd6d3ad237b3266a488ca683f3b6a23eb48372, consolidated after RAM: CUDA/Vulkan/CPU custom operators and precision hints, owner-scoped CPU dot and CUDA fast/precise arithmetic matching upstream, without PyTorch/ATen attention dependencies. The upstream process-global ggml-runtime-options layer is intentionally replaced by AICore owner-scoped task options to avoid cross-task mutable state. Other task ownership and routes are preserved."
