# Combined GPU candidate: one llama source owner and one embedded ggml.
patches:
  - file: 0001-acv-cpu-operators.patch
    note: "At the current pin, instantmesh_cpu_matmul_ nodes retain frozen DINO/LRM CPU vec-dot dispatch without disabling global LLAMAFILE or changing attention/other tasks. Remove after an official per-node replacement; require original frozen numeric gates, clean replay and same-host performance regression checks."
  - file: 0002-acv-cuda-operators.patch
  - file: 0003-acv-cuda-dispatch-api.patch
  - file: 0004-acv-cuda-attention-linkage.patch
  - file: 0005-acv-vulkan-operators.patch
    note: "At the current pin, InstantMesh LRM instantmesh_lrm_convt_ retains pristine transposed-convolution dispatch; Synth single-row F16 instantmesh_sdf_matmul_ retains original GEMM reduction, not swapped-operand matvec. Other nodes and CPU/CUDA/Metal remain unchanged. Remove after an official node-compatibility replacement; require frozen per-output absolute/compatibility gates, clean replay, original consumers and same-host performance regression checks."
  - file: 0006-acv-cuda-native-output-stride.patch
  - file: 0007-acv-sam3d-allocation-size.patch
  - file: 0008-acv-vulkan-q4-k-copy-route.patch
  - file: 0009-acv-vulkan-pattern-short-circuit.patch
    note: "Short-circuit failed fusion-pattern matches without changing graph ordering, alias dependencies or supported fusions; model performance qualification remains required."
  - file: 0010-acv-vulkan-dependency-metadata.patch
    note: "Cache source and view-base metadata within one optimizer call; retain every direct and alias dependency. Requires predicate, graph-order and model regression."
  - file: 0011-acv-cuda-im2col-spatial-blocks.patch
    note: "Repartition low-channel image gathers without changing convolution arithmetic; require exact im2col and model-output regression."
  - file: 0012-acv-vulkan-im2col-spatial-blocks.patch
    note: "Repartition low-channel image gathers without changing convolution arithmetic; require exact im2col and model-output regression."
  - file: 0013-acv-elementwise-epilogue.patch
    note: "Explicit ADD/GELU epilogue requires a complete single-consumer fusion domain, final output offsets and input-allocation dependencies; CPU retains separate computation and the CUDA consumer is registered at the end. Require bitwise and model regression."
  - file: 0014-acv-depthwise-bias-api-cpu.patch
  - file: 0014-acv-depthwise-bias-cuda.patch
  - file: 0014-acv-depthwise-bias-vulkan.patch
    note: "Add F32 bias after DW write-out rounding; cover channels, batches, F16 rounding and unaligned bias views."
  - file: 0015-acv-llama-cuda-numerics.patch
    note: "Bitwise scoped LLM and non-LLM regression; cache CUDA graph naming semantics independently."
  - file: 0016-acv-vulkan-dw-bias-rounding.patch
    note: "Make Vulkan F16 intermediate-storage rounding explicit; preserve separate ADD arithmetic."
  - file: 0017-acv-vulkan-pool2d-dispatch.patch
    note: "Keep F16 POOL_2D workgroup and local-size metadata consistent; verify independent sentinels/oracles and real YOLO gates."
  - file: 0018-acv-vulkan-dw-debug-bias.patch
    note: "The DW result checker's CPU clone copies bias inputs, keeping diagnostic and actual computation semantics consistent."
  - file: 0019-acv-cuda-pool2d-average.patch
    note: "AVG sums in F32 before RNE division by area; require independent scalar/warp oracles and real-consumer gates."
  - file: 0020-acv-cuda-igemm-plan-owner.patch
    note: "Read the task's monotonic plan identity to prevent stale weights at reused addresses/shapes across models; require public-ABI model-switch and original accuracy/performance gates."
  - file: 0021-acv-openpcdet-igemm-f32.patch
    note: "OpenPCDet nodes named opcpd_conv permit WMMA TF32 igemm for F32 convolution; other F32 tasks retain strict fp32 fallback. Gate detection per box against the upstream OpenPCDet-GGML CUDA baseline using the same tensor-core arithmetic."
  - file: 0022-acv-openpcdet-tf32-conv2d.patch
    note: "Route opcpd_conv F32 convolution from WMMA igemm to the bitwise port of upstream OpenPCDet-GGML dispatch (Winograd/TF32 implicit GEMM/FMA); f16/q8 and other F32 task routes remain unchanged."
  - file: 0023-acv-openpcdet-sparse-ext.patch
    note: "OpenPCDet-GGML fused sparse convolution: sparse_gather (zero-fill row -1) plus sparse_scatter_add(_n) (kernel-group chunked scatter-add, folded bias, no concat). Only OpenPCDet CUDA-ext compact graphs emit these nodes; append operators to the enum, retaining existing op IDs and CPU/Vulkan behavior."
  - file: 0024-acv-cuda-depthwise7.patch
  - file: 0024-acv-vulkan-depthwise7.patch
    note: "RelateAnything 14c9744 DW7 specialization preserves four descriptors, actual view offsets, separate bias ADD and original fallbacks. Upstream acceptance does not replace this repository's numeric/performance gates."
  - file: 0024-acv-openpcdet-bn-fold-relu.patch
    note: "OpenPCDet-GGML fused BN-fold+ReLU operator (relu(x*scale+bias), CUDA float4 fast path and CPU scalar fallback). Only OpenPCDet CUDA-ext graphs (bev_backbone g_bn_fuse_relu) emit it; append the operator to the enum without changing CPU/Vulkan behavior."
  - file: 0025-acv-cuda-perf-op-profiler.patch
    note: "Port upstream OpenPCDet-GGML per-op CUDA event timing byte-for-byte (GGML_CUDA_PERF_OP=1, disabled by default); diagnostics only, with no arithmetic or graph-semantic changes. Rows are comparable to the upstream per-op table."
  - file: 0026-acv-openpcdet-deconv-gemm.patch
    note: "Byte-for-byte port of the OpenPCDet-GGML phase-decomposed transposed-convolution GEMM path (gather_phase + cuBLAS sgemm + scatter_phase; TF32 follows the handle math mode, and the GGML_CUDA_DISABLE_DECONV_GEMM debug gate is ported as well). Only F32 deblock nodes tagged opcpd_deconv take this path; f16 (SAM3) and every other task keep their existing routing, and CPU/Vulkan are untouched."
  - file: 0027-acv-cuda-add-gelu-epilogue.patch
    note: "Explicit F32 row-bias ADD/GELU write-out; preserve original arithmetic, fusion switches, and fallbacks for observable outputs, multiple consumers, non-adjacent nodes, layout constraints and unsafe aliasing. Original numeric and performance gates remain unchanged."
  - file: 0033-acv-llama-cuda-norm-parity.patch
    note: "Extend the 0015 pinned-llama numerics contract to RMS norm: llama LLM norm nodes (build_norm 'norm-<il>'/'norm' naming) keep the pinned scalar sum-of-squares accumulation instead of the newer float4 vectorized order, which flips near-tied greedy argmax tokens across the version gap. Owner-scoped by the strict-f32 op_params hint that the wevisone/vlx runtimes set on their LLM norm nodes through cp.cb_eval (ggml_rms_norm_set_hint, patch 0036); the llm task references the pristine-new vectorized kernel and leaves its norm nodes untagged, so it keeps the float4 path. clip/mtmd ViT norms are unnamed and never matched, and the fused norm+mul+rope kernel is byte-identical to the pinned upstream. Require the wevisone/vlx upstream parity gates, the llm pristine-new greedy-text gates, and non-LLM bitwise regression."
  - file: 0035-acv-llama-cuda-q6k-mmvq-parity.patch
    note: "Extend the 0015 pinned-llama numerics contract to q6_K mmvq: keep the pinned VDR-1 dot (single-int loads, per-i dp4a) instead of the newer VDR-2 vectorization whose doubled per-thread partial-sum span reorders the fp32 reduction and flips near-tied greedy argmax in q4_K_M LLMs (output/ffn_down tensors are q6_K). The revert is global to q6_K mmvq and matches both pinned upstreams, which use VDR-1 (WeVisOne llama 620d2225; map-anything-ggml ggml v0.24.0 VDR_Q6_K_Q8_1_MMVQ=1). The newer VDR-2 reorders the fp32 reduction and diverges from both (vggt-omega q6_K max_diff 1.19e-7 under VDR-2). With VDR-1 the map_anything dust3r/vggt-omega q6_K upstream gates are bit-exact (max_diff==0) and llm/vlx carry no q6_K tensors (q8_0/f16), so they are unaffected. mapanything/pi3x q6_K carry a separate pre-existing residual diff (points/pose ~1e-5, local_points/points ~3e-3) identical under VDR-1 and VDR-2, tracked apart from this patch. Isolated by controlled repin bisection (vecdotq.cuh alone reproduces/restores the divergence; mmvq.cu and mmq.cuh proven innocent). Require the wevisone q4_K_M upstream parity rows, the map_anything dust3r/vggt-omega q6_K upstream bitwise gates, and non-LLM bitwise regression."

  - file: 0036-acv-rms-norm-hint-api.patch
    note: "Public ggml_rms_norm_set_hint API mirroring ggml_norm_set_hint so task runtimes can tag llama LLM RMS-norm nodes with the strict-f32 hint through cp.cb_eval. Consumed by 0033 to owner-scope the pinned scalar norm to wevisone/vlx (old-pinned upstream) while the llm task (pristine-new upstream) keeps the vectorized kernel. Registered in every backend manifest because the task runtime calls it unconditionally."
