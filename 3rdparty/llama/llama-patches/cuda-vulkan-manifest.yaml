    note: "Repartition low-channel image gathers without changing convolution arithmetic; require exact im2col and model-output regression."
  - file: 0012-acv-vulkan-im2col-spatial-blocks.patch
    note: "Repartition low-channel image gathers without changing convolution arithmetic; require exact im2col and model-output regression."
  - file: 0013-acv-elementwise-epilogue.patch
    note: "显式 ADD/GELU epilogue：完整单消费者融合域、最终输出偏移和输入分配依赖；CPU/CUDA 保留独立计算，必须通过逐位及模型回归。"
  - file: 0014-acv-depthwise-bias-api-cpu.patch
  - file: 0014-acv-depthwise-bias-cuda.patch
  - file: 0014-acv-depthwise-bias-vulkan.patch
