  - file: 0018-acv-vulkan-dw-debug-bias.patch
    note: "DW 结果检查器的 CPU clone 复制 bias 输入，保持诊断与实际计算语义一致。"
  - file: 0019-acv-cuda-pool2d-average.patch
    note: "AVG 在 F32 中先求和再 RNE 除面积；scalar/warp 独立 oracle 和真实消费者门必需。"
  - file: 0020-acv-cuda-igemm-plan-owner.patch
    note: "读取 task 的单调计划身份，防止同地址/形状跨模型复用旧权重；公共 ABI 模型切换及原精度/性能门必需。"
