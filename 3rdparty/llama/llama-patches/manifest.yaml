# CPU migration experiment only. Not the production GPU patch chain.
patches:
  - file: 0001-acv-cpu-operators.patch
    note: "At the current pin, instantmesh_cpu_matmul_ nodes retain frozen DINO/LRM CPU vec-dot dispatch without disabling global LLAMAFILE or changing attention/other tasks. Remove after an official per-node replacement; require original frozen numeric gates, clean replay and same-host performance regression checks."
  - file: 0013-acv-elementwise-hint-api.patch
    note: "Keep the same graph annotation API across backends; CPU retains separate ADD/GELU fallback."
  - file: 0014-acv-depthwise-bias-api-cpu.patch
    note: "Add bias after DW F32 write-out; cover F32/F16 weights, channels and batches."
  - file: 0023-acv-openpcdet-sparse-ext.patch
    note: "CPU build compiles the openpcdet sparse backbone unconditionally (sparse_ops.cpp / voxelnext.cpp call ggml_sparse_gather and ggml_sparse_scatter_add_n); the patch carries the host ggml-cpu implementations, so every backend manifest that builds those TUs must register it (cuda and cuda-vulkan chains already do)."
