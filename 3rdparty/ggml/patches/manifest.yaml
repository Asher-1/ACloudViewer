# Ordered ggml unified-diff patches applied at ExternalProject fetch time.
# Add new entries here; do not edit fetched ggml sources in-place.
# All modifications go through these unified-diff files (validated and applied
# with `git apply`) so the fetched tree is byte-reproducible on every platform.
# Previously this was split across legacy Python mutators; those have been
# converted to patches (see apply_ggml_patches.py header).
#
patches:
  - file: aliked_merged/0001-vulkan-aliked.patch
    note: ALIKED Vulkan extraction (compute, DCN, SDDH, DKD, public C API, shader registration)
  - file: msvc_vulkan/0001-msvc-vulkan-hpp-compat.patch
    note: MSVC compatibility for Vulkan-Hpp __faststorefence intrinsic
  - file: cpu_all_variants/0001-cpu-all-variants-compiler-checks.patch
    note: "Gate CPU ALL_VARIANTS BF16/AMX/AVX-VNNI variants behind compiler-flag checks; remove apple_m4 (+nosve+sme unreliable on Apple Clang); inert when GGML_CPU_ALL_VARIANTS=OFF"
  - file: metal_merged/0001-metal-optimizations.patch
    note: "Metal optimizations: conv_transpose_2d parallelized over IC with tree reduction, and flash-attn large-sequence support (relax ne01 assert, raise MAX_COMMAND_BUFFERS to 64, auto-tune n_cb/n_main); inert when Metal is OFF"
  - file: cuda_mmq/0001-cuda-mmq-force-static.patch
    note: "Force MMQ kernels and static cudart when GGML_CUDA_FORCE_MMQ=ON; removes cuBLAS/cublasLt link dependency so libggml-cuda.so needs only libcuda.so.1 (NVIDIA driver); inert when GGML_CUDA_FORCE_MMQ=OFF"
  - file: vulkan_parallel/0001-vulkan-shaders-gen-skip-parallel-trycompile.patch
    note: "vulkan-shaders-gen: pre-seed CMAKE_C/CXX_ABI_COMPILED=1 so the nested configure skips the ABI/works try_compile, removing the MSBuild parallel file-lock race (MSB3491) on .lastbuildstate"
  - file: rmbg_merged/0001-rmbg-custom-ops.patch
    note: "RMBG background-removal custom ops: fused CUDA layer-norm/affine/deform/conv/Swin kernels plus Vulkan scalar direct-conv, named CM1 matmul selection, Flash attention and task dispatch; cuDNN remains optional; CPU/Metal fall back to vanilla ggml ops"
  - file: rfdetr_merged/0001-ggml-cpu-fold-broadcast-iterations.patch
    note: "RF-DETR CPU perf: fold broadcast iterations into the llamafile sgemm epilogue loop; inert when GGML_LLAMAFILE=OFF"
  - file: yolo_merged/0001-yolo-ggml-backend-integration.patch
    note: "YOLO GPU ops: ggml_conv_2d_direct_bias_silu API (ggml.h/ggml.c), CUDA direct/dw/transpose conv + pool/upscale/scale kernels, Vulkan F16 conv2d pipeline; merged against the aliked/rmbg/vulkan_parallel chain so only YOLO-specific hunks remain"
